const TimelineModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledSets] = useState(() => {
    const indices = TIMELINE_SETS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [order, setOrder] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [showHints, setShowHints] = useState(false);
  const [completed, setCompleted] = useState(new Set());

  const setIndex = shuffledSets[stepIndex];
  const currentSet = TIMELINE_SETS[setIndex];

  useEffect(() => {
    const shuffled = [...currentSet.items].sort(() => Math.random() - 0.5);
    setOrder(shuffled.map((i) => i.id));
    setSubmitted(false);
    setScore(null);
    setShowHints(false);
  }, [stepIndex]);

  const handleDragStart = (idx) => setDragIdx(idx);

  const handleDrop = (targetIdx) => {
    if (dragIdx === null || dragIdx === targetIdx) return;
    const newOrder = [...order];
    const [moved] = newOrder.splice(dragIdx, 1);
    newOrder.splice(targetIdx, 0, moved);
    setOrder(newOrder);
    setDragIdx(null);
  };

  const moveItem = (idx, direction) => {
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= order.length) return;
    const newOrder = [...order];
    [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
    setOrder(newOrder);
  };

  const handleSubmit = () => {
    const correct = currentSet.correctOrder;
    let pts = 0;
    const match = order.every((id, i) => id === correct[i]);
    if (match) {
      pts = 2;
    } else {
      for (let skip = 0; skip < order.length; skip++) {
        const filtered = order.filter((_, i) => i !== skip);
        const correctFiltered = correct.filter((_, i) => i !== skip);
        if (filtered.length === correctFiltered.length && filtered.every((id, i) => id === correctFiltered[i])) {
          pts = 1;
          break;
        }
      }
    }
    setScore(pts);
    setSubmitted(true);
    if (pts > 0 && !completed.has(setIndex)) {
      onXP(pts * 5);
      setCompleted((prev) => new Set([...prev, setIndex]));
    }
  };

  const getItemById = (id) => currentSet.items.find((i) => i.id === id);

  if (showIntro) {
    return <TimelineIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 20 }}>
        {shuffledSets.map((si, i) => (
          <button
            key={TIMELINE_SETS[si].id}
            onClick={() => setStepIndex(i)}
            style={{
              padding: "5px 10px",
              border: i === stepIndex ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
              background: completed.has(si) ? MC.grassDark : i === stepIndex ? MC.bedrockLight : MC.bedrock,
              color: completed.has(si) ? MC.emerald : i === stepIndex ? MC.gold : MC.textDim,
              cursor: "pointer",
              fontSize: 11,
              fontFamily: mcFont,
              fontWeight: 700,
              boxShadow: i === stepIndex ? mcBoxShadowDark : "none",
            }}
          >
            {completed.has(si) ? "✓ " : ""}{TIMELINE_SETS[si].exam.replace("Tijdvak", "T")}
          </button>
        ))}
      </div>

      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 16, marginBottom: 16, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 4, fontFamily: mcFont, letterSpacing: 1 }}>
          ⛏️ {currentSet.exam}
        </div>
        <div style={{ fontSize: 17, fontWeight: 700, color: MC.text, marginBottom: 4, fontFamily: mcFont }}>
          {currentSet.theme}
        </div>
        <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont }}>
          Sleep de gebeurtenissen in de juiste volgorde (oud → nieuw), of gebruik de pijltjes.
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 16 }}>
        {order.map((id, idx) => {
          const item = getItemById(id);
          const isCorrect = submitted && currentSet.correctOrder[idx] === id;
          const isWrong = submitted && currentSet.correctOrder[idx] !== id;

          return (
            <div
              key={id}
              draggable={!submitted}
              onDragStart={() => handleDragStart(idx)}
              onDragOver={(e) => e.preventDefault()}
              onDrop={() => handleDrop(idx)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                padding: "10px 12px",
                background: isCorrect ? "#2d5a1e" : isWrong ? "#5a1e1e" : MC.bedrock,
                border: isCorrect ? `2px solid ${MC.emerald}` : isWrong ? `2px solid ${MC.redstone}` : dragIdx === idx ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                cursor: submitted ? "default" : "grab",
                transition: "all 0.15s",
                boxShadow: dragIdx === idx ? `0 0 8px ${MC.gold}44` : "none",
              }}
            >
              <div style={{
                width: 28, height: 28,
                background: isCorrect ? MC.emerald : isWrong ? MC.redstone : MC.cobble,
                border: `2px solid ${isCorrect ? "#0a8a3a" : isWrong ? "#aa0000" : MC.stoneDark}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 13, fontWeight: 900, color: MC.white, flexShrink: 0,
                fontFamily: mcFont,
              }}>
                {idx + 1}
              </div>

              <div style={{ flex: 1, fontSize: 13, color: MC.text, lineHeight: 1.4, fontFamily: mcFont }}>
                {item.text}
                {submitted && (
                  <span style={{ color: MC.diamond, fontSize: 11, marginLeft: 8, fontWeight: 700 }}>
                    ({item.period})
                  </span>
                )}
              </div>

              {!submitted && (
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  <button onClick={() => moveItem(idx, -1)} style={{
                    width: 26, height: 22, border: `2px solid ${MC.stoneDark}`,
                    background: idx === 0 ? MC.bedrock : MC.cobble, color: idx === 0 ? MC.stoneDark : MC.white,
                    cursor: idx === 0 ? "default" : "pointer", fontSize: 11, fontFamily: mcFont, fontWeight: 900,
                  }}>▲</button>
                  <button onClick={() => moveItem(idx, 1)} style={{
                    width: 26, height: 22, border: `2px solid ${MC.stoneDark}`,
                    background: idx === order.length - 1 ? MC.bedrock : MC.cobble,
                    color: idx === order.length - 1 ? MC.stoneDark : MC.white,
                    cursor: idx === order.length - 1 ? "default" : "pointer", fontSize: 11, fontFamily: mcFont, fontWeight: 900,
                  }}>▼</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {!submitted ? (
          <>
            <button onClick={handleSubmit} style={{
              padding: "10px 24px", border: `3px solid ${MC.grassDark}`,
              background: `linear-gradient(180deg, ${MC.grassBright} 0%, ${MC.grass} 50%, ${MC.grassDark} 100%)`,
              color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
              boxShadow: `inset 2px 2px 0 ${MC.grassBright}88, inset -2px -2px 0 ${MC.grassDark}`,
              letterSpacing: 1, textShadow: `2px 2px 0 ${MC.grassDark}`,
            }}>
              ✓ CONTROLEER
            </button>
            <button onClick={() => setShowHints(!showHints)} style={{
              padding: "10px 16px", border: `2px solid ${MC.goldDark}`,
              background: MC.bedrockLight, color: MC.gold, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
            }}>
              {showHints ? "Verberg hints" : "💡 Hints"}
            </button>
          </>
        ) : (
          <div style={{
            padding: 16, width: "100%",
            background: score === 2 ? "#1a2e28" : score === 1 ? "#2a2a28" : "#2a2232",
            border: `3px solid ${score === 2 ? MC.emerald : score === 1 ? MC.gold : MC.redstone}`,
          }}>
            <div style={{ fontSize: 18, fontWeight: 900, fontFamily: mcFont, color: score === 2 ? MC.emerald : score === 1 ? MC.gold : MC.redstone }}>
              {score === 2 ? "⭐ PERFECT! 2/2 punten" : score === 1 ? "👍 BIJNA! 1/2 punten" : "💀 HELAAS, 0/2 punten"}
            </div>
            <div style={{ fontSize: 12, color: MC.textDim, marginTop: 6, fontFamily: mcFont }}>
              Juiste volgorde: {currentSet.correctOrder.join(", ")}
            </div>
            <button onClick={() => {
              setStepIndex((prev) => (prev + 1) % shuffledSets.length);
            }} style={{
              marginTop: 12, padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
              background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
              textShadow: `1px 1px 0 ${MC.grassDark}`,
            }}>
              Volgende set →
            </button>
          </div>
        )}
      </div>

      {showHints && !submitted && (
        <div style={{
          marginTop: 16, padding: 16,
          background: MC.bedrockLight, border: `2px solid ${MC.goldDark}`,
        }}>
          <div style={{ fontSize: 14, fontWeight: 900, color: MC.gold, marginBottom: 8, fontFamily: mcFont }}>💡 ANKERPUNTEN</div>
          <div style={{ fontSize: 12, color: MC.textDim, lineHeight: 1.8, fontFamily: mcFont }}>
            🇬🇧 1620 Pilgrim Fathers • 1807 Verbod slavenhandel • 1833 Abolition Act • 1851 Wereldtentoonstelling • 1857 Indiase Opstand • 1885 Indian National Congress
            <br />
            🇩🇪 1919 Versailles • 1933 Hitler Rijkskanselier • 1939 Inval Polen • 1948 Blokkade Berlijn • 1961 Bouw Muur • 1989 Val Muur
            <br />
            🇳🇱 1949 Onafhankelijkheid Indonesië • 1973 Oliecrisis • 1995 Srebrenica • 2002 Moord Fortuyn
          </div>
        </div>
      )}
    </div>
  );
};

const PatternIntro = ({ onFinish }) => {
  const [started, setStarted] = useState(false);
  const [visibleCount, setVisibleCount] = useState(0);
  const [expandedIdx, setExpandedIdx] = useState(null);
  const [allDone, setAllDone] = useState(false);
  const scrollRef = useRef(null);

  const startAnimation = () => {
    setStarted(true);
    setVisibleCount(1);
    setExpandedIdx(0);
  };

  const showNext = () => {
    if (visibleCount < PATTERN_INTRO_DATA.length) {
      const next = visibleCount;
      setVisibleCount(next + 1);
      setExpandedIdx(next);
    } else if (!allDone) {
      setAllDone(true);
    }
  };

  const skipToEnd = () => {
    setVisibleCount(PATTERN_INTRO_DATA.length);
    setExpandedIdx(null);
    setAllDone(true);
  };

  useEffect(() => {
    if (scrollRef.current && visibleCount > 0) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [visibleCount, expandedIdx, allDone]);

  if (!started && visibleCount === 0) {
    return (
      <div style={{ textAlign: "center", padding: "40px 20px" }}>
        <div style={{ fontSize: 64, marginBottom: 16, lineHeight: 1 }}>🎯</div>
        <div style={{
          fontSize: 22, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
          textShadow: `2px 2px 0 ${MC.goldDark}`, letterSpacing: 2, marginBottom: 8,
        }}>

const PatternModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledOrder] = useState(() => {
    const indices = PATTERN_QUESTIONS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [completed, setCompleted] = useState(new Set());

  const qIndex = shuffledOrder[stepIndex];
  const q = PATTERN_QUESTIONS[qIndex];
  const isCorrect = selected === q.correctPattern;

  const handleSubmit = () => {
    setSubmitted(true);
    if (isCorrect && !completed.has(qIndex)) {
      onXP(5);
      setCompleted((prev) => new Set([...prev, qIndex]));
    }
  };

  const next = () => {
    setStepIndex((prev) => (prev + 1) % shuffledOrder.length);
    setSelected(null);
    setSubmitted(false);
  };

  if (showIntro) {
    return <PatternIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, alignItems: "center" }}>
        <div style={{ fontSize: 13, color: MC.textDark, fontFamily: mcFont }}>
          Vraag {stepIndex + 1} / {PATTERN_QUESTIONS.length}
        </div>
        <div style={{ fontSize: 13, color: MC.emerald, fontFamily: mcFont, fontWeight: 700 }}>
          ✓ {completed.size} goed
        </div>
      </div>

      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 20, marginBottom: 20, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 8, fontFamily: mcFont, letterSpacing: 1 }}>
          📜 {q.exam}
        </div>
        <div style={{ fontSize: 15, color: MC.text, lineHeight: 1.6, marginBottom: 12, fontFamily: mcFont }}>
          "{q.question}"
        </div>
        <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont }}>
          Welk vraagpatroon is dit? Klik op het juiste type.
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 20 }}>
        {PATTERN_TYPES.map((p) => {
          const isThis = selected === p.id;
          const showCorrect = submitted && p.id === q.correctPattern;
          const showWrong = submitted && isThis && !isCorrect;

          return (
            <button
              key={p.id}
              onClick={() => !submitted && setSelected(p.id)}
              style={{
                padding: "12px 8px",
                border: showCorrect ? `3px solid ${MC.emerald}` : showWrong ? `3px solid ${MC.redstone}` : isThis ? `3px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                background: showCorrect ? "#1a2e28" : showWrong ? "#2a2232" : isThis ? MC.bedrockLight : MC.bedrock,
                color: showCorrect ? MC.emerald : showWrong ? MC.redstone : isThis ? MC.gold : MC.textDim,
                cursor: submitted ? "default" : "pointer",
                fontSize: 13,
                fontWeight: 700,
                fontFamily: mcFont,
                textAlign: "center",
                transition: "all 0.1s",
              }}
            >
              <div style={{ fontSize: 20, marginBottom: 2 }}>{p.emoji}</div>
              {p.name}
            </button>
          );
        })}
      </div>

      {!submitted ? (
        <button onClick={handleSubmit} disabled={!selected} style={{
          padding: "10px 24px", border: selected ? `3px solid ${MC.grassDark}` : `2px solid ${MC.stoneDark}`,
          background: selected ? `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})` : MC.cobble,
          color: selected ? MC.white : MC.stoneDark,
          fontSize: 15, fontWeight: 900, cursor: selected ? "pointer" : "default", fontFamily: mcFont,
          textShadow: selected ? `2px 2px 0 ${MC.grassDark}` : "none", letterSpacing: 1,
        }}>
          ✓ CONTROLEER
        </button>
      ) : (
        <div style={{
          padding: 16,
          background: isCorrect ? "#1a2e28" : "#2a2232",
          border: `3px solid ${isCorrect ? MC.emerald : MC.redstone}`,
        }}>
          <div style={{ fontSize: 16, fontWeight: 900, color: isCorrect ? MC.emerald : MC.redstone, marginBottom: 8, fontFamily: mcFont }}>
            {isCorrect ? "⭐ GOED! " : "💀 NIET HELEMAAL. "}
            Het is: {PATTERN_TYPES.find((p) => p.id === q.correctPattern)?.emoji}{" "}
            {PATTERN_TYPES.find((p) => p.id === q.correctPattern)?.name}
          </div>
          <div style={{ fontSize: 13, color: MC.text, lineHeight: 1.6, marginBottom: 10, fontFamily: mcFont }}>
            {q.explanation}
          </div>
          <div style={{ fontSize: 12, color: MC.textDim, marginBottom: 12, fontFamily: mcFont }}>
            <strong style={{ color: MC.gold }}>Signaalwoorden:</strong>{" "}
            {q.signals.map((s, i) => (
              <span key={i} style={{
                background: "#2a2a28", color: MC.gold, padding: "2px 6px",
                border: `1px solid ${MC.goldDark}`, marginRight: 4, fontSize: 11,
                fontFamily: mcFont, fontWeight: 700,
              }}>
                {s}
              </span>
            ))}
          </div>
          <button onClick={next} style={{
            padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
            background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
            textShadow: `1px 1px 0 ${MC.grassDark}`,
          }}>
            Volgende vraag →
          </button>
        </div>
      )}
    </div>
  );
};

                { letter: "B", text: p.B, color: MC.gold },
              ].map((s, j) => (
                <div key={j} style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
                  <span style={{ fontSize: 13, fontWeight: 900, color: s.color, fontFamily: mcFont, minWidth: 16 }}>{s.letter}</span>
                  <span style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont, lineHeight: 1.5 }}>{s.text}</span>
                </div>
              ))}
            </div>

        ))}
      </div>
    ),

    // PAGE 2: Echt voorbeeld + cockpit-tips
    () => (
      <div>
        <div style={{
          fontSize: 18, fontWeight: 900, color: MC.diamond, fontFamily: mcFont,
          textAlign: "center", marginBottom: 16, letterSpacing: 1,
        }}>
          📝 ZO ZIET EEN VOLLEDIG ANTWOORD ERUIT
        </div>

        {/* Example */}
        <div style={{ padding: 14, background: "#1e2438", border: `2px solid ${MC.diamond}`, marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont, fontStyle: "italic", marginBottom: 10 }}>
            Examen 2024: "Geef aan welke kritiek Million weergeeft op de werkwijze van de Europese Unie."
          </div>
          {[
            { letter: "A", color: MC.emerald, text: "De kritiek is dat de Europese Unie wel praat, maar niet ingrijpt." },
            { letter: "B", color: MC.gold, text: "Dit zie je in de prent: de leiders praten rustig over 'kogelzakken' terwijl er op de achtergrond mensen worden doodgeschoten." },
            { letter: "K", color: MC.diamond, text: "(Hier niet nodig, maar: het onvermogen van de EU om in te grijpen.)" },
          ].map((s, i) => (
            <div key={i} style={{
              display: "flex", gap: 10, alignItems: "baseline", marginBottom: 6,
            }}>
              <div style={{
                minWidth: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center",
                background: s.color, color: MC.bedrock, fontSize: 14, fontWeight: 900, fontFamily: mcFont,
              }}>
                {s.letter}
              </div>
              <div style={{ fontSize: 14, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
                {s.text}

            </div>
          ))}
        </div>

        {/* Cockpit tips removed - now on main screen */}

        {/* Final ready box */}
        <div style={{
          marginTop: 16, padding: 16, textAlign: "center",
          background: "#1a2e28", border: `2px solid ${MC.emerald}`,
        }}>
          <div style={{ fontSize: 16, fontWeight: 900, color: MC.emerald, fontFamily: mcFont, marginBottom: 6 }}>
            💡 IN DE OEFENINGEN HIERNA...
          </div>
          <div style={{ fontSize: 14, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
            Krijg je een echte examenvraag. Eerst herken je het <strong style={{ color: MC.gold }}>patroon</strong>, daarna kies je voor elke stap (<strong style={{ color: MC.emerald }}>A</strong>, <strong style={{ color: MC.diamond }}>K</strong>, <strong style={{ color: MC.gold }}>B</strong>) het beste antwoord.

  const totalPages = pages.length;

  return (
    <div>
      {/* Page counter */}
      <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 16 }}>
        {pages.map((_, i) => (
          <div key={i} style={{
            width: i === page ? 24 : 10, height: 10,
            background: i === page ? "#7a8abf" : MC.stoneDark,
            transition: "all 0.3s ease",
          }} />

      </div>

      {/* Content */}
      <div ref={scrollRef} style={{ maxHeight: 500, overflowY: "auto", scrollBehavior: "smooth" }}>
        {pages[page]()}
      </div>

      {/* Navigation */}
      <div style={{ display: "flex", justifyContent: "center", gap: 12, marginTop: 20 }}>
        {page > 0 && (
          <button onClick={() => setPage(page - 1)} style={{
            padding: "8px 20px", border: `2px solid ${MC.stoneDark}`,
            background: MC.bedrock, color: MC.textDim,
            fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
          }}>
            ← TERUG
          </button>
        )}
        {page < totalPages - 1 ? (
          <button onClick={() => setPage(page + 1)} style={{
            padding: "10px 28px", border: `3px solid #4a5a8a`,
            background: "linear-gradient(180deg, #7a8abf, #5a6a9a, #4a5a8a)",
            color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
            textShadow: "1px 1px 0 #4a5a8a", letterSpacing: 1,
            boxShadow: "inset 2px 2px 0 #7a8abf88, inset -2px -2px 0 #4a5a8a",
          }}>
            VOLGENDE →
          </button>
        ) : (
          <button onClick={onFinish} style={{
            padding: "12px 32px", border: `3px solid ${MC.grassDark}`,
            background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`,
            color: MC.white, fontSize: 16, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
            textShadow: `2px 2px 0 ${MC.grassDark}`, letterSpacing: 1,
            boxShadow: `inset 2px 2px 0 ${MC.grassBright}88, inset -2px -2px 0 ${MC.grassDark}`,
          }}>
            START MET OEFENEN →
          </button>
        )}
      </div>

      {/* Skip */}
      {page < totalPages - 1 && (
        <div style={{ textAlign: "center", marginTop: 12 }}>
          <button onClick={onFinish} style={{
            background: "none", border: "none", color: MC.textDark,
            fontSize: 12, cursor: "pointer", fontFamily: mcFont,
          }}>
            Overslaan →
          </button>
        </div>
      )}
    </div>
  );
};

const AKBModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledOrder] = useState(() => {
    const indices = AKB_QUESTIONS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [step, setStep] = useState(0); // 0=pattern, 1=A, 2=K, 3=B, 4=result
  const [patternGuess, setPatternGuess] = useState(null);
  const [answers, setAnswers] = useState({ A: null, K: null, B: null });
  const [completed, setCompleted] = useState(new Set());

  const qIndex = shuffledOrder[stepIndex];
  const q = AKB_QUESTIONS[qIndex];
  const steps = ["pattern", "A", "K", "B", "result"];
  const currentStep = steps[step];
  const patternInfo = PATTERN_TYPES.find((p) => p.id === q.pattern);

  const [patternSubmitted, setPatternSubmitted] = useState(false);

  const handlePatternSelect = (id) => {
    if (!patternSubmitted) setPatternGuess(id);
  };

  const handlePatternConfirm = () => {
    setPatternSubmitted(true);
  };

  const handlePatternContinue = () => {
    setStep(1);
  };

  const handleAnswerSelect = (key, idx) => {
    setAnswers((prev) => ({ ...prev, [key]: idx }));
    if (key === "B") {
      setTimeout(() => setStep(4), 400);
      const allCorrect = answers.A === q.steps.A.correct && answers.K === q.steps.K.correct && idx === q.steps.B.correct;
      if (allCorrect && !completed.has(qIndex)) {
        onXP(10);
        setCompleted((prev) => new Set([...prev, qIndex]));
      }
    } else {
      setTimeout(() => setStep((s) => s + 1), 400);
    }
  };

  const next = () => {
    setStepIndex((prev) => (prev + 1) % shuffledOrder.length);
    setStep(0);
    setPatternGuess(null);
    setPatternSubmitted(false);
    setAnswers({ A: null, K: null, B: null });
  };

  const getScore = () => {
    let s = 0;
    if (answers.A === q.steps.A.correct) s++;
    if (answers.K === q.steps.K.correct) s++;
    if (answers.B === q.steps.B.correct) s++;
    return s;
  };

  const stepLabels = [
    { label: "Patroon", icon: "🔍" },
    { label: "A", icon: "💬" },
    { label: "K", icon: "🔗" },
    { label: "B", icon: "📄" },
    { label: "Score", icon: "⭐" },
  ];

  if (showIntro) {
    return <AKBIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, alignItems: "center" }}>
        <div style={{ fontSize: 13, color: MC.textDark, fontFamily: mcFont }}>
          Oefening {stepIndex + 1} / {AKB_QUESTIONS.length}
        </div>
        <div style={{ fontSize: 13, color: MC.emerald, fontFamily: mcFont, fontWeight: 700 }}>
          ✓ {completed.size} afgerond
        </div>
      </div>

      {/* Progress steps */}
      <div style={{ display: "flex", gap: 4, marginBottom: 20 }}>
        {stepLabels.map((s, i) => (
          <div key={i} style={{
            flex: 1, padding: "8px 4px", textAlign: "center",
            background: i === step ? MC.bedrockLight : i < step ? "#1a2e28" : MC.bedrock,
            border: i === step ? `2px solid ${MC.gold}` : i < step ? `2px solid ${MC.emerald}44` : `2px solid ${MC.stoneDark}`,
            fontSize: 12, color: i === step ? MC.gold : i < step ? MC.emerald : MC.textDark, fontFamily: mcFont, fontWeight: 700,
          }}>
            {s.icon} {s.label}
          </div>
        ))}
      </div>

      {/* Question context */}
      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 20, marginBottom: 16, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 6, fontFamily: mcFont, letterSpacing: 1 }}>{q.exam}</div>
        <div style={{ fontSize: 15, color: MC.text, lineHeight: 1.6, marginBottom: 8, fontFamily: mcFont }}>"{q.question}"</div>
        <div style={{ fontSize: 13, color: MC.textDim, fontStyle: "italic", fontFamily: mcFont }}>📎 {q.context}</div>
      </div>

      {/* Step: Pattern recognition */}
      {currentStep === "pattern" && (
        <div>
          <div style={{ fontSize: 14, color: MC.text, marginBottom: 12, fontFamily: mcFont }}>Stap 1: Welk vraagpatroon is dit?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            {PATTERN_TYPES.map((p) => {
              const isSelected = patternGuess === p.id;
              const showCorrect = patternSubmitted && p.id === q.pattern;
              const showWrong = patternSubmitted && isSelected && p.id !== q.pattern;
              return (
                <button
                  key={p.id}
                  onClick={() => handlePatternSelect(p.id)}
                  style={{
                    padding: "12px", 
                    border: showCorrect ? `3px solid ${MC.emerald}` : showWrong ? `3px solid ${MC.redstone}` : isSelected ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                    background: showCorrect ? "#1a2e28" : showWrong ? "#2a2232" : isSelected ? MC.bedrockLight : MC.bedrock,
                    color: showCorrect ? MC.emerald : showWrong ? MC.redstone : isSelected ? MC.gold : MC.textDim,
                    cursor: patternSubmitted ? "default" : "pointer", fontSize: 13, fontFamily: mcFont, fontWeight: 700, textAlign: "center",
                  }}
                >
                  {p.emoji} {p.name}
                </button>
              );
            })}
          </div>
          
          {/* Before submit: show confirm button */}
          {patternGuess && !patternSubmitted && (
            <button onClick={handlePatternConfirm} style={{
              marginTop: 12, padding: "10px 24px", border: `3px solid ${MC.grassDark}`,
              background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`,
              color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
              textShadow: `2px 2px 0 ${MC.grassDark}`, letterSpacing: 1,
            }}>
              ✓ BEVESTIG
            </button>
          )}

          {/* After submit: show feedback */}
          {patternSubmitted && (
            <div style={{
              marginTop: 12, padding: 16,
              background: patternGuess === q.pattern ? "#1a2e28" : "#2a2820",
              border: `3px solid ${patternGuess === q.pattern ? MC.emerald : MC.gold}`,
            }}>
              {patternGuess === q.pattern ? (
                <div style={{ fontSize: 14, fontWeight: 900, color: MC.emerald, fontFamily: mcFont }}>
                  ⭐ GOED! Dit is inderdaad {patternInfo?.emoji} {patternInfo?.name}.
                </div>
              ) : (
                <div>
                  <div style={{ fontSize: 14, fontWeight: 900, color: MC.redstone, fontFamily: mcFont, marginBottom: 6 }}>
                    ✘ Niet helemaal — dit is eigenlijk {patternInfo?.emoji} {patternInfo?.name}.
                  </div>
                </div>
              )}
              <div style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.6, marginTop: 8 }}>
                {q.patternTip}
              </div>
              {q.signals && (
                <div style={{ marginTop: 8, fontSize: 12, color: MC.textDim, fontFamily: mcFont }}>
                  <strong style={{ color: MC.gold }}>Signaalwoorden:</strong>{" "}
                  {q.signals.map((s, i) => (
                    <span key={i} style={{
                      background: "#2a2a28", color: MC.gold, padding: "2px 6px",
                      border: `1px solid ${MC.goldDark}`, marginRight: 4, fontSize: 11,
                      fontFamily: mcFont, fontWeight: 700, display: "inline-block", marginTop: 4,
                    }}>
                      {s}
                    </span>
                  ))}
                </div>
              )}
              <button onClick={handlePatternContinue} style={{
                marginTop: 12, padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
                background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
                textShadow: `1px 1px 0 ${MC.grassDark}`,
              }}>
                Verder met de vraag →
              </button>
            </div>
          )}
        </div>
      )}

      {/* Steps: A, K, B */}
      {(currentStep === "A" || currentStep === "K" || currentStep === "B") && (
        <div>
          <div style={{
            fontSize: 14, fontWeight: 600, marginBottom: 12,
            color: currentStep === "A" ? MC.diamond : currentStep === "K" ? MC.gold : MC.emerald,
          }}>
            Stap {step + 1}: {currentStep === "A" ? "A = Antwoord" : currentStep === "K" ? "K = Koppeling" : "B = Bewijs"}
          </div>
          <div style={{ fontSize: 14, color: MC.text, marginBottom: 12, fontFamily: mcFont }}>
            {q.steps[currentStep].prompt}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {q.steps[currentStep].options.map((opt, i) => {
              const isSelected = answers[currentStep] === i;
              return (
                <button
                  key={i}
                  onClick={() => handleAnswerSelect(currentStep, i)}
                  style={{
                    padding: "12px 16px",  textAlign: "left",
                    border: isSelected ? `3px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                    background: isSelected ? MC.bedrockLight : MC.bedrock,
                    color: MC.text, cursor: "pointer", fontSize: 13,
                    fontFamily: mcFont, lineHeight: 1.5, fontWeight: 500,
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Step: Result */}
      {currentStep === "result" && (
        <div>
          <div style={{
            padding: 20,  marginBottom: 16,
            background: getScore() === 3 ? "#1a2e28" : getScore() >= 1 ? "#2a2a28" : "#2a2232",
            border: `3px solid ${getScore() === 3 ? MC.emerald : getScore() >= 1 ? MC.gold : MC.redstone}`,
          }}>
            <div style={{
              fontSize: 20, fontWeight: 700, marginBottom: 12,
              color: getScore() === 3 ? MC.emerald : getScore() >= 1 ? MC.gold : MC.redstone,
            }}>
              {getScore() === 3 ? "⭐ PERFECT! 3/3" : getScore() === 2 ? "👍 GOED! 2/3" : getScore() === 1 ? "🤔 1/3" : "💀 0/3"}
            </div>

            {["A", "K", "B"].map((key) => {
              const correct = answers[key] === q.steps[key].correct;
              return (
                <div key={key} style={{
                  padding: "10px 14px",  marginBottom: 8,
                  background: correct ? "#1a2e28" : "#2a2232",
                  border: `2px solid ${correct ? MC.emerald + "66" : MC.redstone + "66"}`,
                }}>
                  <div style={{ fontSize: 12, fontWeight: 900, color: correct ? MC.emerald : MC.redstone, marginBottom: 4, fontFamily: mcFont }}>
                    {correct ? "✓" : "✗"} {key === "A" ? "Antwoord" : key === "K" ? "Koppeling" : "Bewijs"}
                  </div>
                  <div style={{ fontSize: 12, color: MC.text, fontFamily: mcFont }}>
                    {correct ? q.steps[key].options[q.steps[key].correct] : (
                      <>
                        <span style={{ textDecoration: "line-through", color: MC.redstone + "88" }}>
                          {q.steps[key].options[answers[key]]}
                        </span>
                        <br />
                        <span style={{ color: MC.emerald }}>→ {q.steps[key].options[q.steps[key].correct]}</span>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{
            padding: 16,  background: MC.bedrockLight,
            border: `2px solid ${MC.goldDark}`, marginBottom: 16,
          }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: MC.gold, marginBottom: 8, fontFamily: mcFont }}>📝 Modelantwoord</div>
            <div style={{ fontSize: 13, color: MC.text, lineHeight: 1.7, fontFamily: mcFont }}>{q.modelAnswer}</div>
          </div>

          <button onClick={next} style={{
            padding: "10px 24px",  border: "none",
            background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`, color: MC.white,
            fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
          }}>
            Volgende oefening →
          </button>
        </div>
      )}
    </div>
  );
};

      { nr: 32, text: "Discussies over de 'sociale kwestie'." },

      { nr: 45, text: "De verdeling van de wereld in twee ideologische blokken in de greep van een wapenwedloop en de daaruit voortvloeiende dreiging van een atoomoorlog." },
      { nr: 46, text: "De dekolonisatie die een eind maakte aan de westerse hegemonie in de wereld." },

    ]},
  ],
  contexten: [
    { id: "gb", name: "Het Britse Rijk (1585–1900)", flag: "🇬🇧", kas: [18, 21, 25, 27, 29, 30, 31, 32, 33, 34, 35, 36] },
    { id: "de", name: "Duitsland in Europa (1918–1991)", flag: "🇩🇪", kas: [37, 38, 39, 40, 41, 42, 45, 47, 48] },
    { id: "nl", name: "Nederland (1948–2008)", flag: "🇳🇱", kas: [45, 46, 47, 48, 49] },
  ],
};

// Build a lookup for KA text by number
const KA_LOOKUP = {};
KA_DATA.tijdvakken.forEach(tv => tv.kas.forEach(ka => { KA_LOOKUP[ka.nr] = ka.text; }));

const KAModule = () => {
  const [view, setView] = useState("tijdvak"); // "tijdvak" or "context"
  const [expanded, setExpanded] = useState(null);

  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 15, color: MC.text, fontFamily: mcFont, lineHeight: 1.7, marginBottom: 12 }}>
          Dit is de lijst met alle kenmerkende aspecten die op het centraal examen getoetst kunnen worden (KA 18 t/m 49). Op het examen vind je deze lijst achterin het bronnenboekje.
        </div>
      </div>

      {/* Toggle */}
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[
          { id: "tijdvak", label: "📅 Per tijdvak" },
          { id: "context", label: "🗺️ Per historische context" },
        ].map(tab => (
          <button key={tab.id} onClick={() => { setView(tab.id); setExpanded(null); }} style={{
            flex: 1, padding: "10px 8px",
            border: `2px solid ${view === tab.id ? MC.gold : MC.stoneDark}`,
            background: view === tab.id ? MC.bedrockLight : MC.bedrock,
            color: view === tab.id ? MC.gold : MC.textDim,
            fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: mcFont,
          }}>
            {tab.label}
          </button>
        ))}
      </div>

      {/* Per tijdvak */}
      {view === "tijdvak" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {KA_DATA.tijdvakken.map(tv => {
            const isOpen = expanded === tv.id;
            return (
              <div key={tv.id} style={{
                border: `2px solid ${isOpen ? MC.gold : MC.stoneDark}`,
                background: MC.bedrockLight,
              }}>
                <div
                  onClick={() => setExpanded(isOpen ? null : tv.id)}
                  style={{
                    padding: "12px 14px", cursor: "pointer",
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                  }}
                >
                  <div style={{ fontSize: 14, fontWeight: 700, color: isOpen ? MC.gold : MC.text, fontFamily: mcFont }}>
                    {tv.name}
                  </div>
                  <div style={{ fontSize: 12, color: MC.textDim }}>{isOpen ? "▲" : "▼"}</div>
                </div>
                {isOpen && (
                  <div style={{ padding: "0 14px 14px 14px" }}>
                    {tv.kas.map(ka => (
                      <div key={ka.nr} style={{
                        padding: "8px 10px", marginBottom: 4,
                        background: MC.bedrock, border: `1px solid ${MC.stoneDark}`,
                        display: "flex", gap: 10, alignItems: "baseline",
                      }}>
                        <span style={{
                          fontSize: 13, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
                          minWidth: 28, textAlign: "right",
                        }}>
                          {ka.nr}
                        </span>
                        <span style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.6 }}>
                          {ka.text}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Per historische context */}
      {view === "context" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {KA_DATA.contexten.map(ctx => {
            const isOpen = expanded === ctx.id;
            const contextKAs = ctx.kas.map(nr => ({ nr, text: KA_LOOKUP[nr] })).filter(k => k.text);
            return (
              <div key={ctx.id} style={{
                border: `2px solid ${isOpen ? MC.gold : MC.stoneDark}`,
                background: MC.bedrockLight,
              }}>
                <div
                  onClick={() => setExpanded(isOpen ? null : ctx.id)}
                  style={{
                    padding: "12px 14px", cursor: "pointer",
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                  }}
                >
                  <div style={{ fontSize: 14, fontWeight: 700, color: isOpen ? MC.gold : MC.text, fontFamily: mcFont }}>
                    {ctx.flag} {ctx.name}
                  </div>
                  <div style={{ fontSize: 12, color: MC.textDim }}>{isOpen ? "▲" : "▼"}</div>
                </div>
                {isOpen && (
                  <div style={{ padding: "0 14px 14px 14px" }}>
                    {contextKAs.map(ka => (
                      <div key={ka.nr} style={{
                        padding: "8px 10px", marginBottom: 4,
                        background: MC.bedrock, border: `1px solid ${MC.stoneDark}`,
                        display: "flex", gap: 10, alignItems: "baseline",
                      }}>
                        <span style={{
                          fontSize: 13, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
                          minWidth: 28, textAlign: "right",
                        }}>
                          {ka.nr}
                        </span>
                        <span style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.6 }}>
                          {ka.text}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

const MODULES = [
  { id: "timeline", emoji: "🕐", name: "Tijdlijn-Bouwer", desc: "Oefen met chronologische volgorde", maxXP: 110, color: "#6ba8c4" },
  { id: "pattern", emoji: "🔍", name: "Patroonherkenner", desc: "Herken de 6 vraagtypen", maxXP: 150, color: "#5aaa7a" },
  { id: "akb", emoji: "🏗️", name: "AKB-Bouwer", desc: "Bouw antwoorden stap voor stap", maxXP: 300, color: "#7a8abf" },
  { id: "ka", emoji: "📋", name: "KA-Bijlage", desc: "Alle kenmerkende aspecten (naslagwerk)", maxXP: 0, color: MC.gold },
];

function App() {
  const [activeModule, setActiveModule] = useState(null);
  const [xp, setXp] = useState({ timeline: 0, pattern: 0, akb: 0 });
  const [showFlash, setShowFlash] = useState(false);

  const addXP = (module) => (amount) => {
    setXp((prev) => ({ ...prev, [module]: prev[module] + amount }));
    setShowFlash(true);
    setTimeout(() => setShowFlash(false), 600);
  };

  const totalXP = xp.timeline + xp.pattern + xp.akb;

  if (activeModule) {
    return (
      <div style={{
        minHeight: "100vh",
        background: `linear-gradient(180deg, ${MC.black} 0%, ${MC.bedrock} 100%)`,
        color: MC.text,
        fontFamily: mcFont,
        padding: "20px 16px",
        maxWidth: 640,
        margin: "0 auto",
      }}>
        {showFlash && (
          <div style={{
            position: "fixed", top: 20, right: 20, padding: "8px 16px",
            background: MC.grass, color: MC.white, border: `2px solid ${MC.grassDark}`,
            fontSize: 14, fontWeight: 900, zIndex: 999, fontFamily: mcFont,
            textShadow: `1px 1px 0 ${MC.grassDark}`,
          }}>
            +XP ⭐
          </div>
        )}

        <button onClick={() => setActiveModule(null)} style={{
          background: "none", border: "none", color: MC.textDim,
          fontSize: 14, cursor: "pointer", marginBottom: 16,
          fontFamily: mcFont, padding: 0, fontWeight: 700,
        }}>
          ← Terug naar menu
        </button>

        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 22, fontWeight: 900, marginBottom: 4, color: MC.text }}>
            {MODULES.find((m) => m.id === activeModule)?.emoji}{" "}
            {MODULES.find((m) => m.id === activeModule)?.name}
          </div>
          {activeModule !== "ka" && (
            <XPBar
              xp={xp[activeModule] || 0}
              maxXp={MODULES.find((m) => m.id === activeModule)?.maxXP || 100}
              label="Voortgang"
            />
          )}
        </div>

        {activeModule === "timeline" && <TimelineModule onXP={addXP("timeline")} />}
        {activeModule === "pattern" && <PatternModule onXP={addXP("pattern")} />}
        {activeModule === "akb" && <AKBModule onXP={addXP("akb")} />}
        {activeModule === "ka" && <KAModule />}
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh",
      background: `linear-gradient(180deg, ${MC.black} 0%, ${MC.bedrock} 100%)`,
      color: MC.text,
      fontFamily: mcFont,
      padding: "32px 16px",
      maxWidth: 640,
      margin: "0 auto",
    }}>
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: 36 }}>
        <div style={{ fontSize: 48, marginBottom: 8, lineHeight: 1 }}>⛏️</div>
        <h1 style={{
          fontSize: 24, fontWeight: 900, margin: 0,
          color: MC.gold,
          fontFamily: mcFont,
          letterSpacing: 2,
          textShadow: `3px 3px 0 ${MC.goldDark}, -1px -1px 0 ${MC.black}`,
          textTransform: "uppercase",
        }}>
          Geschiedenis
        </h1>
        <h2 style={{
          fontSize: 20, fontWeight: 900, margin: "4px 0 0 0",
          color: MC.white,
          fontFamily: mcFont,
          letterSpacing: 3,
          textShadow: `2px 2px 0 ${MC.stoneDark}`,
          textTransform: "uppercase",
        }}>
          Examentraining
        </h2>
        <div style={{ fontSize: 12, color: MC.textDim, marginTop: 8, letterSpacing: 1 }}>
          HAVO Centraal Examen — Oefenen met echte examens
        </div>
      </div>

      {/* Tips voor rust in je hoofd */}
      <div style={{
        background: MC.bedrockLight,
        border: `3px solid ${MC.goldDark}`,
        padding: 16, marginBottom: 24,
        boxShadow: mcBoxShadowDark,
      }}>
        <div style={{
          fontSize: 15, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
          textAlign: "center", marginBottom: 12, letterSpacing: 1,
        }}>
          🧠 Tips voor rust in je hoofd!
        </div>

        {[
          { emoji: "📕", title: "Het 'Verboden Boekje'",
            text: "Leg het bronnenboekje dicht en links van je neer. Open het pas als de vraag zegt \"Gebruik bron X\". Zoek als een laserstraal naar het antwoord, klap het dicht." },
          { emoji: "📋", title: "De KA-Bijlage is heilig",
            text: "De lijst met Kenmerkende Aspecten zit achterin je bronnenboekje. Schrijf ze letterlijk over — ga nooit zelf een zin verzinnen." },
          { emoji: "🖍️", title: "Filter met drie kleuren",
            text: "Geel = namen & jaartallen. Roze = signaalwoorden (omdat, waardoor, gevolg). Groen = het bewijs dat je letterlijk in je antwoord gebruikt." },
        ].map((tip, i) => (
          <div key={i} style={{
            padding: 10, marginBottom: i < 2 ? 6 : 0,
            background: MC.bedrock, border: `2px solid ${MC.stoneDark}`,
          }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: MC.text, fontFamily: mcFont, marginBottom: 3 }}>
              {tip.emoji} {tip.title}
            </div>
            <div style={{ fontSize: 12, color: MC.textDim, fontFamily: mcFont, lineHeight: 1.6 }}>
              {tip.text}
            </div>
          </div>
        ))}
      </div>

      {/* Modules */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {MODULES.map((mod) => (
          <button
            key={mod.id}
            onClick={() => setActiveModule(mod.id)}
            style={{
              background: MC.bedrock,
              border: `3px solid ${MC.stoneDark}`,
              padding: 18,
              cursor: "pointer",
              textAlign: "left",
              transition: "all 0.1s",
              fontFamily: mcFont,
              boxShadow: mcBoxShadowDark,
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.border = `3px solid ${MC.gold}`;
              e.currentTarget.style.background = MC.bedrockLight;
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.border = `3px solid ${MC.stoneDark}`;
              e.currentTarget.style.background = MC.bedrock;
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{
                width: 52, height: 52,
                border: `3px solid ${MC.stoneDark}`,
                background: MC.bedrockLight,
                display: "flex",
                alignItems: "center", justifyContent: "center",
                fontSize: 28, flexShrink: 0,
                boxShadow: mcBoxShadowDark,
              }}>
                {mod.emoji}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 16, fontWeight: 900, color: MC.white, marginBottom: 3, textShadow: `1px 1px 0 ${MC.black}` }}>
                  {mod.name}
                </div>
                <div style={{ fontSize: 12, color: MC.textDim }}>{mod.desc}</div>
                {mod.maxXP > 0 && (
                  <div style={{ marginTop: 8 }}>
                    <XPBar xp={xp[mod.id] || 0} maxXp={mod.maxXP} label="" />
                  </div>
                )}
              </div>
              <div style={{ color: MC.gold, fontSize: 22, fontWeight: 900 }}>▶</div>
            </div>
          </button>
        ))}
      </div>

      {/* Footer tip */}
      <div style={{
        marginTop: 32, padding: 16,
        background: MC.bedrockLight, border: `2px solid ${MC.goldDark}`,
        textAlign: "center",
      }}>
        <div style={{ fontSize: 12, color: MC.textDim, lineHeight: 1.6 }}>
          💡 <strong style={{ color: MC.gold }}>TIP:</strong> Begin met de Tijdlijn-Bouwer, daarna de Patroonherkenner, en als laatste de AKB-Bouwer.
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
