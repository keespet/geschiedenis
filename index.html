{nr:22,points:2,context:"nederland",type:"detective",question:"Jongeling wil waarschuwen dat Amerikaanse culturele beïnvloeding bijdraagt aan een maatschappelijke ontwikkeling in Nederland. Beredeneer welke ontwikkeling, met bronverwijzing.",patternExplain:"'Wil waarschuwen voor welke ontwikkeling' = je analyseert de boodschap van Jongeling → Detective.",signals:["wil waarschuwen","welke ontwikkeling"],answer:null,akb:{A:"Jongeling waarschuwt voor de ontkerkelijking / secularisering in Nederland, veroorzaakt door Amerikaanse invloeden.",K:"Amerikaanse cultuur (Hollywood, techniek) vervangt christelijke waarden → mensen raken vervreemd van God.",B:"'Amerika is een haard van geestelijke besmetting' / 'De bacillen van het bederf worden ook naar Nederland overgedragen' / 'Film en bioscoop... hebben miljoenen verslagen'."}},
{nr:23,points:2,context:"nederland",type:"domino",question:"In 1973 stopte de regering met werving van gastarbeiders, maar het aantal immigranten groeide toch. Licht toe: (1) waarom stopte de werving juist in 1973, en (2) welke beleidsmaatregel veroorzaakte de toename?",patternExplain:"Twee oorzaak-gevolgketens: (1) oliecrisis → stop werving, (2) gezinshereniging → toename → Domino.",signals:["verklaren","welke beleidsmaatregel"],answer:null,akb:{A:"(1) Door de oliecrisis/economische crisis was er geen krapte meer op de arbeidsmarkt → werving overbodig. (2) Door het recht op gezinshereniging kwamen vrouwen en kinderen naar Nederland.",K:"(1) Oliecrisis 1973 → werkloosheid → geen behoefte meer aan gastarbeiders. (2) Gezinshereniging → permanente vestiging → groei immigrantenpopulatie.",B:"(1) De regering-Den Uyl stopte in 1973 met actief werven. (2) Ondanks de stop groeide het aantal immigranten door gezinshereniging."}},
{nr:24,points:4,context:"nederland",type:"detective",question:"De uitspraken van krakers Mattie en Nico passen bij twee uitgangspunten van de kraakbeweging. Toon voor elk uitgangspunt aan dat het past, met een andere bronverwijzing.",patternExplain:"'Toon aan dat de uitspraken passen bij twee uitgangspunten' = je analyseert de standpunten van de krakers → Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["passen bij","uitgangspunten","toon aan"],answer:null,akb:{A:"(1) De woningnood moet worden opgelost. (2) Verzet/confrontatie met de autoriteiten is gerechtvaardigd.",K:"(1) Krakers vonden het onacceptabel dat huizen werden gesloopt terwijl er woningnood was. (2) Ze waren bereid de confrontatie aan te gaan om hun doel te bereiken.",B:"(1) Mattie: 'Dat je huizen gaat afbreken om een parkeergarage te bouwen... dat was eigenlijk ondenkbaar'. (2) Nico: 'Wij gaan de confrontatie ook echt aan' / 'barricades die we gingen opwerpen'."}},
{nr:25,points:2,context:"duitsland",type:"domino",question:"Je kunt met de demonstratie in Nizjni Tagil (1988) aantonen dat een binnenlandse doelstelling van Gorbatsjov was behaald. Leg uit welke.",patternExplain:"'Welke doelstelling was behaald' = het protest (gevolg) bewijst het succes van glasnost (oorzaak) → Domino. Let op: perestrojka levert géén punt op!",signals:["welke doelstelling","aantonen"],answer:null,akb:{A:"De demonstratie bewijst dat glasnost was behaald: burgers konden openlijk kritiek leveren op misstanden.",K:"Vóór glasnost was openlijk protest onmogelijk in de SU. Dat 10.000 mensen nu demonstreerden tegen vervuiling, bewijst dat er meer openheid was.",B:"In 1988 protesteerden 10.000 mensen in Nizjni Tagil tegen vervuiling door oude kolenovens — openlijke kritiek die eerder onmogelijk was."}},
{nr:26,points:3,context:"nederland",type:"matchmaker",question:"De foto uit 1961 illustreert twee delen van hetzelfde kenmerkend aspect uit de tweede helft van de 20e eeuw. Noem het KA en illustreer beide delen met een ander gegeven uit de bron.",patternExplain:"'Twee delen van hetzelfde KA illustreren' = je koppelt twee elementen uit de foto aan twee delen van één KA → Matchmaker.",signals:["kenmerkend aspect","illustreren"],answer:null,akb:{A:"Het KA is: 'de toenemende westerse welvaart die aanleiding gaf tot ingrijpende sociaal-culturele veranderingsprocessen'.",K:"Deel 1 (welvaart): de beurs met luxe bromfietsen illustreert de toenemende welvaart. Deel 2 (sociaal-culturele verandering): een vrouw als bedrijfsleidster illustreert de emancipatie van vrouwen.",B:"Deel 1: Een beurs met nieuwste modellen bromfiets (luxeproducten). Deel 2: Ina van Kooten is bedrijfsleidster van een bromfietsenzaak — een vrouw in een leidinggevende functie."}}
]};

const EXAM_2023_T1 = {id:"2023t1",name:"2023 Tijdvak 1",date:"15 mei 2023",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen in het Britse Rijk in de juiste chronologische volgorde, van vroeger naar later.",patternExplain:"Zes gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: anglicaanse staatskerk in Amerika (17e eeuw), federale staat VS (1776-1787), slavernij afgeschaft Jamaica (1833), Indiase Opstand (1857), Indian National Congress (1885), na WO1 (1918+).",signals:["chronologische volgorde","van vroeger naar later"],answer:"2, 6, 3, 5, 1, 4",akb:null},
{nr:2,points:3,context:"vroegmoderne-tijd",type:"domino",question:"De Europese overzeese expansie draagt bij aan het veranderende mens- en wereldbeeld van de renaissance. Geef aan: (1) welk motief voor expansie leid je af uit de voorwerpen, en (2) op welke wijze draagt de expansie bij aan het wereldbeeld, met bronverwijzing?",patternExplain:"'Welk motief' + 'op welke wijze draagt bij' = oorzaak-gevolg → Domino. Let op: bij deel 2 moet je ZOWEL de uitleg ALS de bronverwijzing geven!",signals:["welk motief","op welke wijze","bijdraagt"],answer:null,akb:{A:"(1) Motief: rijkdom vergaren — de gouden voorwerpen in de schatkamer tonen dat. (2) Europeanen ontdekken dat er andere culturen bestaan die ook fraaie kunst maken.",K:"(1) De expansie werd gedreven door het zoeken naar rijkdom/goud. (2) De ontdekking van andere culturen verandert het beeld dat Europeanen van de wereld hebben.",B:"(1) 'Een vaambrede zon van zuiver goud... op 100.000 florijnen geschat'. (2) Dürer: 'Ik verbaasde me over de subtiele kunstzin van mensen in vreemde landen'."}},
{nr:3,points:4,context:"vroegmoderne-tijd",type:"matchmaker",question:"Geef een politiek-militaire en een culturele verklaring voor het advies van Willem Lodewijk om de contramars in te voeren, telkens met het passende kenmerkend aspect.",patternExplain:"'Noem het kenmerkende aspect dat hierbij past' = twee verklaringen koppelen aan KA's → Matchmaker. Let op: als je bij de culturele verklaring alleen 'de renaissance' noemt zonder wetenschappelijke belangstelling, krijg je géén punt!",signals:["kenmerkend aspect"],answer:null,akb:{A:"Politiek-militair: Willem Lodewijk wilde het leger verbeteren voor de strijd tegen Spanje. Cultureel: hij gebruikte kennis uit de klassieke Oudheid.",K:"Politiek-militair: past bij 'het conflict in de Nederlanden dat resulteerde in de stichting van een Nederlandse staat'. Cultureel: past bij 'de hernieuwde oriëntatie op het erfgoed van de klassieke Oudheid' OF 'het begin van een nieuwe wetenschappelijke belangstelling'.",B:"Willem Lodewijk las over de contramars in het boek Tactische theorie van de Griek Aelianus (2e eeuw)."}},
{nr:4,points:2,context:"britse-rijk",type:"detective",question:"De Champlain publiceert zijn boek na zijn benoeming als vicegouverneur. Toon aan met bronverwijzing dat hij: (1) zijn benoeming rechtvaardigt, en (2) waarschuwt dat de Franse belangen gevaar lopen.",patternExplain:"'Toon aan dat hij wil rechtvaardigen/waarschuwen' = je analyseert het doel van De Champlain → Detective. Twee delen!",signals:["toon aan","rechtvaardigt","waarschuwing"],answer:null,akb:{A:"(1) De Champlain toont zichzelf als actieve leider die vooraan meevecht. (2) Hij waarschuwt dat de omstandigheden in Amerika gevaarlijk zijn voor kolonisten.",K:"(1) Door zichzelf centraal af te beelden als sterke aanvoerder rechtvaardigt hij zijn benoeming. (2) De gevaarlijke gevechten tonen dat Franse belangen onvoldoende beschermd zijn.",B:"(1) De Champlain staat in het midden van de prent en vecht mee tegen de Haudenosaunee. (2) De prent toont een gewapend gevecht met pijlen en speren tussen inheemse volken."}},
{nr:5,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"Noem bij elk gegeven over Rachel Ruysch een ander kenmerkend aspect uit de zeventiende eeuw. Let op: elk KA maar één keer!",patternExplain:"'Noem bij elk gegeven een kenmerkend aspect' = twee keer koppelen → Matchmaker. Let op: 'Gouden Eeuw' is géén kenmerkend aspect en levert géén punt op!",signals:["kenmerkend aspect"],answer:null,akb:{A:"(1) Het bestuderen en natekenen van inheemse bloemen past bij de wetenschappelijke revolutie. (2) De populariteit bij Amsterdamse regenten past bij de bloei van de Republiek.",K:"(1) 'De wetenschappelijke revolutie'. (2) 'De bijzondere plaats in staatkundig opzicht en de bloei in economisch en cultureel opzicht van de Nederlandse Republiek'.",B:"(1) Rachel bestudeerde bloemen om ze na te tekenen → empirisch onderzoek. (2) Haar bloemstillevens waren populair bij Amsterdamse regenten → culturele bloei."}},
{nr:6,points:4,context:"vroegmoderne-tijd",type:"detective",question:"Twee conclusies: (1) het verbod op het huwelijk past bij het ancien régime, en (2) Anne Marie Louise wil haar status benadrukken. Leg beide uit met telkens een andere bronverwijzing.",patternExplain:"(1) Je verklaart het verbod vanuit de samenleving + (2) je analyseert het doel van de schrijfster → Detective. Let op: VERSCHILLENDE bronverwijzingen nodig!",signals:["past bij","wil benadrukken"],answer:null,akb:{A:"(1) In het ancien régime is Frankrijk een standenmaatschappij / beslist de absolute vorst. Daarom mag ze niet trouwen met iemand van lagere komaf. (2) Ze beschrijft dat de koning met haar meeleeft / om haar huilt.",K:"(1) Geboorte bepaalt je plaats → huwelijk met lagere adel is onacceptabel. (2) Door de emotionele reactie van de koning te beschrijven benadrukt ze haar hoge status als intieme van de koning.",B:"(1) 'Ik je opoffer om meneer De Lauzun een fortuin te bezorgen' → standsverschil. (2) 'Hij wierp zichzelf op de knieën... we bleven zo wel drie kwartier zitten, in elkaars armen... hij weende'."}},
{nr:7,points:2,context:"britse-rijk",type:"domino",question:"George III gaf trouwe officieren grond in veroverd Noord-Amerika, mits ze het als landbouwgrond gebruikten. Welk politiek en welk economisch doel wilde hij bereiken?",patternExplain:"'Welk doel wilde hij bereiken' = twee doelen afleiden uit de maatregel → Domino.",signals:["welk doel","bereiken"],answer:null,akb:{A:"Politiek doel: meer controle over de kolonie door trouwe soldaten land te geven. Economisch doel: meer landbouwproductie/winst uit de kolonie.",K:"Politiek: trouwe Britten op strategische posities → loyaliteit gegarandeerd. Economisch: landbouwgrond in gebruik → kolonie levert meer op.",B:"George III bepaalde dat alleen trouwe officieren en soldaten grond kregen (politiek) en dat ze het als landbouwgrond moesten gebruiken (economisch)."}},
{nr:8,points:3,context:"britse-rijk",type:"detective",question:"Twee beweringen over Abigail Adams: (1) ze gebruikt een argument van de Amerikaanse opstandelingen, en (2) ze gaat NIET uit van natuurlijke rechten. Ondersteun beide.",patternExplain:"Je analyseert twee aspecten van haar redenering → Detective. Let op: bij deel 2 moet je uitleggen WAAROM haar oproep NIET past bij natuurlijke rechten!",signals:["welk argument","niet uitgaat van"],answer:null,akb:{A:"(1) Adams gebruikt het argument 'geen wetten zonder onze instemming' — net als de opstandelingen tegen Engeland. (2) Ze baseert vrouwenrechten op Gods bescherming, niet op gelijkheid/natuurlijke rechten.",K:"(1) 'No taxation without representation' = geen wetten zonder instemming → ook vrouwen willen inspraak. (2) Natuurlijke rechten = iedereen gelijkwaardig en vrij. Adams zegt dat vrouwen 'onder bescherming van mannen zijn geplaatst door God' → dat is NIET gelijkwaardigheid.",B:"(1) 'Wij zullen ons niet gebonden voelen aan wetten die niet met onze instemming tot stand zijn gekomen'. (2) 'Beschouw ons als wezens die door de Voorzienigheid onder jullie bescherming zijn geplaatst'."}},
{nr:9,points:2,context:"britse-rijk",type:"domino",question:"De voordelen van het Grand Trunk Canal die Pennant beschrijft maken verdere industrialisering mogelijk. Geef voor twee voordelen aan hoe.",patternExplain:"'Op welke wijze maakt dit industrialisering mogelijk' = twee voordelen als oorzaak → industrialisering als gevolg → Domino.",signals:["mogelijk maken","voordelen"],answer:null,akb:{A:"(1) Goedkope steenkool wordt naar een groter gebied gebracht → stoommachines kunnen overal draaien. (2) Meer graan kan worden vervoerd → meer fabrieksarbeiders kunnen worden gevoed.",K:"(1) Steenkool = brandstof voor stoommachines → industrialisering. (2) Voedsel voor arbeiders → grotere beroepsbevolking in fabrieken.",B:"(1) 'Plaatsen waar men nauwelijks steenkool had, worden nu ruimschoots voorzien'. (2) 'Er kan veel meer graan worden vervoerd' / monopolie op graan is doorbroken."}},
{nr:10,points:4,context:"britse-rijk",type:"detective",question:"Tipoe en de EIC stellen hetzelfde kunstwerk tentoon. Leg voor beide apart uit welke boodschap ze over het Britse imperialisme willen overbrengen.",patternExplain:"'Welke boodschap willen ze overbrengen' = twee tegengestelde doelen met hetzelfde object → Detective. Let op: per persoon ZOWEL de boodschap ALS de link naar het tentoonstellen noemen!",signals:["boodschap","overbrengen"],answer:null,akb:{A:"Tipoe: het Britse imperialisme moet worden gestopt — India zal de Britten verslaan. EIC: het Britse imperialisme is succesvol — wij hebben Tipoe verslagen.",K:"Tipoe: de tijger (India) doodt de Britse soldaat → verzet tegen imperialisme. EIC: wij hebben dit kunstwerk buitgemaakt → bewijs van Britse militaire superioriteit.",B:"Het kunstwerk toont een tijger die een Britse soldaat aanvalt. Tipoe toont het als symbool van Indiaas verzet. De EIC toont het als oorlogsbuit."}},
{nr:11,points:2,context:"britse-rijk",type:"detective",question:"Leg uit dat het eenzijdige beeld dat Lady Nugent weergeeft van slavernij in Jamaica past bij haar positie.",patternExplain:"'Eenzijdig beeld door haar positie' = je analyseert de partijdigheid van de bron → Detective.",signals:["eenzijdige beeld","past bij haar positie"],answer:null,akb:{A:"Lady Nugent beweert dat slaafgemaakten 'extreem goed behandeld worden' en dat mishandeling 'zwaar overdreven' is — een rooskleurig beeld.",K:"Als vrouw van de gouverneur profiteert ze van slavernij en kan ze het systeem niet openlijk bekritiseren → ze heeft belang bij een positief beeld.",B:"'Ik geloof dat de slaven extreem goed behandeld worden' / 'wat zij hierover zeggen is zwaar overdreven'."}},
{nr:12,points:2,context:"britse-rijk",type:"detective",question:"Je doet onderzoek naar het superioriteitsgevoel onder Britse kolonisten. Leg uit welke redenering van Lady Nugent je kunt gebruiken.",patternExplain:"'Welke redenering is bruikbaar voor dit onderzoek' = je beoordeelt de bruikbaarheid van de bron → Detective.",signals:["welke redenering","kunt gebruiken"],answer:null,akb:{A:"Lady Nugent vindt dat slaafgemaakten religieuze en morele waarden van de Engelsen zouden moeten overnemen — dit toont haar superioriteitsgevoel.",K:"Ze gaat ervan uit dat de cultuur van slaafgemaakten minderwaardig is en dat Engelse normen de standaard zijn → superioriteitsgevoel.",B:"'Als religie, fatsoen en orde onder de zwarten zou heersen' / 'als zij overgehaald konden worden om te trouwen' — ze vindt dat ze Engelse normen moeten overnemen."}},
{nr:13,points:3,context:"britse-rijk",type:"domino",question:"De herinneringen van Robert Blincoe werden heruitgegeven om een wet te bevorderen. Noem de wet en leg uit hoe het verhaal de aanname kon bevorderen.",patternExplain:"'Noem de wet' + 'leg uit hoe het verhaal de aanname bevorderde' = het verhaal (oorzaak) → steun voor wet (gevolg) → Domino.",signals:["noem deze wet","bevorderen"],answer:null,akb:{A:"De Factory Act (1833) moest worden bevorderd.",K:"Het verhaal over een kind dat onder vreselijke omstandigheden in een fabriek moest werken riep steun en begrip op voor de wet die kinderarbeid verbood / werkomstandigheden verbeterde.",B:"Robert Blincoe was een zevenjarige weesjongen die vanuit het werkhuis naar een spinnerij werd gestuurd en daar 'alle ellende' moest doorstaan."}},
{nr:14,points:2,context:"britse-rijk",type:"domino",question:"Bij een anti-slavernijconventie (1840) mochten Amerikaanse vrouwen niet meedoen. De media-aandacht hierover droeg bij aan de emancipatie van de vrouw in de VS. Leg uit hoe.",patternExplain:"'Droeg bij aan emancipatie' = de uitsluiting (oorzaak) → media-aandacht → steun voor vrouwenrechten (gevolg) → Domino.",signals:["bijdragen aan","emancipatie"],answer:null,akb:{A:"Door de media-aandacht voor de uitsluiting van vrouwen ontstond meer steun voor het vrouwenkiesrecht / meldden meer mensen zich aan bij vrouwenrechtenbewegingen.",K:"De ironie dat vrouwen die streden voor bevrijding van slaafgemaakten zelf werden uitgesloten, versterkte de roep om gelijke rechten voor vrouwen.",B:"Vrouwen mochten niet deelnemen aan debatten en niet stemmen — ze mochten alleen toekijken vanaf het balkon."}},
{nr:15,points:2,context:"britse-rijk",type:"detective",question:"Witbooi vindt het Duitse imperialisme een bedreiging. Ondersteun: (1) welk politiek aspect bekritiseert hij, en (2) verklaar zijn reactie vanuit zijn eigen achtergrond.",patternExplain:"'Welk aspect bekritiseert hij' + 'vanuit zijn achtergrond' = je analyseert de boodschap én de positie van de schrijver → Detective.",signals:["bekritiseert","achtergrond"],answer:null,akb:{A:"(1) Witbooi bekritiseert dat de Duitsers de Herero in hun macht hebben — ze verliezen hun onafhankelijkheid. (2) Als leider van de Nama is hij bezorgd over zijn eigen volk.",K:"(1) Verlies van zelfbestuur = politiek aspect van imperialisme. (2) Als de Herero samenwerken met Duitsland, wordt de Nama-positie bedreigd in hun oorlog met de Herero.",B:"(1) 'Hij gaat niet voor jou buigen en jij zult je ongemakkelijk voelen als je voor hem moet buigen'. (2) De Nama zijn al jarenlang in oorlog met de Herero over landbouwgronden."}},
{nr:16,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gegevens over migranten die naar Nederland kwamen in de 20e eeuw in de juiste chronologische volgorde.",patternExplain:"Zes migranten ordenen = Tijdlijn-Bouwer. Ankerpunten: WO1 neutraal (1914), herstelbetalingen (jaren '20), Joden Duitsland (1933), Indonesië onafhankelijk (1945), gastarbeid (jaren '60-'70), Srebrenica (1995).",signals:["chronologische volgorde","van vroeger naar later"],answer:"2, 5, 6, 3, 4, 1",akb:null},
{nr:17,points:4,context:"duitsland",type:"detective",question:"Wolfgang Teuberts beschrijving van de SA: leg uit dat de bron (1) meer betrouwbare info bevat voor onderzoek naar de instabiele democratie, en (2) minder betrouwbare info voor onderzoek naar de communistische dreiging.",patternExplain:"'Meer/minder betrouwbaar' voor twee onderzoeksgebieden = je beoordeelt de bron op twee manieren → Detective. Let op: je moet per deel uitleggen WAAROM de bron wel/niet betrouwbaar is!",signals:["meer betrouwbaar","minder betrouwbaar"],answer:null,akb:{A:"(1) Meer betrouwbaar: Teubert beschrijft uit eigen ervaring het straatgeweld tussen SA en communisten → bewijs voor instabiliteit. (2) Minder betrouwbaar: als SA-lid ziet hij communisten als vijand → overdrijft de dreiging.",K:"(1) Het dagelijkse geweld op straat toont dat antidemocratische groepen de Weimarrepubliek ondermijnen. (2) Als paramilitair SA-lid is hij partijdig: hij gaat ervan uit dat agressie van de communisten komt.",B:"(1) 'Avond aan avond beschermden we bijeenkomsten' / 'stoelen breken en dan met stoelpoten vechten'. (2) 'Bedreigingen door andere lui' → hij noemt communisten alleen als bedreiging, nooit als slachtoffers."}},
{nr:18,points:4,context:"duitsland",type:"domino",question:"Met de foto van Rheinwiesenlager kun je: (1) de ontwrichting van de West-Duitse samenleving na 1945 laten zien, en (2) de moeizame denazificatie verklaren. Leg beide uit.",patternExplain:"'Ontwrichting laten zien' + 'denazificatie verklaren' = twee oorzaak-gevolgketens → Domino.",signals:["laten zien","verklaren"],answer:null,akb:{A:"(1) Veel mannen zitten gevangen → kunnen niet bijdragen aan economie/samenleving → ontwrichting. (2) Zoveel gevangenen dat je niet zorgvuldig kunt nagaan wie wat heeft gedaan → denazificatie moeizaam.",K:"(1) Miljoenen mannen opgesloten = enorm gat in de samenleving. (2) Meer dan een miljoen gevangenen individueel beoordelen is bijna onmogelijk.",B:"De foto toont een enorm open veld vol met duizenden krijgsgevangenen, dicht op elkaar, zonder schuilplaatsen."}},
{nr:19,points:3,context:"duitsland",type:"domino",question:"Discussie over het Ruhrgebied bij de verdeling van Marshallgeld (1947). Verklaar: (1) waarom de VS kolenproductie wilden stimuleren, (2) waarom Frankrijk tegen was, en (3) waarom Nederland voor was.",patternExplain:"Drie keer 'verklaar waarom' = drie oorzaak-gevolgketens → Domino. Let op: drie delen!",signals:["verklaar","vanwege","motief"],answer:null,akb:{A:"(1) VS: West-Duitsland versterken als dam tegen het communisme. (2) Frankrijk: bang dat een sterk Duitsland weer een gevaar wordt. (3) Nederland: Duitsland als handelspartner nodig / kolentekort.",K:"(1) Koude Oorlog → sterke westerse bondgenoten nodig. (2) Twee wereldoorlogen door Duitsland → angst voor revanchisme. (3) Nederlandse economie afhankelijk van handel met Duitsland.",B:"In juli 1947 werd het Marshallgeld verdeeld. De VS stelden voor om de kolenproductie in het Ruhrgebied te stimuleren."}},
{nr:20,points:3,context:"nederland",type:"domino",question:"Fré Meis houdt een protestactie in Groningen over 'grondstoffen en bodemrijkdommen'. Licht toe: (1) waarom juist in Groningen, en (2) tot welke stroming behoorde Meis (met bronverwijzing)?",patternExplain:"'Verklaar waarom juist in Groningen' + 'welke stroming' = oorzaak-gevolg + koppeling → Domino.",signals:["verklaren","welke stroming"],answer:null,akb:{A:"(1) In Groningen was aardgas gevonden — de 'bodemrijkdommen' waar Meis naar verwijst. (2) Meis was communist/socialist.",K:"(1) De aardgasopbrengsten gingen naar grote concerns, niet naar de lokale bevolking. (2) Socialisten/communisten bekritiseren de uitbuiting door kapitalisten.",B:"(2) Meis: 'grote concerns leggen beslag op grondstoffen... verdienen er kapitalen aan, terwijl de bevolking kan fluiten naar deze rijkdom' → typisch socialistisch/communistisch standpunt."}},
{nr:21,points:3,context:"duitsland",type:"domino",question:"DDR-voorwaarden voor supportersreis naar het WK 1974 in de BRD. Licht toe: (1) welk probleem wilde de DDR voorkomen met de eis 'alleen gehuwden, maar één per echtpaar', en (2) waarom moest 1 op 10 lid zijn van de Stasi?",patternExplain:"'Welk probleem wilde de DDR voorkomen' = twee keer oorzaak-gevolg → Domino.",signals:["welk probleem","voorkomen","motief"],answer:null,akb:{A:"(1) De DDR wilde voorkomen dat supporters in de BRD zouden blijven (vluchten). Door gehuwden te selecteren met de partner thuis, zouden ze terugkeren. (2) Stasi-leden moesten de reisgenoten in de gaten houden / informatie verzamelen.",K:"(1) De Muur bestond juist om vlucht te voorkomen — een reis naar de BRD was een risico. (2) De DDR was een politiestaat: controle op burgers was essentieel.",B:"(1) Per echtpaar mocht slechts één reizen → de ander bleef als 'garantie' achter. (2) Minimaal 1 op 10 moest Stasi-lid zijn."}},
{nr:22,points:3,context:"nederland",type:"detective",question:"Volgens 'Wij Vrouwen Eisen' is de emancipatie van de vrouw in 1975 nog niet voltooid. Toon aan: (1) dat emancipatie nog niet af is, en (2) welke oorzaak de actiegroep weergeeft (met bronverwijzing).",patternExplain:"'Toon aan dat emancipatie niet af is' + 'welke oorzaak geven ze weer' = je analyseert de boodschap van het affiche → Detective.",signals:["toon aan","welke oorzaak","weergeeft"],answer:null,akb:{A:"(1) Vrouwen mogen niet zelf beslissen over abortus — de emancipatie is dus niet voltooid. (2) De confessionele partijen (KVP, ARP) blokkeren dit vanuit hun machtspositie.",K:"(1) Geen zelfbeschikking over het eigen lichaam = onvolledige emancipatie. (2) Mannelijke confessionele politici bepalen wat goed is voor vrouwen → paternalisme.",B:"(1) 'Wij vrouwen eisen: Abortus uit het wetboek van strafrecht, De vrouw beslist'. (2) 'Wij weten precies wat goed voor je is' / 'met u, over u, zonder u' — de KVP- en ARP-mannen beslissen."}},
{nr:23,points:4,context:"duitsland",type:"detective",question:"Kohl maakt zich zorgen over uitspraken van mevrouw Honecker. Leg uit: (1) welk beleid ondersteunt ze volgens Kohl (met bronverwijzing), en (2) waarom beschouwt Kohl dit als gevaarlijk vanuit zijn functie?",patternExplain:"'Welk beleid ondersteunt ze' + 'waarom gevaarlijk vanuit zijn functie' = je analyseert de boodschap + positie → Detective. Let op: bij deel 2 moet je Kohls functie als bondskanselier noemen!",signals:["welk beleid","gevaarlijk","vanuit zijn functie"],answer:null,akb:{A:"(1) Mevrouw Honecker ondersteunt het afwijzen van de hervormingen van Gorbatsjov — ze wil de 'verworvenheden van het socialisme' met geweld verdedigen. (2) Als bondskanselier van de BRD vreest Kohl dat dit tot oorlog/geweld aan de grens kan leiden.",K:"(1) De DDR-leiding wijst glasnost/perestrojka af. (2) Als leider van West-Duitsland is Kohl direct verantwoordelijk voor de veiligheid van de Duitsers aan beide kanten van de Muur.",B:"(1) 'DDR-jongeren opriep de wapens op te nemen' / 'socialistische landen die hervormingen doorvoeren waren de vijanden'. (2) Kohl spreekt met Gorbatsjov als bondskanselier."}},
{nr:24,points:2,context:"britse-rijk",type:"detective",question:"Beredeneer waardoor het boek van Paesie veel lezers van Parbode (Surinaams maandblad) aanspreekt.",patternExplain:"'Beredeneer waardoor het aanspreekt' = je analyseert de doelgroep en hun achtergrond → Detective. Let op: je MOET ingaan op de achtergrond van de lezers!",signals:["waardoor","aanspreekt"],answer:null,akb:{A:"Het boek benadrukt de actieve rol van slaafgemaakten zelf in het verzet tegen slavernij — niet alleen de rol van witte abolitionisten.",K:"Lezers van Parbode zijn inwoners van de voormalige plantagekolonie Suriname / nazaten van slaafgemaakten → zij herkennen zich in het verhaal over verzet door slaafgemaakten.",B:"De recensie: 'het traditionele beeld is dat afschaffing vooral het werk is geweest van witte abolitionisten', maar Paesie toont dat slavenopstanden ervoor zorgden dat er minder werd uitgevaren."}},
{nr:25,points:4,context:"nederland",type:"tijdreiziger",question:"De Gouden Koets: verklaar met telkens een KA: (1) welke boodschap moest 'Hulde der Koloniën' in 1898 overbrengen, en (2) waardoor aan het einde van de 20e eeuw discussie over de afbeelding ontstond.",patternExplain:"1898 vs. einde 20e eeuw = verandering in betekenis over tijd → Tijdreiziger. Let op: elk KA maar één keer gebruiken!",signals:["boodschap","discussie","kenmerkend aspect"],answer:null,akb:{A:"(1) 1898: de koloniën zijn verbonden met Nederland en brengen rijkdom. (2) Einde 20e eeuw: de afbeelding wordt gezien als discriminerend/onderdanig.",K:"(1) Past bij 'het nationalisme' of 'de moderne vorm van imperialisme'. (2) Past bij 'de ontwikkeling van pluriforme en multiculturele samenlevingen' of 'de dekolonisatie'.",B:"(1) Inwoners van koloniën bieden geschenken aan aan Nederland-op-de-troon. (2) Discussie: inwoners zijn 'onderdanig' afgebeeld, suggereert superioriteit van Nederland."}}
]};

const EXAM_2023_T2 = {id:"2023t2",name:"2023 Tijdvak 2",date:"juni 2023",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gegevens over verdwenen ontdekkingsreizigers in de juiste chronologische volgorde.",patternExplain:"Zes gegevens ordenen = Tijdlijn-Bouwer. Ankerpunten: eerste Europeanen Zuid-Amerika (~1500), EIC opgericht (begin 17e eeuw), Franse democratische revolutie (1789-1799), stoomschepen poolcirkel (midden 19e eeuw), na WO1 (1920s), Chinese atoomproeven (jaren '60-'80).",signals:["chronologische volgorde","van vroeger naar later"],answer:"6, 3, 4, 5, 1, 2",akb:null},
{nr:2,points:4,context:"vroegmoderne-tijd",type:"matchmaker",question:"Tycho Brahe past bij twee kenmerkende aspecten van de 16e eeuw. Toon dit aan met telkens een andere bronverwijzing.",patternExplain:"'Toon aan voor twee kenmerkende aspecten' = twee KA's koppelen aan twee bewezen uit de bron → Matchmaker. Let op: VERSCHILLENDE bronverwijzingen nodig!",signals:["kenmerkende aspecten","toon aan"],answer:null,akb:{A:"(1) Brahe past bij het renaissance-ideaal: hij benadrukt zijn eigen prestaties. (2) Brahe past bij de heroriëntatie op de Oudheid: hij eert Griekse astronomen.",K:"(1) 'Het veranderende mens- en wereldbeeld van de renaissance en het begin van een nieuwe wetenschappelijke belangstelling'. (2) 'De hernieuwde oriëntatie op het erfgoed van de klassieke Oudheid'.",B:"(1) Brahe's eigen portret op de beste plaats: 'Laat het nageslacht mijn werk maar beoordelen'. (2) Waarderende teksten over Timocharis en Hipparchus / 'met het oude onderzoek'."}},
{nr:3,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Leg uit welke wetenschappelijke methode, die past bij de 17e eeuw, Galilei ondersteunde met zijn uitspraak over zintuigen en intellect.",patternExplain:"'Welke methode ondersteunde hij' = je legt het verband tussen de uitspraak en empirisme → Domino.",signals:["welke methode","ondersteunde"],answer:null,akb:{A:"Galilei ondersteunde het empirisme: theorieën moeten tot stand komen door waarnemen, redeneren en experimenteren.",K:"Door te zeggen dat God ons zintuigen en verstand gaf om te gebruiken, verdedigde hij de methode waarbij eigen onderzoek belangrijker is dan kerkelijke leer.",B:"Galilei: 'Ik geloof niet dat God... bedoelde dat we daar geen gebruik van zouden maken' — een verdediging van waarneming boven kerkelijk dogma."}},
{nr:4,points:3,context:"vroegmoderne-tijd",type:"matchmaker",question:"Noem bij elk van de drie liedjes het kenmerkend aspect uit die tijd dat erbij past. Elk KA maar één keer!",patternExplain:"Per liedje een KA koppelen = drie keer koppelen → Matchmaker. Let op: 'verlicht denken' levert géén punt op bij liedje 2 of 3!",signals:["kenmerkend aspect","past"],answer:null,akb:{A:"(1) Roofzuchtige Spanjaarden met paarden = overzeese expansie. (2) 'Meester kocht mij' op suikerrietvelden = slavenhandel/plantagekoloniën. (3) Bespotten Britse troepen = democratische revoluties.",K:"(1) 'Het begin van de Europese overzeese expansie'. (2) 'De uitbouw van Europese overheersing in de vorm van plantagekoloniën en de trans-Atlantische slavenhandel'. (3) 'De democratische revoluties in westerse landen'.",B:"(1) Inheemse volken zingen over Spanjaarden. (2) Op suikerrietvelden van Barbados. (3) Amerikanen bespotten Britse troepen met Yankee Doodle."}},
{nr:5,points:3,context:"britse-rijk",type:"domino",question:"Het Mayflower Compact is een belangrijk document. Geef een argument: (1) welk politiek motief om trouw aan Jacobus I te benadrukken (zonder bron), en (2) leg uit dat ze hiermee de macht van Jacobus I willen beperken (met bron).",patternExplain:"'Welk motief' + 'op welke wijze beperken ze de macht' = twee oorzaak-gevolgketens → Domino. Let op: bij deel 2 moet je een bronverwijzing geven!",signals:["welk motief","macht beperken"],answer:null,akb:{A:"(1) De kolonisten willen de kolonie legitimeren / hopen op steun van de koning. (2) Ze creëren een eigen 'burgerlijk politiek lichaam' dat zelf wetten maakt — niet de koning.",K:"(1) Trouw benadrukken = bescherming verkrijgen tegen vijanden. (2) De wetgevende macht ligt bij de kolonisten, niet bij Jacobus I → beperking van koninklijke macht.",B:"(2) 'Verbinden en verenigen we onszelf tot een burgerlijk politiek lichaam' / 'wetten, verordeningen en aktes die wij het meest geschikt achten'."}},
{nr:6,points:3,context:"vroegmoderne-tijd",type:"matchmaker",question:"Bij de oprichting van de VOC: (1) welk KA van de 17e eeuw past hierbij, en (2) hoe ondersteunt de instructie het doel van de VOC (met bronverwijzing)?",patternExplain:"'Welk KA past hierbij' = koppelen + 'hoe ondersteunt de instructie het doel' = uitleg → Matchmaker/Domino mix.",signals:["kenmerkend aspect","ondersteunt"],answer:null,akb:{A:"(1) KA: 'wereldwijde handelscontacten en het begin van een wereldeconomie' of 'de bloei van de Republiek'. (2) De instructie helpt de VOC om te ontdekken met wie handel gedreven kan worden.",K:"(1) De VOC was een handelsonderneming gericht op wereldhandel. (2) Door de bevolking, rijken, ambachten etc. te onderzoeken, kon de VOC inschatten waar handelspartners te vinden waren.",B:"(2) 'Onderzoek de bevolking, hun steden... hun rijken... hun werkplaatsen en ambachten' / 'zorgvuldig opnemen in het logboek'."}},
{nr:7,points:3,context:"vroegmoderne-tijd",type:"detective",question:"Pieter 't Hoen publiceert een boek met prenten voor kinderen. Licht toe: (1) welk verlicht denkbeeld wordt verspreid (met bronverwijzing), en (2) waarom juist via een boek met prenten?",patternExplain:"'Welk verlicht denkbeeld' = je analyseert de boodschap van het boek → Detective.",signals:["welk verlicht denkbeeld","boodschap"],answer:null,akb:{A:"(1) Het verlichte denkbeeld dat onderwijs/zelfverbetering belangrijk is. (2) Een prentenboek is geschikt omdat ouders het kunnen voorlezen / kinderen de boodschap via prenten beter begrijpen.",K:"(1) Verlichting = kennis verspreiden, onderwijs voor iedereen. (2) Visuele communicatie bereikt ook jonge kinderen.",B:"(1) Piet wil niet meer naar school → vader geeft hem bedelaarskleren → Piet krijgt spijt en gaat toch weer naar school. (2) Het is een boek 'met prenten voor kinderen'."}},
{nr:8,points:2,context:"britse-rijk",type:"domino",question:"Een soldatenkorps van slaafgemaakten in Suriname. Verklaar met een ander gegeven: (1) waarom plantage-eigenaren tegen waren, en (2) waardoor slaafgemaakten onder druk stonden. Elk gegeven maar één keer!",patternExplain:"'Verklaar waardoor ze tegen waren' + 'waardoor ze onder druk stonden' = twee keer oorzaak-gevolg → Domino. Let op: elk gegeven maar één keer gebruiken! 'Kwijtraken van slaafgemaakten' levert géén punt op.",signals:["verklaar","waardoor","onder druk"],answer:null,akb:{A:"(1) Eigenaren waren tegen omdat gewapende slaafgemaakten zich ook tegen hén konden keren (gegeven 2). (2) Slaafgemaakten stonden onder druk omdat hun gezinnen op de plantages achterbleven (gegeven 3).",K:"(1) Wapens + militaire training = risico voor eigenaren. (2) Vrouw en kinderen als 'gijzelaars' → druk om te presteren.",B:"(1) Gegeven 2: leden kregen militaire training en wapens. (2) Gegeven 3: ze moesten vrouwen en kinderen achterlaten op de plantages."}},
{nr:9,points:2,context:"britse-rijk",type:"domino",question:"In 1840 werden voor het Surinaamse korps 50 mannen in Afrika gekocht. De Britse regering protesteerde. Leg uit waarom.",patternExplain:"'Leg uit waarom ze protesteerden' = oorzaak (Britse verbod op slavenhandel) → protest → Domino.",signals:["waarom","protesteerde"],answer:null,akb:{A:"De Britse regering had de slavenhandel/slavernij al verboden. De aankoop ondermijnde dat besluit.",K:"Als andere landen nog slaven kochten, kon dat leiden tot een nieuwe roep om slavernij in het Britse Rijk.",B:"Groot-Brittannië had de slavenhandel eerder verboden; het kopen van 50 Afrikanen ging hier recht tegenin."}},
{nr:10,points:4,context:"britse-rijk",type:"detective",question:"Het overheidsrapport over arbeidershuisvesting (1839). Licht toe: (1) de beschreven huisvesting is een gevolg van industrialisatie, en (2) verklaar apart dat historici het rapport als betrouwbaar én als representatief beschouwen juist omdat het een overheidsonderzoek is.",patternExplain:"'Gevolg van industrialisatie' + 'betrouwbaar en representatief' = oorzaak-gevolg + bronbeoordeling → Domino + Detective. Let op: betrouwbaar en representatief zijn TWEE VERSCHILLENDE argumenten!",signals:["gevolg","betrouwbaar","representatief"],answer:null,akb:{A:"(1) Door industrialisatie trekken arbeiders massaal naar steden → woningtekort → erbarmelijke omstandigheden. (2a) Betrouwbaar: onderzoekers in overheidsdienst worden gecontroleerd / hebben geen belang bij overdrijving. (2b) Representatief: de overheid heeft middelen om veel woningen in heel het land te bezoeken.",K:"(1) Urbanisatie = gevolg van industrialisatie. (2a) Onafhankelijke inspecteurs. (2b) Landelijke dekking door overheidsmiddelen.",B:"(1) 'Zes tot acht bedden in een kamer' / 'verstikkende stank en warmte' = slechte huisvesting."}},
{nr:11,points:4,context:"britse-rijk",type:"domino",question:"De industriële revolutie versterkt het gevoel van eenheid onder de Britten. Leg met de bron uit op twee verschillende manieren hoe.",patternExplain:"'Op welke twee manieren versterkt dit eenheid' = twee keer oorzaak (industriële ontwikkeling) → gevolg (eenheidsgevoel) → Domino. Let op: twee VERSCHILLENDE manieren + twee bronverwijzingen!",signals:["twee manieren","bijdraagt aan","eenheid"],answer:null,akb:{A:"(1) Trots op Britse industrieproducten → nationalistisch gevoel. (2) Goedkope treinen brengen mensen uit heel Groot-Brittannië samen.",K:"(1) De wereldtentoonstelling toont Britse superioriteit → eenheid door trots. (2) Spoorwegen verbinden stad en platteland → mensen ontmoeten elkaar → eenheid.",B:"(1) De dagtoerist gelooft dat 'Groot-Brittannië de klok slaat' / 'de Amerikanen verslaat'. (2) 'Goedkope treinkaartjes maken het mogelijk de reis te maken' / de dagtoerist 'had nooit gedacht dat hij Londen zou zien'."}},
{nr:12,points:4,context:"britse-rijk",type:"matchmaker",question:"In Livingstones beschrijving zijn motieven voor het modern imperialisme te herkennen. Toon aan voor twee verschillende motieven, met bronverwijzing.",patternExplain:"'Twee motieven voor imperialisme' = twee keer een motief koppelen aan een bewijs uit de bron → Matchmaker.",signals:["motieven","toon aan"],answer:null,akb:{A:"(1) Economisch motief: grondstoffen/handelsproducten verkrijgen. (2) Cultureel motief: het christendom verspreiden / Europese normen opleggen.",K:"(1) Modern imperialisme: rijkdom uit koloniën halen. (2) 'Beschavingsmissie': de 'achterlijke' volken kerstenen/beschaven.",B:"(1) 'Wonderbaarlijk vruchtbaar' / 'katoen in grote overvloed' / 'verkeer langs de oevers openen'. (2) 'Het evangelie te prediken' / 'de armere mensen hebben een afschuw van de slavenhandel'."}},
{nr:13,points:2,context:"duitsland",type:"detective",question:"Er is een tegenstelling binnen de feministische beweging in Duitsland. Geef aan: (1) welk probleem benoemt Ottilie Baader, en (2) bij welke stroming past haar kritiek?",patternExplain:"'Welk probleem benoemt ze' + 'bij welke stroming past dit' = je analyseert haar standpunt → Detective.",signals:["welk probleem","welke stroming"],answer:null,akb:{A:"(1) Baader vindt dat sommige elite-vrouwen niet strijdbaar genoeg zijn / geen oog hebben voor arbeidsters. (2) Haar kritiek past bij het socialisme/communisme.",K:"(1) De feministische beweging is verdeeld langs klasselijnen. (2) Socialisten benadrukken dat de arbeidersklasse wordt genegeerd door de elite.",B:"Baader bekritiseert 'academisch geschoolde vrouwen' die geen aansluiting vinden bij arbeidsters."}},
{nr:14,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen uit het leven van Otto von Habsburg in de juiste chronologische volgorde.",patternExplain:"Zes gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: Versailles (1919), NS-regime Oostenrijk (1938), Conferentie Quebec WO2 (1944), Ostpolitik Brandt (jaren '70), Hongaarse grensopening (1989), EU-uitbreiding (jaren '90-2000).",signals:["chronologische volgorde","van vroeger naar later"],answer:"3, 1, 6, 2, 4, 5",akb:null},
{nr:15,points:4,context:"duitsland",type:"detective",question:"De ingezonden brief van een Britse zakenman (1922). Leg uit dat de bron: (1) minder bruikbaar is voor onderzoek naar de economische situatie in Duitsland, en (2) meer bruikbaar voor onderzoek naar de Britse publieke opinie over de herstelbetalingen.",patternExplain:"'Minder/meer bruikbaar' voor twee onderzoeksgebieden = bronbeoordeling → Detective.",signals:["minder bruikbaar","meer bruikbaar"],answer:null,akb:{A:"(1) Minder bruikbaar: de zakenman is een Brit die mogelijk vooringenomen is / niet de hele situatie kent. (2) Meer bruikbaar: de brief werd in meerdere Britse kranten gepubliceerd → de redacties verwachtten dat dit paste bij de mening van hun lezers.",K:"(1) Hij wantrouwt Duitsland en ziet overal fraude → te eenzijdig voor economisch onderzoek. (2) Publicatie in meerdere kranten bewijst dat de anti-Duitse stemming breed leefde.",B:"(1) 'De grootste fraude uit de geschiedenis' / 'het is een natie van acteurs'. (2) De brief verscheen 'in meerdere Britse kranten'."}},
{nr:16,points:3,context:"duitsland",type:"domino",question:"Gareth Jones verwacht dat Hitler de werkverschaffingskampen gaat gebruiken voor het NS. Onderbouw: (1) noem het KA dat de oprichting verklaart, en (2) leg uit hoe de kampen bijdragen aan nazificering (met bronverwijzing). ",patternExplain:"'Noem het KA' + 'hoe dragen de kampen bij' = koppeling + oorzaak-gevolg → Domino. Let op: het KA 'het in praktijk brengen van het NS' levert géén punt op — de kampen bestonden al vóór Hitlers machtsovername!",signals:["kenmerkend aspect","bijdragen","nazificeren"],answer:null,akb:{A:"(1) KA: 'de crisis van het wereldkapitalisme' → hoge werkloosheid → kampen opgericht. (2) In kampen kunnen grote groepen jongeren tegelijk bereikt worden met propaganda.",K:"(1) Economische crisis → massawerkloosheid → werkverschaffing als oplossing. (2) Gezamenlijke activiteiten + discussies → ideale omgeving voor indoctrinatie.",B:"(2) Jones: 'tussen 300.000 en 400.000 jongeren' / 'samen zongen' / 'met elkaar over van alles discussieerden' / 'hij de basis van vrijwilligheid zal vernietigen en verplicht gaat stellen'."}},
{nr:17,points:3,context:"duitsland",type:"domino",question:"Anna Seghers, communistische schrijfster. Licht toe: (1) naar aanleiding van welke gebeurtenis werden communisten in 1933 gearresteerd, en (2) waarom juichte de SED haar verhuizing naar Oost-Berlijn in 1950 toe?",patternExplain:"'Naar aanleiding van welke gebeurtenis' + 'waardoor juichte de SED dit toe' = twee keer oorzaak-gevolg → Domino. Let op: bij deel 2 moet je de oprichting van de DDR (1949) noemen!",signals:["welke gebeurtenis","waardoor","juichte toe"],answer:null,akb:{A:"(1) De Rijksdagbrand (1933) → communisten als verdachten gearresteerd. (2) De DDR was in 1949 opgericht → een beroemde schrijfster die kiest voor Oost-Berlijn = propaganda voor de DDR.",K:"(1) Hitler gebruikte de Rijksdagbrand om communisten op te pakken / de machtigingswet door te drukken. (2) Een bekende schrijfster die verhuist = bewijs dat de DDR aantrekkelijk is.",B:"(1) Seghers werd als communist gearresteerd in 1933. (2) Ze verhuisde in 1950 van West- naar Oost-Berlijn."}},
{nr:18,points:2,context:"britse-rijk",type:"domino",question:"Leg uit hoe het dekolonisatieproces na WO2 heeft bijgedragen aan de Koude Oorlog.",patternExplain:"'Hoe droeg dekolonisatie bij aan de Koude Oorlog' = oorzaak (vrijheid kiezen) → gevolg (strijd om invloedssferen) → Domino.",signals:["bijgedragen aan","leg uit"],answer:null,akb:{A:"Nieuwe onafhankelijke landen konden kiezen bij welk blok ze zich aansloten → dit versterkte de strijd om invloedssferen tussen de VS en de SU.",K:"Beide supermachten wilden zo veel mogelijk nieuwe bondgenoten → dekolonisatie voedde het wantrouwen en de rivaliteit.",B:"Na WO2 werden veel koloniën onafhankelijk → ze werden een strijdtoneel voor westerse en communistische invloed."}},
{nr:19,points:4,context:"duitsland",type:"domino",question:"Radio Free Europe: leg beide besluiten uit vanuit het politieke beleid van de SU: (1) waarom in 1950 de uitzendingen verstoren, en (2) waarom in 1988 stoppen met verstoren?",patternExplain:"'Leg beide besluiten uit vanuit het beleid' = twee keer oorzaak (beleid) → gevolg (besluit) → Domino.",signals:["leg uit","beleid"],answer:null,akb:{A:"(1) 1950: de SU wilde haar invloedssfeer beschermen → westerse info kon het communisme ondermijnen. (2) 1988: glasnost / loslaten Brezjnev-doctrine → censuur was niet meer nodig.",K:"(1) Controle op informatie = essentieel voor een totalitair regime. (2) Openheid (glasnost) betekent dat censuur wordt afgebouwd.",B:"(1) Radio Free Europe zond in Pools, Tsjechisch, Roemeens vanuit West-Duitsland. (2) In 1988 stopte de SU met het verstoren."}},

{nr:21,points:2,context:"nederland",type:"detective",question:"Sommige gastarbeiders hebben een eenzijdig beeld van de Nederlandse samenleving. Leg uit met een bronverwijzing.",patternExplain:"'Welk eenzijdig beeld' = je analyseert het verwachtingspatroon van Tokac → Detective.",signals:["eenzijdig beeld","leg uit"],answer:null,akb:{A:"Tokac had het eenzijdige beeld dat Nederland een modern, volledig geïndustrialiseerd land was — hij verwachtte geavanceerde machines.",K:"In werkelijkheid werd bij Duintjer nog met de hand gelast en met mankracht gewerkt — heel anders dan zijn verwachting.",B:"Tokac: 'In Zonguldak zouden we een dergelijke werkplaats niet eens fabriek noemen, maar atelier' — hij is verbaasd over het handwerk."}},
{nr:22,points:2,context:"nederland",type:"domino",question:"Twee veranderingen in de taak van Staatsbosbeheer in de jaren 1960. Geef voor beide een historische verklaring.",patternExplain:"Twee keer 'geef een verklaring' = twee oorzaak-gevolgketens → Domino.",signals:["verklaring"],answer:null,akb:{A:"(1) Hout als brandstof werd minder belangrijk door de vondst/toepassing van aardgas. (2) Meer recreatie door toenemende welvaart/vrije tijd.",K:"(1) Aardgas verving hout als energiebron. (2) Welvaart → meer vrije tijd → meer bezoekers in natuurgebieden.",B:"(1) Taak houtlevering minder belangrijk. (2) Taak: recreatieve voorzieningen beheren en bezoekersstroom in goede banen leiden."}},
{nr:23,points:2,context:"nederland",type:"domino",question:"De Hippy Happy beurs (1967) verkocht producten als gitaren, kleding en sieraden. Bij welk uitgangspunt van de hippies sloot dit NIET aan?",patternExplain:"'Bij welk uitgangspunt sloot dit niet aan' = tegenstelling herkennen → Domino.",signals:["niet aansloot","uitgangspunt"],answer:null,akb:{A:"Hippies verzetten zich tegen de consumptiemaatschappij, maar de beurs was juist gericht op het verkopen van spullen aan jongeren.",K:"Het hippie-ideaal was anti-materialistisch, maar de beurs gebruikte hun cultuur om consumptie te bevorderen — een contradictie.",B:"Op de beurs werden gitaren, kleding en sieraden verkocht / bands traden op om hippies te trekken → commerciële exploitatie van tegencultuur."}},
{nr:24,points:4,context:"duitsland",type:"detective",question:"Met de foto en titel kan de communistische partij twee boodschappen overbrengen aan de Oost-Duitse bevolking: (1) over de relatie met de SU, en (2) over de DDR-regering. Leg beide uit met een andere bronverwijzing.",patternExplain:"'Welke boodschappen' = je analyseert het propagandadoel → Detective. Let op: VERSCHILLENDE bronverwijzingen nodig!",signals:["boodschappen","overbrengen"],answer:null,akb:{A:"(1) De DDR heeft een hechte vriendschap/goede samenwerking met de Sovjet-Unie. (2) De DDR-regering is technologisch superieur aan de BRD.",K:"(1) Samenwerking met de SU = kracht van het Oostblok. (2) 'De eerste Duitser in de ruimte is een Oost-Duitser' = DDR beter dan BRD.",B:"(1) De foto toont Jähn en Bykovski lachend naast elkaar bij het ruimtevaartuig. (2) De titel: 'De eerste Duitser in de ruimte: een Oost-Duitse burger'."}},
{nr:25,points:2,context:"nederland",type:"detective",question:"Opland keert zich tegen beleid van Lubbers. Tegen welk beleid, met bronverwijzing?",patternExplain:"'Tegen welk beleid keert hij zich' = je analyseert de kritiek van de tekenaar → Detective.",signals:["welk beleid","keert zich"],answer:null,akb:{A:"Opland keert zich tegen het beperken van de verzorgingsstaat / het verlagen van uitkeringen door het kabinet-Lubbers.",K:"Lubbers bezuinigde op sociale voorzieningen → de zwakken werden getroffen.",B:"'Pakken van de zwakken?' / een kwetsbare man met een bijl (met 'Lubbers' erop) in zijn rug / 'NEEN'."}},
{nr:26,points:2,context:"nederland",type:"domino",question:"Kees van Kooten beschreef een sociaal-cultureel veranderingsproces. Welk? Let op: 'toenemende welvaart' levert géén punt op!",patternExplain:"'Welk veranderingsproces' = je herkent het fenomeen in de beschrijving → Domino.",signals:["welk veranderingsproces"],answer:null,akb:{A:"Het ontstaan van een eigen jongerencultuur: jongeren maakten zich een nieuwe kledingstijl aan die bewust afweek van die van hun ouders.",K:"In de jaren '60 ontwikkelden jongeren een eigen identiteit die haaks stond op de waarden van de oudere generatie — een generatieconflict.",B:"Van Kooten: 'Dat vonden je ouders natuurlijk verschrikkelijk, zoals het hoort' — de kleding was een bewuste afwijking."}}

{nr:2,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Leg uit waardoor de belangstelling voor de legende over 'pausin Johanna' toenam tijdens de protestantse reformatie.",patternExplain:"'Waardoor nam de belangstelling toe' = oorzaak (reformatie) → gevolg (interesse in anti-paus legende) → Domino.",signals:["waardoor","toenam"],answer:null,akb:{A:"Tijdens de reformatie keerden protestanten zich tegen de paus/katholieke kerk. De legende over een vrouwelijke bedrieger als paus kon het gezag van de kerk ondermijnen.",K:"Protestanten gebruikten de legende als bewijs dat het pausschap onbetrouwbaar was.",B:"De legende gaat over een vrouw die zich als man voordeed en paus werd — haar bedrog kwam uit toen ze beviel."}},
{nr:3,points:3,context:"vroegmoderne-tijd",type:"detective",question:"De bron van de Venetiaanse ambassadeur over Filips II gebruiken voor onderzoek naar de Opstand. (1) Argument voor betrouwbaarheid, en (2) verklaar de kritiek van de Nederlandse edelen met bronverwijzing.",patternExplain:"'Argument voor betrouwbaarheid' + 'verklaring met bronverwijzing' = bronbeoordeling + analyse → Detective.",signals:["betrouwbaarheid","verklaring"],answer:null,akb:{A:"(1) De ambassadeur is ooggetuige van Filips' werkwijze én geen partij in het conflict → onafhankelijke bron. (2) Nederlandse edelen voelen zich buitengesloten: Filips geeft hen geen bestuurlijke positie.",K:"(1) Een neutrale waarnemer is betrouwbaarder dan iemand die partij is. (2) Buitensluiting → frustratie → opstand.",B:"(2) Suriano: 'Hij woont tussen de Spanjaarden, hij vraagt hun om advies' / 'kijkt neer op de Duitsers' / 'laat niemand [uit andere landen] toe tot zijn geheime raden'."}},
{nr:4,points:3,context:"britse-rijk",type:"detective",question:"De ontmoeting met de inheemse bevolking (1607) past bij de beginperiode van de Engelse aanwezigheid. Ondersteun met bronverwijzing en verklaar (zonder bron) waarom Newport de bevolking niet bestraft.",patternExplain:"'Past bij de beginperiode' = je analyseert de omstandigheden + houding van de Engelsen → Detective.",signals:["past bij","verklaren"],answer:null,akb:{A:"(1) De Engelsen houden de verhoudingen goed / erkennen het gezag van de stamhoofden → past bij de kwetsbare beginperiode. (2) Newport heeft de inheemse bevolking nodig om te overleven / kan een conflict niet winnen.",K:"(1) In de beginperiode zijn de Engelsen afhankelijk van de lokale bevolking. (2) De Engelsen zijn nog in de minderheid.",B:"(1) Newport bedankt de stamhoofden en beloont de dieven met speelgoed (in plaats van te straffen). (2) De Engelsen verhandelen goederen met de bevolking."}},
{nr:5,points:3,context:"vroegmoderne-tijd",type:"detective",question:"Lodewijk XIV laat een beeld maken als propaganda. (1) Welke boodschap over het intrekken van protestantse rechten (met bronverwijzing), en (2) hoe wordt weergegeven dat hij een absoluut vorst is?",patternExplain:"'Welke boodschap' + 'hoe wordt hij weergegeven' = je analyseert de propaganda → Detective.",signals:["boodschap","weergegeven"],answer:null,akb:{A:"(1) Boodschap: Lodewijk XIV bestrijdt terecht een kwaadaardig geloof. (2) Hij is afgebeeld als een Romeinse keizer → almachtig heerser.",K:"(1) Het protestantisme wordt als slecht/gevaarlijk voorgesteld → het intrekken van rechten is gerechtvaardigd. (2) Romeinse keizer = onbeperkte macht = absoluut vorst.",B:"(1) Hij vertrapt het protestantisme / slangen kruipen uit protestantse boeken (slangen = kwaad). (2) Lodewijk is afgebeeld in toga en sandalen als een Romeinse keizer."}},
{nr:6,points:2,context:"vroegmoderne-tijd",type:"detective",question:"Het artikel over Liberté Barreau (1793) toont continuïteit in de Franse samenleving. Welke continuïteit op sociaal-maatschappelijk gebied, met bronverwijzing?",patternExplain:"'Welke continuïteit' = je herkent wat NIET veranderd is ondanks de revolutie → Detective.",signals:["continuïteit"],answer:null,akb:{A:"Ondanks de revolutie blijft het traditionele rollenpatroon bestaan: de zorgende rol van vrouwen wordt benadrukt.",K:"Hoewel Liberté als soldaat vecht, wordt ze vooral geprezen om haar vrouwelijke zorgtaken — de revolutie veranderde de positie van vrouwen niet.",B:"'Met alle zorgen die een echtgenote aan haar man verschuldigd is' / 'dat ze de deugden van een vrouw niet had opgegeven' (= zorgen voor haar gewonde man)."}},
{nr:7,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"De oorlog waarin Liberté Barreau vocht past bij een KA van de 18e eeuw. Noem het KA en geef aan waardoor het past.",patternExplain:"'Noem het KA' + 'geef aan waardoor het past' = koppelen → Matchmaker.",signals:["kenmerkend aspect","past bij"],answer:null,akb:{A:"De oorlog past bij 'de democratische revoluties in westerse landen met als gevolg discussies over grondwetten, grondrechten en staatsburgerschap'.",K:"In deze oorlog verdedigde de Franse Republiek zich tegen monarchieën die de val van het absolutisme wilden terugdraaien.",B:"In 1793 was Frankrijk een republiek die in oorlog was met omringende landen die de monarchie steunden."}},
{nr:8,points:2,context:"britse-rijk",type:"domino",question:"De gewelddadige onderdrukking van een slavenopstand op Jamaica versterkte de steun voor afschaffing in Groot-Brittannië. Leg uit met bronverwijzing.",patternExplain:"'Hoe versterkte dit de steun' = oorzaak (geweld) → gevolg (meer steun voor afschaffing) → Domino.",signals:["versterkte","steun"],answer:null,akb:{A:"Het gewelddadige optreden tegen de slaafgemaakten leidde bij de Britten tot het besef dat slavernij onhoudbaar was / tot meer medelijden.",K:"Berichten over de brutale onderdrukking schokte het Britse publiek → meer steun voor abolitionisme.",B:"'Iedereen die bij de rebellen wordt aangetroffen zal zonder pardon ter dood worden gebracht' / 'Geef je over en smeek om genade'."}},
{nr:9,points:4,context:"britse-rijk",type:"tijdreiziger",question:"Uit de bron (Victoria's proclamatie 1858) blijkt zowel verandering als continuïteit in het bestuur van India. Geef aan met telkens een andere bronverwijzing.",patternExplain:"'Verandering en continuïteit' = je vergelijkt voor en na → Tijdreiziger. Let op: VERSCHILLENDE bronverwijzingen nodig!",signals:["verandering","continuïteit"],answer:null,akb:{A:"Verandering: India komt onder direct Brits regeringsgezag (i.p.v. de EIC). Continuïteit: de Britten blijven het bestaande inheemse bestuur gebruiken.",K:"Verandering: de EIC verliest haar bestuurlijke macht. Continuïteit: verdragen met inheemse vorsten worden gehandhaafd.",B:"Verandering: 'benoemen wij hem tot onderkoning en gouverneur-generaal'. Continuïteit: 'alle verdragen met hen, gemaakt door de East India Company, worden door ons geaccepteerd en gehandhaafd'."}},
{nr:10,points:2,context:"nederland",type:"matchmaker",question:"De Wet op de Aanleg van Staatsspoorwegen (1860). Noem het KA dat hierbij past en geef aan hoe de regering de economie wilde stimuleren.",patternExplain:"'Noem het KA' + 'economie stimuleren' = koppelen + uitleg → Matchmaker.",signals:["kenmerkend aspect","stimuleren"],answer:null,akb:{A:"KA: 'de industriële revolutie die in de westerse wereld de basis legde voor een industriële samenleving'.",K:"De regering wilde met spoorlijnen het transport van producten en grondstoffen versnellen/vergoedkopen → economische stimulans.",B:"In 1860 werd begonnen met de aanleg van negen staatslijnen, zoals Zutphen-Enschede."}},
{nr:11,points:3,context:"britse-rijk",type:"domino",question:"Lord Ashley bekritiseert het industrieel kapitalisme. (1) Welk kenmerk van kapitalisme veroorzaakt de misstanden, en (2) welke beleidsmaatregel ondersteunt hij (met bronverwijzing)?",patternExplain:"'Welk kenmerk veroorzaakt misstanden' + 'welke maatregel' = oorzaak-gevolg + koppeling → Domino. Let op: je moet de Factory Acts noemen!",signals:["welk kenmerk","welke beleidsmaatregel"],answer:null,akb:{A:"(1) Bij het kapitalisme wordt gestreefd naar maximale winst / zo laag mogelijke loonkosten → kinderarbeid en slechte omstandigheden. (2) Lord Ashley ondersteunt de Factory Acts.",K:"(1) Winstmaximalisatie ten koste van arbeiders. (2) De Factory Acts beperkten werkuren → verbetering.",B:"(2) 'Na de beperking van werkuren... was er niet één kreupele te vinden in die uitgestrekte stad'."}},
{nr:12,points:2,context:"britse-rijk",type:"domino",question:"Een Indiaas tijdschrift publiceerde artikelen over (1) invloedrijke Indiërs in GB en (2) productie van katoen. Welk politiek en welk economisch doel wilde de uitgever bereiken?",patternExplain:"'Welk politiek en economisch doel' = twee doelen afleiden → Domino.",signals:["welk doel","bereiken"],answer:null,akb:{A:"Politiek: Indiërs moeten zich gaan identificeren als Britse onderdanen / het Britse bestuur accepteren. Economisch: Indiërs moeten Britse goederen kopen / voor de Britse markt produceren.",K:"(1) Door rijke Indiërs in GB te tonen → het Britse bestuur als positief presenteren. (2) Door artikelen over katoenproductie → Britse economische belangen bevorderen.",B:"(1) Artikelen over invloedrijke Indiërs in Groot-Brittannië. (2) Artikelen over productie en gebruik van katoen en stoffen."}},
{nr:13,points:4,context:"britse-rijk",type:"detective",question:"Het schilderij van Surapati vs. kapitein Tack. Licht toe: (1) het is mogelijk dat een voorstander van het Nederlands bestuur de opdracht gaf (met bronverwijzing), en (2) verklaar de belangstelling onder Indonesiërs eind 19e eeuw (met KA).",patternExplain:"'Wie gaf de opdracht' + 'verklaar de belangstelling met KA' = bronanalyse + koppeling → Detective.",signals:["mogelijk","verklaren","kenmerkend aspect"],answer:null,akb:{A:"(1) De Nederlanders worden als machtiger weergegeven / de aanval op Tack wordt als misdaad afgebeeld. (2) Eind 19e eeuw groeit het nationalisme in Indonesië → Surapati als verzetsheld inspireert.",K:"(1) Een voorstander van het bestuur zou de Nederlanders positief willen afbeelden. (2) Past bij 'de opkomst van de politiek-maatschappelijke stroming nationalisme'.",B:"(1) Tack is groter afgebeeld dan Surapati / de tekst noemt het 'de moord op kapitein Tack'. (2) Rond 1890 groeit de nationalistische beweging in Indonesië."}},
{nr:14,points:3,context:"duitsland",type:"domino",question:"Kuttner citeert Von Hindenburg (1918) en moet in 1933 vluchten. Licht toe: (1) hoe wilde hij de dolkstootlegende ontkrachten, en (2) waarom moest hij in 1933 vluchten?",patternExplain:"'Dolkstootlegende ontkrachten' + 'vluchten in 1933' = twee oorzaak-gevolgketens → Domino.",signals:["ontkrachten","verklaren"],answer:null,akb:{A:"(1) Het citaat van Von Hindenburg bewijst dat de legerleiding zelf de oorlog wilde beëindigen — dus geen 'dolkstoot in de rug'. (2) In 1933 kwamen de nazi's aan de macht die politieke tegenstanders (sociaaldemocraten) vervolgden.",K:"(1) De dolkstootlegende beweerde dat het leger had kunnen doorvechten maar verraden werd door de politiek. Von Hindenburgs eigen woorden weerspreken dit. (2) De nazi's vervolgden iedereen die de dolkstootlegende ontkrachtte.",B:"(1) Von Hindenburg: 'het is absoluut noodzakelijk om de strijd af te breken... elke gemiste dag kost duizenden levens'. (2) Kuttner was sociaaldemocraat."}},
{nr:15,points:3,context:"duitsland",type:"detective",question:"De foto uit Schmölln (1940): (1) toon aan dat de situatie past bij het NS in de praktijk, en (2) wat wilde het stadsbestuur bereiken met deze bestraffing (met bronverwijzing)?",patternExplain:"'Past bij het NS' + 'wat wilden ze bereiken' = je analyseert het doel van de publieke straf → Detective.",signals:["past bij","bereiken"],answer:null,akb:{A:"(1) De Volksgemeinschaft en de bestraffing voor het helpen van 'minderwaardige' Polen past bij het NS in praktijk. (2) Het stadsbestuur wilde de bevolking afschrikken om tegen het NS in te gaan.",K:"(1) Uitsluiting uit de Volksgemeinschaft + rassenhiërarchie = kern van het NS. (2) Publieke vernedering = afschrikking → nazificatie bevorderen.",B:"(2) De vrouwen worden publiekelijk op het stadsplein kaalgeschoren terwijl omstanders toekijken / de borden: 'Ik ben uit de Volksgemeinschaft verstoten'."}},
{nr:16,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gegevens over stakingen in Nederland in de juiste chronologische volgorde.",patternExplain:"Zes stakingen ordenen = Tijdlijn-Bouwer. Ankerpunten: Noordhollandsch Kanaal + stoomschepen (begin 19e eeuw), crisis wereldkapitalisme (jaren '30), spoorwegstaking WO2 (1944), geleide loonpolitiek (jaren '50-'60), oliecrisis (1973), Lubbers (jaren '80).",signals:["chronologische volgorde","van vroeger naar later"],answer:"2, 6, 3, 1, 4, 5",akb:null},
{nr:17,points:3,context:"duitsland",type:"domino",question:"Köller beschrijft als kind een ontruiming in 1946. (1) Welke politieke beslissing van de geallieerden veroorzaakte dit, en (2) toon sociale ontwrichting aan (met bronverwijzing).",patternExplain:"'Welke beslissing' + 'aantonen dat er ontwrichting is' = oorzaak-gevolg → Domino. Let op: 'verdeling in bezettingszones' levert géén punt op!",signals:["welke beslissing","sociale ontwrichting"],answer:null,akb:{A:"(1) De geallieerden besloten de Duitse buitengrenzen te verleggen (Duits gebied werd Pools). (2) Duitsland kreeg te maken met miljoenen Heimatvertriebenen die hun huis moesten verlaten.",K:"(1) Gebiedsverlies aan Polen → dorpen werden ontruimd. (2) Gedwongen vertrek = trauma en ontwrichting.",B:"(2) 'Iedereen moet weg. Het dorp moet worden ontruimd' / 'Het lied Vaarwel mijn dierbaar vaderland' / vrouwen en kinderen met rugzakken op pad."}},
{nr:18,points:2,context:"duitsland",type:"domino",question:"De CDU verspreidde tot 1961 de krant Der Tag in Oost-Berlijn. (1) Hoe ondersteunde dit het ideaal van Duitse eenheid, en (2) waarom stopte het na 1961?",patternExplain:"'Hoe ondersteunde dit' + 'waarom stopte het' = twee keer oorzaak-gevolg → Domino. Let op: je MOET de Berlijnse Muur noemen bij deel 2!",signals:["ondersteunen","verklaren"],answer:null,akb:{A:"(1) Via de krant konden propagandaboodschappen over eenheid de Oost-Duitse bevolking bereiken. (2) Na de bouw van de Berlijnse Muur (1961) kon de krant niet meer worden verspreid.",K:"(1) De krant hield de band met Oost-Duitsers in stand. (2) De Muur sloot de grens af → fysiek transport onmogelijk.",B:"De CDU liet Der Tag verspreiden in Oost-Berlijn; DDR-burgers konden hem ook in West-Berlijn kopen."}},
{nr:19,points:4,context:"nederland",type:"domino",question:"In 1965 werd gediscussieerd over (1) het toelaten van nieuwe omroepen en (2) het toestaan van reclame op TV. Leg per verandering uit door welke ontwikkeling in de Nederlandse maatschappij.",patternExplain:"Twee keer 'welke ontwikkeling veroorzaakte dit' = twee oorzaak-gevolgketens → Domino.",signals:["welke ontwikkeling","veroorzaakt"],answer:null,akb:{A:"(1) Nieuwe omroepen: door ontzuiling/sociaal-culturele verandering was er behoefte aan omroepen buiten het verzuilde bestel. (2) Reclame: door de consumptiemaatschappij/toenemende welvaart wilden bedrijven via TV producten verkopen.",K:"(1) Ontzuiling → traditionele omroepen passen niet meer bij alle kijkers. (2) Welvaart → meer koopkracht → bedrijven willen adverteren.",B:"(1) Het toelaten van nieuwe omroepen. (2) Het toestaan van reclame op televisie."}},
{nr:20,points:4,context:"nederland",type:"detective",question:"Jongejan selecteert gastarbeiders in Marokko (1969). Welke bezorgdheid op economisch en op sociaal vlak wil hij wegnemen, met telkens een andere bronverwijzing?",patternExplain:"'Welke bezorgdheid wegnemen' = je analyseert het doel van Jongejan → Detective. Let op: twee VERSCHILLENDE bronverwijzingen!",signals:["bezorgdheid","wegnemen"],answer:null,akb:{A:"Economisch: Jongejan wil de zorg wegnemen dat gastarbeiders het werk niet aankunnen. Sociaal: hij wil de zorg wegnemen dat ze zich niet kunnen aanpassen.",K:"Economisch: geschikt voor de arbeidsmarkt. Sociaal: goede communicatie mogelijk.",B:"Economisch: 'representatief voor de Nederlandse arbeidsmarkt, geen analfabeet'. Sociaal: 'behoorlijke communicatie' / 'ik moet het scherp spelen'."}},
{nr:21,points:2,context:"nederland",type:"detective",question:"Van Meekeren wil dat de regering haar beleid verandert. Je twijfelt aan de betrouwbaarheid van de reportage. Verklaar je twijfel met een voorbeeld uit de bron.",patternExplain:"'Twijfel aan betrouwbaarheid' = je analyseert de partijdigheid van de maker → Detective.",signals:["betrouwbaarheid","twijfel"],answer:null,akb:{A:"Omdat Van Meekeren wil dat het beleid verandert, is het mogelijk dat zijn vragen/opmerkingen sturend zijn — hij wil de selectie in een negatief daglicht stellen.",K:"Een maker met een agenda kan bewust een eenzijdig beeld schetsen.",B:"De journalist vergelijkt de selectie met 'een slavenmarkt' / vraagt 'hoe kunt u zo één, twee, drie uitmaken of u iemand afwijst' → sturende vragen."}},
{nr:22,points:2,context:"duitsland",type:"domino",question:"De SU verving Ulbricht door een leider die de Ostpolitik wél steunde. Leg uit dat de SU hiermee de détente steunde.",patternExplain:"'Leg uit dat dit de détente steunde' = oorzaak (vervanging) → gevolg (ontspanning) → Domino.",signals:["leg uit","steunde"],answer:null,akb:{A:"De Ostpolitik had tot doel de relatie BRD-DDR te verbeteren. Door Ulbricht te vervangen steunde de SU dit → ontspanning tussen de blokken (détente).",K:"Détente = ontspanning in de Koude Oorlog. Meewerken aan de Ostpolitik bevordert dit.",B:"Ulbricht stond afwijzend tegenover de Ostpolitik van Brandt; de SU verving hem."}},
{nr:23,points:3,context:"nederland",type:"detective",question:"Collignons prent over de verzorgingsstaat (1981). (1) Welke visie geeft hij weer (met bronverwijzing), en (2) zonder bron: welk beleid voeren de kabinetten-Lubbers?",patternExplain:"'Welke visie' = je analyseert de boodschap van de prent → Detective.",signals:["welke visie","welk beleid"],answer:null,akb:{A:"(1) Collignon geeft weer dat de verzorgingsstaat overbelast is / dreigt om te vallen. (2) De kabinetten-Lubbers bezuinigen op de verzorgingsstaat / beperken uitkeringen.",K:"(1) De welzijnssector is te groot geworden voor wat de verzorgingsstaat kan dragen. (2) Liberaal beleid: minder overheidsuitgaven.",B:"(1) De boot 'welzijnssector' is overvol en dreigt de boot 'verzorgingsstaat' te doen kapseizen / donkere wolken op de achtergrond."}},
{nr:24,points:3,context:"duitsland",type:"domino",question:"Operatie Dialoog: Honecker bezoekt Güstrow (1981). (1) Welk kenmerk van totalitaire dictatuur illustreer je hiermee (met bronverwijzing), en (2) waarom was het nodig dat DDR-burgers geen West-Duitse TV zagen?",patternExplain:"'Welk kenmerk van dictatuur' + 'waarom nodig vanwege West-Duitse TV' = twee oorzaak-gevolgketens → Domino.",signals:["kenmerk","noodzakelijk"],answer:null,akb:{A:"(1) De overheid beheerst het leven van burgers volledig / bedrijft propaganda. (2) Als DDR-burgers via West-Duitse TV zagen dat hun medeburgers kritiek hadden, konden ze opstandiger worden.",K:"(1) Totalitair: alle aspecten van het leven worden gecontroleerd. (2) West-Duitse TV kon de propagandaleugens ontmaskeren.",B:"(1) Inwoners onder huisarrest / Stasi-medewerkers als nepbezoekers / geforceerd gejuich. (2) Westerse media waren aanwezig bij het bezoek."}},
{nr:25,points:2,context:"duitsland",type:"detective",question:"Gorbatsjov en adviseurs over de instabiliteit in de DDR (1989). (1) Welke oorzaak geven ze, en (2) toon aan dat ze een eenzijdig beeld geven (betrek de rol van de SU).",patternExplain:"'Welke oorzaak geven ze' + 'eenzijdig beeld' = je analyseert wat ze wél en NIET zeggen → Detective.",signals:["welke oorzaak","eenzijdig"],answer:null,akb:{A:"(1) Ze geven Honeckers lange aanblijven/impopulariteit als oorzaak. (2) Ze noemen NIET dat de SU zelf instabiliteit veroorzaakt door glasnost/perestrojka en het loslaten van de Brezjnev-doctrine.",K:"(1) Honecker is 'afgeschreven door zijn volk'. (2) De Sovjet-hervormingen wekten verwachtingen in de DDR; het loslaten van de Brezjnev-doctrine betekende dat de SU de DDR niet meer militair zou steunen.",B:"(1) Gorbatsjov noemde Honecker een 'klootzak' / 'hij is afgeschreven door zijn volk'. (2) Ze bespreken alleen Honeckers falen, niet hun eigen rol."}},
{nr:26,points:2,context:"duitsland",type:"domino",question:"Bij de invoering van de euro werden fictieve bouwwerken in Europese architectonische stijlen op de biljetten afgebeeld. Leg uit dat dit moest bijdragen aan Europese eenheid.",patternExplain:"'Leg uit dat dit bijdraagt aan eenheid' = oorzaak (ontwerp) → gevolg (eenheid) → Domino.",signals:["bijdragen aan","eenheid"],answer:null,akb:{A:"Door fictieve bouwwerken in Europese stijlen af te beelden werd de gemeenschappelijke cultuur benadrukt, zonder dat landen zich achtergesteld voelden.",K:"Geen enkel land wordt voorgetrokken → iedereen voelt zich verbonden met de Europese munt.",B:"De EU koos bewust voor fictieve bouwwerken in verschillende Europese architectonische stijlen, niet voor bestaande gebouwen uit specifieke landen."}}
]};

const EXAM_2024_T2 = {id:"2024t2",name:"2024 Tijdvak 2",date:"20 juni 2024",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen over de kleur van kleding in de juiste chronologische volgorde.",patternExplain:"Zes kleding-gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: EIC opgericht (begin 17e eeuw), Amerikaanse onafhankelijkheidsstrijders (1775-1783), koningin Victoria trouwjurk (1840), WO1 (1914-1918), NSDAP bruinhemden (jaren '20-'30), hippies tie-dye (jaren '60-'70).",signals:["chronologische volgorde","van vroeger naar later"],answer:"6, 1, 5, 3, 2, 4",akb:null},
{nr:2,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"Twee gegevens over de Farnese-familie en het Romeinse badhuis van Caracalla. Noem per gegeven een passend kenmerkend aspect. Elk KA maar één keer!",patternExplain:"Per gegeven een KA koppelen = twee keer koppelen → Matchmaker. Let op: als je hetzelfde KA twee keer gebruikt, maximaal 1 punt!",signals:["kenmerkend aspect","past"],answer:null,akb:{A:"(1) Het opgraven en bestuderen past bij 'het begin van een nieuwe wetenschappelijke belangstelling' of 'de hernieuwde oriëntatie op de klassieke Oudheid'. (2) Een tafel naar Romeins voorbeeld maken past bij 'de hernieuwde oriëntatie op de klassieke Oudheid'.",K:"(1) Opgravingen = wetenschappelijk onderzoek OF heroriëntatie op de Oudheid. (2) Nabootsen van Romeinse stijl = heroriëntatie op de Oudheid.",B:"(1) Rond 1540: opgraven en bestuderen van een Romeins badhuis. (2) Rond 1565: een tafel maken naar Romeins voorbeeld met de vondsten."}},
{nr:3,points:2,context:"britse-rijk",type:"detective",question:"De bron over Newport en het kruis (1607): minder bruikbaar voor onderzoek naar bekering, meer bruikbaar voor uitbreiding van Brits grondgebied. Ondersteun beide met een bronargument.",patternExplain:"'Minder/meer bruikbaar' = je beoordeelt de bron voor twee onderzoeksgebieden → Detective.",signals:["minder bruikbaar","meer bruikbaar"],answer:null,akb:{A:"Minder bruikbaar voor bekering: het kruis wordt uitgelegd als vriendschapssymbool, niet als christelijk symbool. Meer bruikbaar voor grondgebied: de naam van de koning wordt op het kruis gezet → claimen van land.",K:"Newport verdoezelt de religieuze betekenis → weinig bewijs voor bekeringsmotief. De inscriptie 'Jacobus Rex 1607' → grondclaim.",B:"Minder: Newport vertelt Nauirans dat de armen van het kruis 'Powhatan en hemzelf voorstelden'. Meer: het kruis draagt de inscriptie 'Jacobus Rex 1607' / 'verkondigden dat hij de koning was'."}},
{nr:4,points:3,context:"vroegmoderne-tijd",type:"detective",question:"De anonieme protestantse prent (1618). (1) Toon aan dat de maker de kant kiest van protestanten (bronverwijzing), (2) waardoor draagt een prent bij aan snelle verspreiding, en (3) waarom wil de maker anoniem blijven?",patternExplain:"'Welke boodschap' + 'waarom een prent' + 'waarom anoniem' = drie aspecten → Detective.",signals:["boodschap","verspreiding","anoniem"],answer:null,akb:{A:"(1) De maker toont Luther positief en jezuïeten als bondgenoten van de duivel. (2) Een prent is begrijpelijk voor analfabeten en kan massaal worden gedrukt. (3) De maker wil bestraffing door de katholieke kerk voorkomen.",K:"(1) Protestanten = goed (boom van Gods woord), katholieken = kwaad (duivel). (2) Visuele boodschap bereikt meer mensen. (3) Anonimiteit beschermt tegen vervolging.",B:"(1) Uit Luther groeit de boom 'Verbum Dei' (Gods woord) / jezuïeten overleggen met een duivelse figuur bij de hel. (2) Prent = visueel medium. (3) De prent is anoniem gepubliceerd."}},
{nr:5,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Henrick Coenraet vertelde dat steden in Zuid-Amerika slecht verdedigd waren. Verklaar dat deze info belangrijk was vanwege: (1) het conflict met Spanje, en (2) de driehoekshandel.",patternExplain:"'Verklaar vanwege' = twee keer oorzaak-gevolg → Domino.",signals:["verklaar","vanwege"],answer:null,akb:{A:"(1) De Republiek kon de oorlog tegen Spanje uitbreiden naar Zuid-Amerika → zwak verdedigde steden aanvallen. (2) De WIC kon haar handelspositie in Zuid-Amerika verbeteren als onderdeel van de driehoekshandel.",K:"(1) Conflict met Spanje = militair belang. (2) Driehoekshandel = economisch belang (plantages, grondstoffen).",B:"Coenraet had gezien dat Rio de Janeiro en Buenos Aires slecht verdedigd waren. De info werd doorgestuurd naar de WIC."}},
{nr:6,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Eise Eisinga bouwde een planetarium en stelde het open voor publiek om bijgeloof te bestrijden. Leg uit dat dit paste bij het 'rationeel optimisme'.",patternExplain:"'Leg uit dat dit past bij rationeel optimisme' = oorzaak (kennis) → gevolg (bijgeloof bestrijden) → Domino.",signals:["paste bij"],answer:null,akb:{A:"Eisinga maakte wetenschappelijke kennis toegankelijk voor het publiek om bijgeloof (angst voor botsing met de zon) te bestrijden.",K:"Rationeel optimisme = geloof dat kennis de wereld kan verbeteren. Door het planetarium open te stellen kon iedereen zelf zien dat er geen gevaar was.",B:"In 1774 brak paniek uit door een voorspelling over een botsing met de zon. Eisinga bouwde een planetarium in zijn woonkamer om te laten zien dat dit niet zou gebeuren."}},
{nr:7,points:3,context:"vroegmoderne-tijd",type:"detective",question:"De brieven van Madame Palatine over Versailles. (1) Hoe verstevigt Lodewijk XIV zijn positie als absoluut vorst door de verplichte 'dag van het appartement', en (2) welke kritiek op het ancien régime kan hiermee onderbouwd worden (met bronverwijzing)?",patternExplain:"'Hoe verstevigt hij zijn positie' + 'welke kritiek' = je analyseert het doel + de boodschap → Detective.",signals:["verstevigt","kritiek"],answer:null,akb:{A:"(1) Door de adel te verplichten aanwezig te zijn, kan hij hen controleren/in de gaten houden/imponeren met luxe. (2) Kritiek: scheve sociale verhoudingen / geldverspilling.",K:"(1) Controle over de adel = versteviging van absolutisme. (2) In de 18e eeuw groeit de kritiek op de verspilling van het hof.",B:"(2) 'Meer dan twintig tafels' / 'karaffen en glazen en verschillende soorten wijn en likeur' / 'allerlei soorten vruchtenvlaaien, zoetigheden' → enorme luxe en verspilling."}},
{nr:8,points:2,context:"britse-rijk",type:"detective",question:"Lacour beschrijft Solitude. (1) Welke boodschap wil hij overbrengen, en (2) verklaar dit vanuit zijn achtergrond.",patternExplain:"'Welke boodschap' + 'vanuit zijn achtergrond' = je analyseert de boodschap + de partijdigheid → Detective. Let op: je moet zijn achtergrond VERKLAREN, niet alleen noemen!",signals:["boodschap","achtergrond"],answer:null,akb:{A:"(1) Lacour wil overbrengen dat opstandige slaafgemaakten wreed/onbeschaafd zijn. (2) Als familielid van plantage-eigenaren keurt hij opstand af / vreest hij geweld tegen zijn familie.",K:"(1) Solitude wordt afgeschilderd als gewelddadig en wraakzuchtig. (2) Zijn belangen als plantage-familie verklaren waarom hij de opstandelingen negatief afschildert.",B:"(1) Solitude doorboort een konijn en dreigt de Fransen: 'Zo zal ik jullie ook behandelen'. (2) Lacour is familie van plantage-eigenaren op Guadeloupe."}},
{nr:9,points:3,context:"britse-rijk",type:"domino",question:"Rotten boroughs in Engeland. (1) Verklaar de kritiek vanuit de industriële revolutie, (2) noem de wet van 1832, en (3) noem het passende KA.",patternExplain:"'Verklaar de kritiek' + 'noem de wet' + 'noem het KA' = oorzaak-gevolg + koppeling → Domino. Let op: 'emancipatiebewegingen' levert géén punt op!",signals:["verklaren","noem","kenmerkend aspect"],answer:null,akb:{A:"(1) Door de industriële revolutie groeiden steden explosief, maar hadden nog steeds te weinig vertegenwoordigers. (2) De Reform Bill (1832). (3) KA: 'de voortschrijdende democratisering'.",K:"(1) Urbanisatie → steden als Londen/Birmingham hadden te weinig parlementsleden t.o.v. lege rotten boroughs. (2) De Reform Bill hervormde de districten. (3) Meer mensen wilden politieke vertegenwoordiging.",B:"Steden drongen aan op herindeling; rotten boroughs hadden nauwelijks inwoners maar wel 2 parlementsleden."}},
{nr:10,points:3,context:"britse-rijk",type:"detective",question:"De slaveneigenaar schrijft aan The Liberator (1831). (1) Welk verlicht idee wijst hij af (met bronverwijzing), en (2) welke boodschap wil The Liberator overbrengen door deze brief te publiceren?",patternExplain:"'Welk idee wijst hij af' + 'welke boodschap wil de krant overbrengen' = twee analyses → Detective. Let op: bij deel 2 gaat het over de boodschap van de KRANT, niet de briefschrijver!",signals:["wijst af","boodschap"],answer:null,akb:{A:"(1) De schrijver wijst het idee van natuurlijke rechten af: vrijheid geldt volgens hem alleen voor vrije mensen. (2) The Liberator wil laten zien dat het doel nog niet bereikt is / dat er nog steeds mensen zijn die slavernij verdedigen → de strijd moet doorgaan.",K:"(1) Natuurlijke rechten = iedereen is vrij en gelijk geboren. De schrijver zegt dat de grondwet slaafgemaakten geen rechten geeft. (2) Door de brief te publiceren toont de krant hoe sterk het verzet tegen afschaffing nog is.",B:"(1) 'Persvrijheid kan alleen worden toegestaan waar geprobeerd wordt om de geest van vrije mensen te verlichten'. (2) De krant publiceert bewust een vijandige brief."}},
