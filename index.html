const TimelineModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledSets] = useState(() => {
    const indices = TIMELINE_SETS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [order, setOrder] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [showHints, setShowHints] = useState(false);
  const [completed, setCompleted] = useState(new Set());

  const setIndex = shuffledSets[stepIndex];
  const currentSet = TIMELINE_SETS[setIndex];

  useEffect(() => {
    const shuffled = [...currentSet.items].sort(() => Math.random() - 0.5);
    setOrder(shuffled.map((i) => i.id));
    setSubmitted(false);
    setScore(null);
    setShowHints(false);
  }, [stepIndex]);

  const handleDragStart = (idx) => setDragIdx(idx);

  const handleDrop = (targetIdx) => {
    if (dragIdx === null || dragIdx === targetIdx) return;
    const newOrder = [...order];
    const [moved] = newOrder.splice(dragIdx, 1);
    newOrder.splice(targetIdx, 0, moved);
    setOrder(newOrder);
    setDragIdx(null);
  };

  const moveItem = (idx, direction) => {
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= order.length) return;
    const newOrder = [...order];
    [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
    setOrder(newOrder);
  };

  const handleSubmit = () => {
    const correct = currentSet.correctOrder;
    let pts = 0;
    const match = order.every((id, i) => id === correct[i]);
    if (match) {
      pts = 2;
    } else {
      for (let skip = 0; skip < order.length; skip++) {
        const filtered = order.filter((_, i) => i !== skip);
        const correctFiltered = correct.filter((_, i) => i !== skip);
        if (filtered.length === correctFiltered.length && filtered.every((id, i) => id === correctFiltered[i])) {
          pts = 1;
          break;
        }
      }
    }
    setScore(pts);
    setSubmitted(true);
    if (pts > 0 && !completed.has(setIndex)) {
      onXP(pts * 5);
      setCompleted((prev) => new Set([...prev, setIndex]));
    }
  };

  const getItemById = (id) => currentSet.items.find((i) => i.id === id);

  if (showIntro) {
    return <TimelineIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 20 }}>
        {shuffledSets.map((si, i) => (
          <button
            key={TIMELINE_SETS[si].id}
            onClick={() => setStepIndex(i)}
            style={{
              padding: "5px 10px",
              border: i === stepIndex ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
              background: completed.has(si) ? MC.grassDark : i === stepIndex ? MC.bedrockLight : MC.bedrock,
              color: completed.has(si) ? MC.emerald : i === stepIndex ? MC.gold : MC.textDim,
              cursor: "pointer",
              fontSize: 11,
              fontFamily: mcFont,
              fontWeight: 700,
              boxShadow: i === stepIndex ? mcBoxShadowDark : "none",
            }}
          >
            {completed.has(si) ? "✓ " : ""}{TIMELINE_SETS[si].exam.replace("Tijdvak", "T")}
          </button>
        ))}
      </div>

      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 16, marginBottom: 16, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 4, fontFamily: mcFont, letterSpacing: 1 }}>
          ⛏️ {currentSet.exam}
        </div>
        <div style={{ fontSize: 17, fontWeight: 700, color: MC.text, marginBottom: 4, fontFamily: mcFont }}>
          {currentSet.theme}
        </div>
        <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont }}>
          Sleep de gebeurtenissen in de juiste volgorde (oud → nieuw), of gebruik de pijltjes.
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 16 }}>
        {order.map((id, idx) => {
          const item = getItemById(id);
          const isCorrect = submitted && currentSet.correctOrder[idx] === id;
          const isWrong = submitted && currentSet.correctOrder[idx] !== id;

          return (
            <div
              key={id}
              draggable={!submitted}
              onDragStart={() => handleDragStart(idx)}
              onDragOver={(e) => e.preventDefault()}
              onDrop={() => handleDrop(idx)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                padding: "10px 12px",
                background: isCorrect ? "#2d5a1e" : isWrong ? "#5a1e1e" : MC.bedrock,
                border: isCorrect ? `2px solid ${MC.emerald}` : isWrong ? `2px solid ${MC.redstone}` : dragIdx === idx ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                cursor: submitted ? "default" : "grab",
                transition: "all 0.15s",
                boxShadow: dragIdx === idx ? `0 0 8px ${MC.gold}44` : "none",
              }}
            >
              <div style={{
                width: 28, height: 28,
                background: isCorrect ? MC.emerald : isWrong ? MC.redstone : MC.cobble,
                border: `2px solid ${isCorrect ? "#0a8a3a" : isWrong ? "#aa0000" : MC.stoneDark}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 13, fontWeight: 900, color: MC.white, flexShrink: 0,
                fontFamily: mcFont,
              }}>
                {idx + 1}
              </div>

              <div style={{ flex: 1, fontSize: 13, color: MC.text, lineHeight: 1.4, fontFamily: mcFont }}>
                {item.text}
                {submitted && (
                  <span style={{ color: MC.diamond, fontSize: 11, marginLeft: 8, fontWeight: 700 }}>
                    ({item.period})
                  </span>
                )}
              </div>

              {!submitted && (
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  <button onClick={() => moveItem(idx, -1)} style={{
                    width: 26, height: 22, border: `2px solid ${MC.stoneDark}`,
                    background: idx === 0 ? MC.bedrock : MC.cobble, color: idx === 0 ? MC.stoneDark : MC.white,
                    cursor: idx === 0 ? "default" : "pointer", fontSize: 11, fontFamily: mcFont, fontWeight: 900,
                  }}>▲</button>
                  <button onClick={() => moveItem(idx, 1)} style={{
                    width: 26, height: 22, border: `2px solid ${MC.stoneDark}`,
                    background: idx === order.length - 1 ? MC.bedrock : MC.cobble,
                    color: idx === order.length - 1 ? MC.stoneDark : MC.white,
                    cursor: idx === order.length - 1 ? "default" : "pointer", fontSize: 11, fontFamily: mcFont, fontWeight: 900,
                  }}>▼</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {!submitted ? (
          <>
            <button onClick={handleSubmit} style={{
              padding: "10px 24px", border: `3px solid ${MC.grassDark}`,
              background: `linear-gradient(180deg, ${MC.grassBright} 0%, ${MC.grass} 50%, ${MC.grassDark} 100%)`,
              color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
              boxShadow: `inset 2px 2px 0 ${MC.grassBright}88, inset -2px -2px 0 ${MC.grassDark}`,
              letterSpacing: 1, textShadow: `2px 2px 0 ${MC.grassDark}`,
            }}>
              ✓ CONTROLEER
            </button>
            <button onClick={() => setShowHints(!showHints)} style={{
              padding: "10px 16px", border: `2px solid ${MC.goldDark}`,
              background: MC.bedrockLight, color: MC.gold, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
            }}>
              {showHints ? "Verberg hints" : "💡 Hints"}
            </button>
          </>
        ) : (
          <div style={{
            padding: 16, width: "100%",
            background: score === 2 ? "#1a2e28" : score === 1 ? "#2a2a28" : "#2a2232",
            border: `3px solid ${score === 2 ? MC.emerald : score === 1 ? MC.gold : MC.redstone}`,
          }}>
            <div style={{ fontSize: 18, fontWeight: 900, fontFamily: mcFont, color: score === 2 ? MC.emerald : score === 1 ? MC.gold : MC.redstone }}>
              {score === 2 ? "⭐ PERFECT! 2/2 punten" : score === 1 ? "👍 BIJNA! 1/2 punten" : "💀 HELAAS, 0/2 punten"}
            </div>
            <div style={{ fontSize: 12, color: MC.textDim, marginTop: 6, fontFamily: mcFont }}>
              Juiste volgorde: {currentSet.correctOrder.join(", ")}
            </div>
            <button onClick={() => {
              setStepIndex((prev) => (prev + 1) % shuffledSets.length);
            }} style={{
              marginTop: 12, padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
              background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
              textShadow: `1px 1px 0 ${MC.grassDark}`,
            }}>
              Volgende set →
            </button>
          </div>
        )}
      </div>

      {showHints && !submitted && (
        <div style={{
          marginTop: 16, padding: 16,
          background: MC.bedrockLight, border: `2px solid ${MC.goldDark}`,
        }}>
          <div style={{ fontSize: 14, fontWeight: 900, color: MC.gold, marginBottom: 8, fontFamily: mcFont }}>💡 ANKERPUNTEN</div>
          <div style={{ fontSize: 12, color: MC.textDim, lineHeight: 1.8, fontFamily: mcFont }}>
            🇬🇧 1620 Pilgrim Fathers • 1807 Verbod slavenhandel • 1833 Abolition Act • 1851 Wereldtentoonstelling • 1857 Indiase Opstand • 1885 Indian National Congress
            <br />
            🇩🇪 1919 Versailles • 1933 Hitler Rijkskanselier • 1939 Inval Polen • 1948 Blokkade Berlijn • 1961 Bouw Muur • 1989 Val Muur
            <br />
            🇳🇱 1949 Onafhankelijkheid Indonesië • 1973 Oliecrisis • 1995 Srebrenica • 2002 Moord Fortuyn
          </div>
        </div>
      )}
    </div>
  );
};

const PatternIntro = ({ onFinish }) => {
  const [started, setStarted] = useState(false);
  const [visibleCount, setVisibleCount] = useState(0);
  const [expandedIdx, setExpandedIdx] = useState(null);
  const [allDone, setAllDone] = useState(false);
  const scrollRef = useRef(null);

  const startAnimation = () => {
    setStarted(true);
    setVisibleCount(1);
    setExpandedIdx(0);
  };

  const showNext = () => {
    if (visibleCount < PATTERN_INTRO_DATA.length) {
      const next = visibleCount;
      setVisibleCount(next + 1);
      setExpandedIdx(next);
    } else if (!allDone) {
      setAllDone(true);
    }
  };

  const skipToEnd = () => {
    setVisibleCount(PATTERN_INTRO_DATA.length);
    setExpandedIdx(null);
    setAllDone(true);
  };

  useEffect(() => {
    if (scrollRef.current && visibleCount > 0) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [visibleCount, expandedIdx, allDone]);

  if (!started && visibleCount === 0) {
    return (
      <div style={{ textAlign: "center", padding: "40px 20px" }}>
        <div style={{ fontSize: 64, marginBottom: 16, lineHeight: 1 }}>🎯</div>
        <div style={{
          fontSize: 22, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
          textShadow: `2px 2px 0 ${MC.goldDark}`, letterSpacing: 2, marginBottom: 8,
        }}>

const PatternModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledOrder] = useState(() => {
    const indices = PATTERN_QUESTIONS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [completed, setCompleted] = useState(new Set());

  const qIndex = shuffledOrder[stepIndex];
  const q = PATTERN_QUESTIONS[qIndex];
  const isCorrect = selected === q.correctPattern;

  const handleSubmit = () => {
    setSubmitted(true);
    if (isCorrect && !completed.has(qIndex)) {
      onXP(5);
      setCompleted((prev) => new Set([...prev, qIndex]));
    }
  };

  const next = () => {
    setStepIndex((prev) => (prev + 1) % shuffledOrder.length);
    setSelected(null);
    setSubmitted(false);
  };

  if (showIntro) {
    return <PatternIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, alignItems: "center" }}>
        <div style={{ fontSize: 13, color: MC.textDark, fontFamily: mcFont }}>
          Vraag {stepIndex + 1} / {PATTERN_QUESTIONS.length}
        </div>
        <div style={{ fontSize: 13, color: MC.emerald, fontFamily: mcFont, fontWeight: 700 }}>
          ✓ {completed.size} goed
        </div>
      </div>

      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 20, marginBottom: 20, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 8, fontFamily: mcFont, letterSpacing: 1 }}>
          📜 {q.exam}
        </div>
        <div style={{ fontSize: 15, color: MC.text, lineHeight: 1.6, marginBottom: 12, fontFamily: mcFont }}>
          "{q.question}"
        </div>
        <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont }}>
          Welk vraagpatroon is dit? Klik op het juiste type.
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 20 }}>
        {PATTERN_TYPES.map((p) => {
          const isThis = selected === p.id;
          const showCorrect = submitted && p.id === q.correctPattern;
          const showWrong = submitted && isThis && !isCorrect;

          return (
            <button
              key={p.id}
              onClick={() => !submitted && setSelected(p.id)}
              style={{
                padding: "12px 8px",
                border: showCorrect ? `3px solid ${MC.emerald}` : showWrong ? `3px solid ${MC.redstone}` : isThis ? `3px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                background: showCorrect ? "#1a2e28" : showWrong ? "#2a2232" : isThis ? MC.bedrockLight : MC.bedrock,
                color: showCorrect ? MC.emerald : showWrong ? MC.redstone : isThis ? MC.gold : MC.textDim,
                cursor: submitted ? "default" : "pointer",
                fontSize: 13,
                fontWeight: 700,
                fontFamily: mcFont,
                textAlign: "center",
                transition: "all 0.1s",
              }}
            >
              <div style={{ fontSize: 20, marginBottom: 2 }}>{p.emoji}</div>
              {p.name}
            </button>
          );
        })}
      </div>

      {!submitted ? (
        <button onClick={handleSubmit} disabled={!selected} style={{
          padding: "10px 24px", border: selected ? `3px solid ${MC.grassDark}` : `2px solid ${MC.stoneDark}`,
          background: selected ? `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})` : MC.cobble,
          color: selected ? MC.white : MC.stoneDark,
          fontSize: 15, fontWeight: 900, cursor: selected ? "pointer" : "default", fontFamily: mcFont,
          textShadow: selected ? `2px 2px 0 ${MC.grassDark}` : "none", letterSpacing: 1,
        }}>
          ✓ CONTROLEER
        </button>
      ) : (
        <div style={{
          padding: 16,
          background: isCorrect ? "#1a2e28" : "#2a2232",
          border: `3px solid ${isCorrect ? MC.emerald : MC.redstone}`,
        }}>
          <div style={{ fontSize: 16, fontWeight: 900, color: isCorrect ? MC.emerald : MC.redstone, marginBottom: 8, fontFamily: mcFont }}>
            {isCorrect ? "⭐ GOED! " : "💀 NIET HELEMAAL. "}
            Het is: {PATTERN_TYPES.find((p) => p.id === q.correctPattern)?.emoji}{" "}
            {PATTERN_TYPES.find((p) => p.id === q.correctPattern)?.name}
          </div>
          <div style={{ fontSize: 13, color: MC.text, lineHeight: 1.6, marginBottom: 10, fontFamily: mcFont }}>
            {q.explanation}
          </div>
          <div style={{ fontSize: 12, color: MC.textDim, marginBottom: 12, fontFamily: mcFont }}>
            <strong style={{ color: MC.gold }}>Signaalwoorden:</strong>{" "}
            {q.signals.map((s, i) => (
              <span key={i} style={{
                background: "#2a2a28", color: MC.gold, padding: "2px 6px",
                border: `1px solid ${MC.goldDark}`, marginRight: 4, fontSize: 11,
                fontFamily: mcFont, fontWeight: 700,
              }}>
                {s}
              </span>
            ))}
          </div>
          <button onClick={next} style={{
            padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
            background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
            textShadow: `1px 1px 0 ${MC.grassDark}`,
          }}>
            Volgende vraag →
          </button>
        </div>
      )}
    </div>
  );
};

                { letter: "B", text: p.B, color: MC.gold },
              ].map((s, j) => (
                <div key={j} style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
                  <span style={{ fontSize: 13, fontWeight: 900, color: s.color, fontFamily: mcFont, minWidth: 16 }}>{s.letter}</span>
                  <span style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont, lineHeight: 1.5 }}>{s.text}</span>
                </div>
              ))}
            </div>

        ))}
      </div>
    ),

    // PAGE 2: Echt voorbeeld + cockpit-tips
    () => (
      <div>
        <div style={{
          fontSize: 18, fontWeight: 900, color: MC.diamond, fontFamily: mcFont,
          textAlign: "center", marginBottom: 16, letterSpacing: 1,
        }}>
          📝 ZO ZIET EEN VOLLEDIG ANTWOORD ERUIT
        </div>

        {/* Example */}
        <div style={{ padding: 14, background: "#1e2438", border: `2px solid ${MC.diamond}`, marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: MC.textDim, fontFamily: mcFont, fontStyle: "italic", marginBottom: 10 }}>
            Examen 2024: "Geef aan welke kritiek Million weergeeft op de werkwijze van de Europese Unie."
          </div>
          {[
            { letter: "A", color: MC.emerald, text: "De kritiek is dat de Europese Unie wel praat, maar niet ingrijpt." },
            { letter: "B", color: MC.gold, text: "Dit zie je in de prent: de leiders praten rustig over 'kogelzakken' terwijl er op de achtergrond mensen worden doodgeschoten." },
            { letter: "K", color: MC.diamond, text: "(Hier niet nodig, maar: het onvermogen van de EU om in te grijpen.)" },
          ].map((s, i) => (
            <div key={i} style={{
              display: "flex", gap: 10, alignItems: "baseline", marginBottom: 6,
            }}>
              <div style={{
                minWidth: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center",
                background: s.color, color: MC.bedrock, fontSize: 14, fontWeight: 900, fontFamily: mcFont,
              }}>
                {s.letter}
              </div>
              <div style={{ fontSize: 14, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
                {s.text}

            </div>
          ))}
        </div>

        {/* Cockpit tips removed - now on main screen */}

        {/* Final ready box */}
        <div style={{
          marginTop: 16, padding: 16, textAlign: "center",
          background: "#1a2e28", border: `2px solid ${MC.emerald}`,
        }}>
          <div style={{ fontSize: 16, fontWeight: 900, color: MC.emerald, fontFamily: mcFont, marginBottom: 6 }}>
            💡 IN DE OEFENINGEN HIERNA...
          </div>
          <div style={{ fontSize: 14, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
            Krijg je een echte examenvraag. Eerst herken je het <strong style={{ color: MC.gold }}>patroon</strong>, daarna kies je voor elke stap (<strong style={{ color: MC.emerald }}>A</strong>, <strong style={{ color: MC.diamond }}>K</strong>, <strong style={{ color: MC.gold }}>B</strong>) het beste antwoord.

  const totalPages = pages.length;

  return (
    <div>
      {/* Page counter */}
      <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 16 }}>
        {pages.map((_, i) => (
          <div key={i} style={{
            width: i === page ? 24 : 10, height: 10,
            background: i === page ? "#7a8abf" : MC.stoneDark,
            transition: "all 0.3s ease",
          }} />

      </div>

      {/* Content */}
      <div ref={scrollRef} style={{ maxHeight: 500, overflowY: "auto", scrollBehavior: "smooth" }}>
        {pages[page]()}
      </div>

      {/* Navigation */}
      <div style={{ display: "flex", justifyContent: "center", gap: 12, marginTop: 20 }}>
        {page > 0 && (
          <button onClick={() => setPage(page - 1)} style={{
            padding: "8px 20px", border: `2px solid ${MC.stoneDark}`,
            background: MC.bedrock, color: MC.textDim,
            fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
          }}>
            ← TERUG
          </button>
        )}
        {page < totalPages - 1 ? (
          <button onClick={() => setPage(page + 1)} style={{
            padding: "10px 28px", border: `3px solid #4a5a8a`,
            background: "linear-gradient(180deg, #7a8abf, #5a6a9a, #4a5a8a)",
            color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
            textShadow: "1px 1px 0 #4a5a8a", letterSpacing: 1,
            boxShadow: "inset 2px 2px 0 #7a8abf88, inset -2px -2px 0 #4a5a8a",
          }}>
            VOLGENDE →
          </button>
        ) : (
          <button onClick={onFinish} style={{
            padding: "12px 32px", border: `3px solid ${MC.grassDark}`,
            background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`,
            color: MC.white, fontSize: 16, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
            textShadow: `2px 2px 0 ${MC.grassDark}`, letterSpacing: 1,
            boxShadow: `inset 2px 2px 0 ${MC.grassBright}88, inset -2px -2px 0 ${MC.grassDark}`,
          }}>
            START MET OEFENEN →
          </button>
        )}
      </div>

      {/* Skip */}
      {page < totalPages - 1 && (
        <div style={{ textAlign: "center", marginTop: 12 }}>
          <button onClick={onFinish} style={{
            background: "none", border: "none", color: MC.textDark,
            fontSize: 12, cursor: "pointer", fontFamily: mcFont,
          }}>
            Overslaan →
          </button>
        </div>
      )}
    </div>
  );
};

const AKBModule = ({ onXP }) => {
  const [showIntro, setShowIntro] = useState(true);
  const [shuffledOrder] = useState(() => {
    const indices = AKB_QUESTIONS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
  const [stepIndex, setStepIndex] = useState(0);
  const [step, setStep] = useState(0); // 0=pattern, 1=A, 2=K, 3=B, 4=result
  const [patternGuess, setPatternGuess] = useState(null);
  const [answers, setAnswers] = useState({ A: null, K: null, B: null });
  const [completed, setCompleted] = useState(new Set());

  const qIndex = shuffledOrder[stepIndex];
  const q = AKB_QUESTIONS[qIndex];
  const steps = ["pattern", "A", "K", "B", "result"];
  const currentStep = steps[step];
  const patternInfo = PATTERN_TYPES.find((p) => p.id === q.pattern);

  const [patternSubmitted, setPatternSubmitted] = useState(false);

  const handlePatternSelect = (id) => {
    if (!patternSubmitted) setPatternGuess(id);
  };

  const handlePatternConfirm = () => {
    setPatternSubmitted(true);
  };

  const handlePatternContinue = () => {
    setStep(1);
  };

  const handleAnswerSelect = (key, idx) => {
    setAnswers((prev) => ({ ...prev, [key]: idx }));
    if (key === "B") {
      setTimeout(() => setStep(4), 400);
      const allCorrect = answers.A === q.steps.A.correct && answers.K === q.steps.K.correct && idx === q.steps.B.correct;
      if (allCorrect && !completed.has(qIndex)) {
        onXP(10);
        setCompleted((prev) => new Set([...prev, qIndex]));
      }
    } else {
      setTimeout(() => setStep((s) => s + 1), 400);
    }
  };

  const next = () => {
    setStepIndex((prev) => (prev + 1) % shuffledOrder.length);
    setStep(0);
    setPatternGuess(null);
    setPatternSubmitted(false);
    setAnswers({ A: null, K: null, B: null });
  };

  const getScore = () => {
    let s = 0;
    if (answers.A === q.steps.A.correct) s++;
    if (answers.K === q.steps.K.correct) s++;
    if (answers.B === q.steps.B.correct) s++;
    return s;
  };

  const stepLabels = [
    { label: "Patroon", icon: "🔍" },
    { label: "A", icon: "💬" },
    { label: "K", icon: "🔗" },
    { label: "B", icon: "📄" },
    { label: "Score", icon: "⭐" },
  ];

  if (showIntro) {
    return <AKBIntro onFinish={() => setShowIntro(false)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, alignItems: "center" }}>
        <div style={{ fontSize: 13, color: MC.textDark, fontFamily: mcFont }}>
          Oefening {stepIndex + 1} / {AKB_QUESTIONS.length}
        </div>
        <div style={{ fontSize: 13, color: MC.emerald, fontFamily: mcFont, fontWeight: 700 }}>
          ✓ {completed.size} afgerond
        </div>
      </div>

      {/* Progress steps */}
      <div style={{ display: "flex", gap: 4, marginBottom: 20 }}>
        {stepLabels.map((s, i) => (
          <div key={i} style={{
            flex: 1, padding: "8px 4px", textAlign: "center",
            background: i === step ? MC.bedrockLight : i < step ? "#1a2e28" : MC.bedrock,
            border: i === step ? `2px solid ${MC.gold}` : i < step ? `2px solid ${MC.emerald}44` : `2px solid ${MC.stoneDark}`,
            fontSize: 12, color: i === step ? MC.gold : i < step ? MC.emerald : MC.textDark, fontFamily: mcFont, fontWeight: 700,
          }}>
            {s.icon} {s.label}
          </div>
        ))}
      </div>

      {/* Question context */}
      <div style={{ background: MC.bedrockLight, border: mcBorder, padding: 20, marginBottom: 16, boxShadow: mcBoxShadowDark }}>
        <div style={{ fontSize: 12, color: MC.gold, fontWeight: 700, marginBottom: 6, fontFamily: mcFont, letterSpacing: 1 }}>{q.exam}</div>
        <div style={{ fontSize: 15, color: MC.text, lineHeight: 1.6, marginBottom: 8, fontFamily: mcFont }}>"{q.question}"</div>
        <div style={{ fontSize: 13, color: MC.textDim, fontStyle: "italic", fontFamily: mcFont }}>📎 {q.context}</div>
      </div>

      {/* Step: Pattern recognition */}
      {currentStep === "pattern" && (
        <div>
          <div style={{ fontSize: 14, color: MC.text, marginBottom: 12, fontFamily: mcFont }}>Stap 1: Welk vraagpatroon is dit?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            {PATTERN_TYPES.map((p) => {
              const isSelected = patternGuess === p.id;
              const showCorrect = patternSubmitted && p.id === q.pattern;
              const showWrong = patternSubmitted && isSelected && p.id !== q.pattern;
              return (
                <button
                  key={p.id}
                  onClick={() => handlePatternSelect(p.id)}
                  style={{
                    padding: "12px", 
                    border: showCorrect ? `3px solid ${MC.emerald}` : showWrong ? `3px solid ${MC.redstone}` : isSelected ? `2px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                    background: showCorrect ? "#1a2e28" : showWrong ? "#2a2232" : isSelected ? MC.bedrockLight : MC.bedrock,
                    color: showCorrect ? MC.emerald : showWrong ? MC.redstone : isSelected ? MC.gold : MC.textDim,
                    cursor: patternSubmitted ? "default" : "pointer", fontSize: 13, fontFamily: mcFont, fontWeight: 700, textAlign: "center",
                  }}
                >
                  {p.emoji} {p.name}
                </button>
              );
            })}
          </div>
          
          {/* Before submit: show confirm button */}
          {patternGuess && !patternSubmitted && (
            <button onClick={handlePatternConfirm} style={{
              marginTop: 12, padding: "10px 24px", border: `3px solid ${MC.grassDark}`,
              background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`,
              color: MC.white, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: mcFont,
              textShadow: `2px 2px 0 ${MC.grassDark}`, letterSpacing: 1,
            }}>
              ✓ BEVESTIG
            </button>
          )}

          {/* After submit: show feedback */}
          {patternSubmitted && (
            <div style={{
              marginTop: 12, padding: 16,
              background: patternGuess === q.pattern ? "#1a2e28" : "#2a2820",
              border: `3px solid ${patternGuess === q.pattern ? MC.emerald : MC.gold}`,
            }}>
              {patternGuess === q.pattern ? (
                <div style={{ fontSize: 14, fontWeight: 900, color: MC.emerald, fontFamily: mcFont }}>
                  ⭐ GOED! Dit is inderdaad {patternInfo?.emoji} {patternInfo?.name}.
                </div>
              ) : (
                <div>
                  <div style={{ fontSize: 14, fontWeight: 900, color: MC.redstone, fontFamily: mcFont, marginBottom: 6 }}>
                    ✘ Niet helemaal — dit is eigenlijk {patternInfo?.emoji} {patternInfo?.name}.
                  </div>
                </div>
              )}
              <div style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.6, marginTop: 8 }}>
                {q.patternTip}
              </div>
              {q.signals && (
                <div style={{ marginTop: 8, fontSize: 12, color: MC.textDim, fontFamily: mcFont }}>
                  <strong style={{ color: MC.gold }}>Signaalwoorden:</strong>{" "}
                  {q.signals.map((s, i) => (
                    <span key={i} style={{
                      background: "#2a2a28", color: MC.gold, padding: "2px 6px",
                      border: `1px solid ${MC.goldDark}`, marginRight: 4, fontSize: 11,
                      fontFamily: mcFont, fontWeight: 700, display: "inline-block", marginTop: 4,
                    }}>
                      {s}
                    </span>
                  ))}
                </div>
              )}
              <button onClick={handlePatternContinue} style={{
                marginTop: 12, padding: "8px 20px", border: `2px solid ${MC.grassDark}`,
                background: MC.grass, color: MC.white, fontSize: 14, cursor: "pointer", fontFamily: mcFont, fontWeight: 700,
                textShadow: `1px 1px 0 ${MC.grassDark}`,
              }}>
                Verder met de vraag →
              </button>
            </div>
          )}
        </div>
      )}

      {/* Steps: A, K, B */}
      {(currentStep === "A" || currentStep === "K" || currentStep === "B") && (
        <div>
          <div style={{
            fontSize: 14, fontWeight: 600, marginBottom: 12,
            color: currentStep === "A" ? MC.diamond : currentStep === "K" ? MC.gold : MC.emerald,
          }}>
            Stap {step + 1}: {currentStep === "A" ? "A = Antwoord" : currentStep === "K" ? "K = Koppeling" : "B = Bewijs"}
          </div>
          <div style={{ fontSize: 14, color: MC.text, marginBottom: 12, fontFamily: mcFont }}>
            {q.steps[currentStep].prompt}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {q.steps[currentStep].options.map((opt, i) => {
              const isSelected = answers[currentStep] === i;
              return (
                <button
                  key={i}
                  onClick={() => handleAnswerSelect(currentStep, i)}
                  style={{
                    padding: "12px 16px",  textAlign: "left",
                    border: isSelected ? `3px solid ${MC.gold}` : `2px solid ${MC.stoneDark}`,
                    background: isSelected ? MC.bedrockLight : MC.bedrock,
                    color: MC.text, cursor: "pointer", fontSize: 13,
                    fontFamily: mcFont, lineHeight: 1.5, fontWeight: 500,
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Step: Result */}
      {currentStep === "result" && (
        <div>
          <div style={{
            padding: 20,  marginBottom: 16,
            background: getScore() === 3 ? "#1a2e28" : getScore() >= 1 ? "#2a2a28" : "#2a2232",
            border: `3px solid ${getScore() === 3 ? MC.emerald : getScore() >= 1 ? MC.gold : MC.redstone}`,
          }}>
            <div style={{
              fontSize: 20, fontWeight: 700, marginBottom: 12,
              color: getScore() === 3 ? MC.emerald : getScore() >= 1 ? MC.gold : MC.redstone,
            }}>
              {getScore() === 3 ? "⭐ PERFECT! 3/3" : getScore() === 2 ? "👍 GOED! 2/3" : getScore() === 1 ? "🤔 1/3" : "💀 0/3"}
            </div>

            {["A", "K", "B"].map((key) => {
              const correct = answers[key] === q.steps[key].correct;
              return (
                <div key={key} style={{
                  padding: "10px 14px",  marginBottom: 8,
                  background: correct ? "#1a2e28" : "#2a2232",
                  border: `2px solid ${correct ? MC.emerald + "66" : MC.redstone + "66"}`,
                }}>
                  <div style={{ fontSize: 12, fontWeight: 900, color: correct ? MC.emerald : MC.redstone, marginBottom: 4, fontFamily: mcFont }}>
                    {correct ? "✓" : "✗"} {key === "A" ? "Antwoord" : key === "K" ? "Koppeling" : "Bewijs"}
                  </div>
                  <div style={{ fontSize: 12, color: MC.text, fontFamily: mcFont }}>
                    {correct ? q.steps[key].options[q.steps[key].correct] : (
                      <>
                        <span style={{ textDecoration: "line-through", color: MC.redstone + "88" }}>
                          {q.steps[key].options[answers[key]]}
                        </span>
                        <br />
                        <span style={{ color: MC.emerald }}>→ {q.steps[key].options[q.steps[key].correct]}</span>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{
            padding: 16,  background: MC.bedrockLight,
            border: `2px solid ${MC.goldDark}`, marginBottom: 16,
          }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: MC.gold, marginBottom: 8, fontFamily: mcFont }}>📝 Modelantwoord</div>
            <div style={{ fontSize: 13, color: MC.text, lineHeight: 1.7, fontFamily: mcFont }}>{q.modelAnswer}</div>
          </div>

          <button onClick={next} style={{
            padding: "10px 24px",  border: "none",
            background: `linear-gradient(180deg, ${MC.grassBright}, ${MC.grass}, ${MC.grassDark})`, color: MC.white,
            fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
          }}>
            Volgende oefening →
          </button>
        </div>
      )}
    </div>
  );
};

r:16,points:4,context:"duitsland",type:"detective",question:"Verklaar het verbod op Von Papens toespraak door twee kenmerken van het NS te noemen en bij elk de kritiek van Von Papen.",patternExplain:"'Welke kritiek geeft Von Papen' = mening/kritiek van de maker → Detective. Twee kenmerken!",signals:["welke kritiek","kenmerken","verklaar dit verbod"],answer:null,akb:{A:"(1) NS is antisemitisch/vervolgt groepen. (2) NS is antidemocratisch.",K:"(1) Von Papen keurt bedreigen van hulpeloze groepen af. (2) Wil dat het volk invloed heeft.",B:"(1) 'Niet door het bedreigen van hulpeloze bevolkingsgroepen'. (2) 'Mits men het volk invloed geeft op de besluitvorming'."}},{nr:17,points:2,context:"duitsland",type:"domino",question:"Leg uit dat het voor Von Papen na 1945 noodzakelijk werd om de nadruk te leggen op zijn toespraak in Marburg.",patternExplain:"'Waardoor werd het noodzakelijk' = oorzaak → gevolg → Domino.",signals:["leg uit","noodzakelijk werd"],answer:null,akb:{A:"Na 1945 werden nazi-kopstukken vervolgd door de geallieerden.",K:"Von Papen moest bewijzen dat hij kritisch was geweest om veroordeling te voorkomen.",B:"De toespraak was zijn bewijs dat hij al in 1934 kritiek had geuit."}},{nr:18,points:3,context:"duitsland",type:"detective",question:"Geef aan: (1) het politiek doel van de inzamelactie, (2) hoe de foto dit ondersteunt, en (3) welke boodschap de geallieerden ermee kunnen overbrengen.",patternExplain:"'Welk doel' + 'welke boodschap' = intentie/doel achter de actie → Detective. Drie delen!",signals:["welk doel","kan ondersteunen","welke boodschap"],answer:null,akb:{A:"(1) Volksgemeinschaft versterken. (2) Foto toont saamhorigheid. (3) Geallieerden: Duitsland kan troepen niet bevoorraden.",K:"(1) Solidariteit tonen. (2) Hitlerjugend + burgers werken samen. (3) Kleding inzamelen = zwakte.",B:"(1+2) Jongens van Hitlerjugend laden pakketten. (3) 'Inzameling winterkleding voor het front'."}},{nr:19,points:4,context:"duitsland",type:"detective",question:"Ondersteun het ondersteunde de Ostpolitik, (3) de DDR deed zelf geen onderzoek.",patternExplain:"Drie keer oorzaak-gevolg → Domino. Drie delen!",signals:["verklaren","vergemakkelijkte","reden"],answer:null,akb:{A:"(1) Détente versoepelde bezoekrechten. (2) BRD wilde toenadering. (3) DDR vreesde kritiek.",K:"(1) Meer bezoeken → meer gegevens. (2) Beter beeld → betere toenadering. (3) Dictatuur duldt geen openbare kritiek.",B:"(1) West-Duitsers mochten DDR bezoeken. (2) Gegevens dienden Ostpolitik. (3) DDR was totalitair regime."}},{nr:23,points:3,context:"nederland",type:"detective",question:"Toon aan: (1) welke maatschappelijke verandering de confessionelen moeten meenemen en (2) welke mening Behrendt weergeeft, met bronverwijzing.",patternExplain:"'Welke mening geeft Behrendt weer' = boodschap/kritiek van de tekenaar → Detective.",signals:["welke mening","weergeeft"],answer:null,akb:{A:"(1) Ontkerkelijking/ontzuiling. (2) Behrendt: ze doen hipper dan ze zijn.",K:"Partijen proberen jongeren aan te spreken, maar het is niet overtuigend.",B:"Afgebeeld als onwennige rockband 'The Hallelujah boys' met 'Is het zo hip genoeg?'."}},{nr:24,points:4,context:"duitsland",type:"matchmaker",question:"Leg uit: (1) welk Europees verdrag Kohl ondersteunt en (2) dat zijn uitspraak past bij de rol van het herenigde Duitsland, telkens met bronverwijzing.",patternExplain:"'Welk verdrag past hierbij' + 'bij welke rol' = koppelen aan begrippen → Matchmaker.",signals:["welk verdrag","past bij"],answer:null,akb:{A:"(1) Verdrag van Maastricht (oprichting EU). (2) Duitsland neemt leidende rol in Europa.",K:"(1) Verdrag voorziet in politieke en economische unie. (2) Herenigde Duitsland wil actief bijdragen.",B:"(1) 'Terugvallen in nationale rivaliteit'. (2) 'Niet apathisch afwachten'."}},{nr:25,points:2,context:"nederland",type:"matchmaker",question:"Geef per gegeven over de 'meisjes van Verkade' de ontwikkeling aan die het best past.",patternExplain:"Per gegeven een passende ontwikkeling koppelen = koppelvraag → Matchmaker.",signals:["het best bij past"],answer:"1-b, 2-d, 3-c, 4-a",akb:null}]};

{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen over gezonken schepen in de juiste chronologische volgorde, van vroeger naar later.",patternExplain:"Zes gebeurtenissen in volgorde zetten = Tijdlijn-Bouwer. Geen AKB nodig, gebruik je ankerpunten: Columbus (1492), EIC (begin 17e eeuw), WIC (18e eeuw), WO1 (1917), atoombom (1946), Gorbatsjov (1989).",signals:["chronologische volgorde","van vroeger naar later"],answer:"5, 6, 1, 4, 2, 3",akb:null},
{nr:2,points:4,context:"vroegmoderne-tijd",type:"matchmaker",question:"Bewering: Palladio's werkwijze past bij de Renaissancetijd. Geef twee argumenten, telkens ondersteund met een verschillend kenmerkend aspect.",patternExplain:"'Past bij' + 'kenmerkend aspect' = je koppelt twee werkwijzen aan twee KA's → Matchmaker. Let op: twee argumenten met elk een ander KA!",signals:["past bij","kenmerkend aspect"],answer:null,akb:{A:"(1) Palladio laat zich inspireren door de klassieke Oudheid. (2) Hij doet nauwkeurige metingen en onderzoek.",K:"(1) Past bij 'de hernieuwde oriëntatie op het erfgoed van de klassieke Oudheid'. (2) Past bij 'het begin van een nieuwe wetenschappelijke belangstelling'.",B:"(1) Hij maakt schetsen van Romeinse zuilen en gebouwen. (2) Hij neemt precieze afmetingen en verhoudingen op."}},
{nr:3,points:3,context:"vroegmoderne-tijd",type:"matchmaker",question:"Noem bij elk van de drie gegevens uit het leven van Wingfield een verschillend kenmerkend aspect uit de zestiende eeuw.",patternExplain:"'Noem bij elk gegeven een kenmerkend aspect' = drie keer koppelen aan een KA → Matchmaker. Let op: elk KA mag maar één keer!",signals:["kenmerkend aspect"],answer:null,akb:{A:"(1) Anglicaans geloof = reformatie. (2) Dienst bij de Republiek = conflict in de Nederlanden. (3) Kolonie stichten = overzeese expansie.",K:"(1) 'De protestantse reformatie die splitsing van de christelijke kerk tot gevolg had'. (2) 'Het conflict in de Nederlanden dat resulteerde in de stichting van een Nederlandse staat'. (3) 'Het begin van de Europese overzeese expansie'.",B:"(1) Henry VIII brak met de paus → anglicaans geloof. (2) Wingfield vocht bij Bergen op Zoom tegen Spanje. (3) Wingfield vertrok naar Amerika."}},
{nr:4,points:3,context:"britse-rijk",type:"detective",question:"Je kiest de brief van John Smith als bron voor onderzoek naar het afzetten van Wingfield. Ondersteun: welke verklaring ontleen je aan de brief, en waarom is de bron betrouwbaar?",patternExplain:"'Welke verklaring' + 'betrouwbaar door de aard van de bron' = je analyseert inhoud én betrouwbaarheid → Detective.",signals:["verklaring","betrouwbaar"],answer:null,akb:{A:"Wingfield werd afgezet omdat hij te hard optrad en voorraden achterhield voor zichzelf en zijn vertrouwelingen.",K:"De bron is betrouwbaar omdat het een persoonlijke brief aan een vriend is — Smith heeft geen reden om de situatie mooier of erger voor te stellen.",B:"Smith schrijft: 'het harde optreden van de president' en 'voorraden werden door de president voor zichzelf en zijn vertrouwelingen gehouden'."}},
{nr:5,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Verklaar waarom het bestuur van de Republiek aanvallen op Portugees-Spaanse gebieden aanmoedigde: welke handel moest in Nederlandse handen komen, en hoe ondersteunde dit de stichting van een Nederlandse staat?",patternExplain:"'Verklaar de aanmoediging' = twee keer oorzaak-gevolg: (1) welke handel → (2) hoe hielp dit tegen Spanje → Domino.",signals:["verklaar","welke handel","moesten ondersteunen"],answer:null,akb:{A:"(1) De handel in slaafgemaakten / trans-Atlantische driehoekshandel moest in Nederlandse handen komen.",K:"(2) Door verovering van Spaans-Portugese gebieden werd Spanje financieel verzwakt / kreeg de Republiek meer inkomsten voor de oorlog tegen Spanje.",B:"Piet Hein veroverde São Salvador (Brazilië) en wilde Luanda (Angola) innemen — beide sleutelposities in de slavenhandel."}},
{nr:6,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Verklaar dat de VOC-regenten het medisch onderzoek van De Bondt noodzakelijk vonden, ondersteund met een kenmerkend aspect uit de zeventiende eeuw.",patternExplain:"'Verklaar dat ze het noodzakelijk vonden' = oorzaak (gezondere werknemers) → gevolg (meer winst) → Domino. Let op: het KA 'wetenschappelijke revolutie' levert géén punt op!",signals:["verklaar","noodzakelijk"],answer:null,akb:{A:"Door het onderzoek werden minder VOC-werknemers uitgeschakeld door ziekte, zodat er meer mensen konden werken.",K:"Dit bevorderde 'de wereldwijde handelscontacten en het begin van een wereldeconomie' of 'de bloei in economisch opzicht van de Nederlandse Republiek'.",B:"De Bondt observeerde tropische ziekten en probeerde VOC-personeel te genezen — direct nuttig voor de handelsonderneming."}},
{nr:7,points:3,context:"britse-rijk",type:"tijdreiziger",question:"Historici beschouwen de wet uit 1717 als een keerpunt. Leg uit welke verandering in de positie van de EIC mogelijk werd, en noem een afspraak uit het verdrag van Allahabad.",patternExplain:"'Keerpunt' + 'welke verandering in de positie' = je beschrijft de situatie vóór en na → Tijdreiziger. Let op: je MOET de positie vóór én na 1717 benoemen!",signals:["keerpunt","verandering","positie"],answer:null,akb:{A:"Vóór 1717: de EIC mocht alleen vanuit factorijen handelen en was afhankelijk van lokale heersers. Na 1717: de EIC kon zelfstandig opereren met eigen forten en soldaten.",K:"Met het verdrag van Allahabad (1765) kreeg de EIC ook het recht om belasting te heffen — daarmee werd ze een bestuurlijke macht.",B:"De wet van 1717 gaf toestemming om dorpen te kopen, een fort te verstevigen en soldaten te legeren."}},
{nr:8,points:2,context:"vroegmoderne-tijd",type:"detective",question:"Daendels roept op tot een democratische revolutie. Toon dit aan met een verwijzing naar de bron.",patternExplain:"'Toon aan dat hij oproept tot X' = je analyseert de boodschap van Daendels + bewijst dit met een citaat → Detective.",signals:["toon aan"],answer:null,akb:{A:"Daendels roept op tot gelijkheid: afkomst mag niet langer bepalen wie de macht heeft, de voorrechten van de adel moeten verdwijnen.",K:"Dit past bij een democratische revolutie: het volk neemt de macht over van de bevoorrechte stand.",B:"'Ontdoen van uw drosten, hoofdschouten... beulen en bloedzuigers' / 'boerenjongens in hun linnen kielen' versus 'mooi-gepoederde officiertjes'."}},
{nr:9,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze ontwerpen van beroemde Nederlandse gebouwen in de juiste chronologische volgorde, van vroeger naar later.",patternExplain:"Zes gebouwen ordenen = Tijdlijn-Bouwer. Ankerpunten: Leiden ontzet (1574), Gouden Eeuw stadhuis (17e eeuw), Verlichting museum (18e eeuw), koloniale expansie (19e eeuw), radio (jaren '20), aardgas (jaren '90).",signals:["chronologische volgorde","van vroeger naar later"],answer:"3, 6, 4, 5, 2, 1",akb:null},
{nr:10,points:4,context:"britse-rijk",type:"detective",question:"De opstellers van de petitie over Sati: leg uit dat ze (1) het Britse bestuurlijk gezag accepteren, maar (2) zich verzetten tegen Britse culturele beïnvloeding. Telkens met bronverwijzing.",patternExplain:"'Accepteren maar verzetten' = je analyseert twee tegengestelde houdingen van dezelfde schrijvers → Detective. Let op: twee verschillende bronverwijzingen nodig!",signals:["accepteren","verzetten","verwijzing naar de bron"],answer:null,akb:{A:"(1) Ze erkennen het Britse gezag door zich eerbiedig tot de gouverneur-generaal te richten. (2) Ze verzetten zich tegen de culturele beïnvloeding van Hindoes die 'Europees' zijn geworden.",K:"(1) Ze leggen het probleem voor aan het Britse bestuur, niet bij het bestuur zelf. (2) Alleen pundits en brahmanen mogen over religieuze zaken oordelen, niet de Britten.",B:"(1) 'Wij leggen eerbiedig voor'. (2) 'Hindoes die zichzelf hebben vervuild met verboden eten en drinken uit de Europese samenleving'."}},
{nr:11,points:4,context:"britse-rijk",type:"domino",question:"Licht het verzenden van het verslag van de fabrieksinspecteur toe: (1) waarom zijn inspecteurs nodig voor uitvoering Factory Acts? (2) waarom is de info betrouwbaar? (3) welk kapitalistisch standpunt verdedigt de brief? Met bronverwijzing.",patternExplain:"Drie deelvragen: (1) oorzaak-gevolg inspecteurs, (2) betrouwbaarheidsargument, (3) oorzaak-gevolg productie → Domino + Detective. Let op: drie delen!",signals:["licht toe","betrouwbaar","kapitalistisch standpunt"],answer:null,akb:{A:"(1) Inspecteurs controleren of fabrieken zich aan de wet houden. (2) Inspecteurs zijn onafhankelijk en objectief. (3) Kortere werkdagen zijn beter voor de productie.",K:"(1) Zonder inspectie kunnen eigenaren de wet omzeilen. (2) Liegen tegen een inspecteur zou bestraft worden. (3) Uitgeruste arbeiders produceren meer — een kapitalistisch argument.",B:"(3) 'Arbeiders werken met meer energie en geest' / een mens is geen stoommachine maar heeft 'tijd nodig om te rusten en te eten'."}},
{nr:12,points:3,context:"britse-rijk",type:"domino",question:"Het project van Octavia Hill: bij welk socialistisch streven paste het, en welke kritiek hadden socialisten op beide gegevens?",patternExplain:"'Bij welk streven past dit' + 'welke kritiek hadden ze' = overeenkomst + twee bezwaren → Domino. Let op: drie punten, drie antwoorden!",signals:["welk streven","welke kritiek"],answer:null,akb:{A:"Overeenkomst: Hill en socialisten wilden allebei de leefomstandigheden van arbeiders verbeteren.",K:"Kritiek 1: Hill eiste christelijke normen als tegenprestatie → niet alle arbeiders werden geholpen / zelfstandigheid werd beperkt. Kritiek 2: Hill wees overheidsprojecten af → te langzaam, terwijl socialisten juist een grotere overheid wilden.",B:"(1) Hill hield toezicht op christelijke normen. (2) Hill wees grootschalige overheidsprojecten af."}},
{nr:13,points:2,context:"duitsland",type:"matchmaker",question:"Noem twee kenmerkende aspecten uit de negentiende eeuw die verklaren dat Duitsland juist Elzas-Lotharingen in bezit wilde nemen.",patternExplain:"'Noem kenmerkende aspecten die verklaren' = twee KA's koppelen aan twee redenen → Matchmaker. Let op: 'de moderne vorm van imperialisme' levert géén punt op (dat gaat over buiten-Europees)!",signals:["kenmerkende aspecten","verklaren"],answer:null,akb:{A:"(1) Delfstoffen → industriële belang. (2) Duitstalige bevolking → nationalistisch belang.",K:"(1) 'De industriële revolutie die de basis legde voor een industriële samenleving'. (2) 'De opkomst van de politiek-maatschappelijke stroming het nationalisme'.",B:"Het gebied was rijk aan delfstoffen (ijzererts, steenkool) en had een meerderheid Duitssprekende bevolking."}},
{nr:14,points:2,context:"nederland",type:"domino",question:"Leg uit dat je met de herinnering van Gerard Brom kunt aantonen dat emancipatie van katholieken werd bevorderd door voortschrijdende democratisering.",patternExplain:"'Bevorderd door' = oorzaak (meer kiesrecht) → gevolg (meer katholieke politieke invloed) → Domino. Let op: je moet BEIDE noemen: (1) het democratiseringsaspect en (2) hoe dat de emancipatie bevorderde.",signals:["aantonen","bevorderd door"],answer:null,akb:{A:"Door uitbreiding van het kiesrecht konden katholieke arbeiders gaan stemmen, waardoor de katholieken meer politieke invloed kregen.",K:"Meer kiesrecht → meer katholieke kiezers → meer katholieken in het parlement → emancipatie bevorderd.",B:"Brom beschrijft dat hij 'bij de uitbreiding van het kiesrecht huisbezoeken deed voor het werven van nieuwe kiezers onder arbeiders'."}},
{nr:15,points:2,context:"duitsland",type:"matchmaker",question:"Geef per politieke ontwikkeling in Duitsland (1 t/m 4) de gebeurtenis bij het Deutsches Eck die daarbij past. Noteer de cijfers en letters.",patternExplain:"Per ontwikkeling de juiste gebeurtenis koppelen = koppelvraag → Matchmaker. Er blijft 1 gebeurtenis over.",signals:["daarbij past"],answer:"1-b, 2-a, 3-e, 4-c",akb:null},
{nr:16,points:2,context:"duitsland",type:"domino",question:"In 1919 werd Elzas-Lotharingen weer Frans. Leg uit welke andere afspraak uit de Vrede van Versailles Duitsland hierdoor moeilijker kon nakomen.",patternExplain:"'Welke afspraak werd moeilijker door dit' = het verlies van Elzas-Lotharingen (oorzaak) → moeilijker nakomen van herstelbetalingen (gevolg) → Domino.",signals:["welke afspraak","moeilijker","hierdoor"],answer:null,akb:{A:"De herstelbetalingen werden moeilijker na te komen door het verlies van Elzas-Lotharingen.",K:"Zonder de delfstoffen uit Elzas-Lotharingen verzwakte de Duitse industrie, waardoor er minder geld was voor de herstelbetalingen.",B:"Versailles bevatte twee afspraken die samen Duitsland extra troffen: teruggave Elzas-Lotharingen + herstelbetalingen."}},
{nr:17,points:4,context:"duitsland",type:"detective",question:"In deze NSDAP-instructie (1933) komen nationaalsocialistische opvattingen naar voren. Leg dit voor twee verschillende opvattingen uit.",patternExplain:"'Welke opvattingen komen naar voren' = je analyseert de ideologie achter de bron → Detective. Let op: je moet per opvatting (1) het element uit de instructie noemen EN (2) de NS-opvatting die erbij past!",signals:["opvattingen","leg uit"],answer:null,akb:{A:"(1) Censuur: kranten die niet meedoen moeten worden geboycot. (2) Antisemitisme: Joden worden als niet-Duits bestempeld.",K:"(1) Past bij NS-opvatting: andere meningen bestrijden / totalitair bestuur. (2) Past bij NS-opvatting: Joden uitsluiten uit de Volksgemeinschaft.",B:"(1) 'Kranten ogenblikkelijk verwijderd uit ieder huis waar Duitsers wonen'. (2) 'Die kranten zijn geschreven voor Joden, maar niet voor het Duitse volk'."}},
{nr:18,points:4,context:"nederland",type:"matchmaker",question:"Kritiek op Nederlandse deelname aan Olympische Spelen: leg voor 1932 (economisch) en 1936 (politiek) de kritiek uit, telkens ondersteund met een kenmerkend aspect.",patternExplain:"'Ondersteun met een kenmerkend aspect' = twee keer koppelen aan een KA → Matchmaker. Let op: elk KA maar één keer gebruiken!",signals:["kenmerkend aspect"],answer:null,akb:{A:"1932: kritiek op de kosten, want mensen leefden in armoede. 1936: kritiek op steun aan nazi-Duitsland.",K:"1932: past bij 'de crisis van het wereldkapitalisme'. 1936: past bij 'de totalitaire ideologie van het nationaalsocialisme in praktijk'.",B:"1932: veel Nederlanders waren arm door de economische crisis. 1936: deelname zou steun aan Hitlers racistische/totalitaire staat uitstralen."}},
{nr:19,points:3,context:"duitsland",type:"domino",question:"Bewering: Truman kan het verslag van generaal Clay gebruiken ter ondersteuning van zijn nieuwe Europabeleid. Licht toe: (1) welk politiek doel, en (2) welke economische maatregel kan hij hiermee ondersteunen?",patternExplain:"'Welk doel' + 'welke maatregel ondersteunen' = twee oorzaak-gevolgketens → Domino. Let op: je MOET het Marshallplan noemen voor punt 3!",signals:["welk doel","welke maatregel","ondersteunen"],answer:null,akb:{A:"(1) Truman wil de uitbreiding van het communisme in Europa tegengaan (Trumandoctrine). (2) Hij kan het Marshallplan ondersteunen.",K:"Uit het verslag blijkt: als mensen honger hebben, kiezen ze sneller voor het communisme. Dus economische hulp is nodig om democratie te behouden.",B:"Clay: 'Het is niet zo moeilijk een keuze te maken tussen communist worden op 1500 calorieën of democraat op 1000 calorieën'."}},
{nr:20,points:4,context:"duitsland",type:"detective",question:"Jordaan geeft een mening weer over de DDR-regering. Leg uit met telkens een andere bronverwijzing: (1) welke mening over het regeringsbeleid (via verwijzing naar 1941), en (2) welke mening over de machtsverhoudingen in het Oostblok.",patternExplain:"'Welke mening geeft Jordaan weer' = je analyseert de boodschap van de tekenaar → Detective. Let op: twee delen met VERSCHILLENDE bronverwijzingen!",signals:["mening","weergeeft","verwijzing naar de bron"],answer:null,akb:{A:"(1) Het DDR-beleid is net zo totalitair als het beleid van de Duitse bezetter in 1941. (2) De DDR-regering heeft zelf niet de macht — ze is afhankelijk van de Sovjet-Unie.",K:"(1) Jordaan vergelijkt het neerslaan van de arbeidersopstand in 1953 met het neerslaan van de Februaristaking door de nazi's. (2) De DDR-leiders zijn slechts marionetten van Moskou.",B:"(1) Identieke compositie: vuist slaat arbeider neer, 1941 = hakenkruis, 1953 = hamer en sikkel. (2) Ulbricht en Grotewohl staan klein achter de grote arm met het Sovjet-symbool."}},
{nr:21,points:2,context:"nederland",type:"domino",question:"De verandering die Romme wil doorvoeren zorgt voor een politiek probleem. Licht toe: (1) welk beleid wil Romme veranderen (met bron), en (2) voor welk politiek probleem zorgt dit (zonder bron)?",patternExplain:"'Welk beleid wil hij veranderen' + 'welk probleem veroorzaakt dit' = oorzaak → gevolg → Domino.",signals:["welk beleid","welk probleem"],answer:null,akb:{A:"Romme wil de geleide loonpolitiek doorbreken: lonen moeten meer stijgen dan de vastgestelde 5%.",K:"Dit bedreigt de rooms-rode coalitie, want de sociaaldemocraten (PvdA) voerden de geleide loonpolitiek samen met de KVP.",B:"Romme stelt 'een nieuw systeem voor het vaststellen van lonen' voor, met 6, 7 of 8% verhoging."}},
{nr:22,points:2,context:"nederland",type:"detective",question:"Van Straaten geeft een mening weer over een economische ontwikkeling in Nederland vanaf de jaren 1960. Leg uit welke mening, met bronverwijzing.",patternExplain:"'Welke mening geeft Van Straaten weer' = je zoekt de boodschap van de tekenaar → Detective.",signals:["mening","weergeeft","verwijzing naar de bron"],answer:null,akb:{A:"Van Straaten vindt dat de consumptiemaatschappij het leven van Nederlanders beheerst — consumeren speelt een te grote rol.",K:"De groeiende welvaart vanaf de jaren 1960 leidde tot doorgeslagen consumptiedrang.",B:"Sinterklaas drijft met een zweep mensen naar de winkel, overal staat 'koop koop koop', en 'hedenavond verkoop tot 21 uur'."}},
{nr:23,points:3,context:"nederland",type:"domino",question:"Licht toe: (1) de kern van het Nederlandse softdrugsbeleid, en (2) waarom juist het Verdrag van Schengen gesprekken met West-Duitsland hierover noodzakelijk maakte.",patternExplain:"'Waarom maakte Schengen dit noodzakelijk' = Schengen (oorzaak) → open grenzen → probleem met drugsbeleid (gevolg) → Domino.",signals:["licht toe","noodzakelijk maakte"],answer:null,akb:{A:"Nederland voerde een gedoogbeleid voor softdrugs (bezit en verkoop van kleine hoeveelheden werd niet vervolgd).",K:"Door het Verdrag van Schengen werd vrij verkeer van personen mogelijk → geen grenscontroles meer. Omdat West-Duitsland geen softdrugs toestond, moesten er afspraken komen over controle.",B:"Schengen = open grenzen. Nederland gedoogt softdrugs, Duitsland niet → conflict → overleg noodzakelijk."}},
{nr:24,points:3,context:"duitsland",type:"domino",question:"Licht toe: (1) welke koerswijziging in het buitenlands beleid van de SU werd de 'Frank-Sinatra-doctrine' genoemd, en (2) welk gevolg voorspelde Dan Quayle met de 'Nancy-Sinatra-doctrine'?",patternExplain:"'Welke koerswijziging' + 'welk gevolg' = oorzaak (nieuw beleid) → gevolg (landen lopen weg) → Domino.",signals:["welke koerswijziging","welk gevolg"],answer:null,akb:{A:"(1) De SU liet de Brezjnev-doctrine los: Oost-Europese landen mochten hun eigen beleid bepalen, zonder Sovjet-interventie. (2) Quayle voorspelde dat het Oostblok uiteen zou vallen — de landen zouden 'weglopen'.",K:"'My way' = landen gaan hun eigen weg. 'These boots are made for walking' = ze lopen weg van de SU → einde Oostblok.",B:"Gerasimov: 'Oost-Europa doet het nu op hun manier'. Quayle: denk ook aan het lied 'These boots are made for walking'."}},
{nr:25,points:2,context:"nederland",type:"domino",question:"Leg uit welke boodschap de regering wilde overbrengen over de politieke rol van Nederland in Europa met de troonrede van 1990.",patternExplain:"'Welke boodschap wilde de regering overbrengen' = je zoekt het doel achter de uitspraak → Domino/Detective.",signals:["welke boodschap","wilde overbrengen"],answer:null,akb:{A:"De boodschap was dat de politieke rol van Nederland in Europa onder druk stond en veiliggesteld moest worden.",K:"Door het veranderde Europa (val Oostblok, uitbreiding NAVO) nam de politieke taak van de NAVO toe → Nederland moest zijn rol zekerstellen.",B:"'In de NAVO treedt de militaire functie minder op de voorgrond; haar politieke taak wint aan belang'."}},
{nr:26,points:3,context:"nederland",type:"domino",question:"Toon aan: (1) dat de boodschap van gangsta rap verschilt van de oorspronkelijke rapmuziek, en (2) welke waarschuwing Van Osch geeft over de digitale revolutie.",patternExplain:"'Verschilt van de oorspronkelijke boodschap' + 'welke waarschuwing' = vergelijking + oorzaak-gevolg → Domino. Let op: je MOET beide boodschappen benoemen!",signals:["verschilt van","waarschuwing","gevolgen"],answer:null,akb:{A:"(1) Gangsta rap verheerlijkt criminaliteit en luxe, terwijl oorspronkelijke rap zich verzette tegen racisme tegenover Afro-Amerikanen. (2) Digitale platforms maken de boodschap steeds makkelijker bereikbaar voor kinderen.",K:"De boodschap is verschoven van protest naar verheerlijking van geweld. Door MTV en videogames worden kinderen overspoeld met deze content.",B:"(1) 'Criminele, gewelddadige en vrouwonvriendelijke levensstijl verheerlijkt'. (2) '50 Cent is verheven tot hoofdrolspeler in een videogame' → kinderen kunnen 'zich nog beter inleven'."}}
]};

const EXAM_2022_T3 = {id:"2022t3",name:"2022 Tijdvak 3",date:"5 juli 2022",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze terechtstellingen in de juiste chronologische volgorde, van vroeger naar later.",patternExplain:"Zes terechtstellingen ordenen = Tijdlijn-Bouwer. Ankerpunten: lutherse monniken (1523), Karel I (1649), Robespierre (1794), handwevers/Luddites (1813), Rijksdagbrand (1933), Rosenbergs/atoomgeheimen (1953).",signals:["chronologische volgorde","van vroeger naar later"],answer:"2, 1, 5, 6, 4, 3",akb:null},
{nr:2,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Leg uit dat het signeren door Dürer met zijn monogram 'het veranderende mens- en wereldbeeld van de renaissance' illustreert.",patternExplain:"'Leg uit dat X dit KA illustreert' = je legt het verband uit tussen het signeren en het renaissance-ideaal → Domino. Het KA staat al gegeven, jij moet de redenering leveren.",signals:["leg uit","illustreert"],answer:null,akb:{A:"Door de renaissance werd individualiteit belangrijk — kunstenaars wilden erkend worden als maker.",K:"Het 'veranderende mens- en wereldbeeld' zorgde ervoor dat de nadruk kwam te liggen op het individu / het kunstenaarschap.",B:"Dürer signeerde met zijn monogram (A en D in elkaar geschoven) — hij wilde niet langer anoniem zijn."}},
{nr:3,points:4,context:"vroegmoderne-tijd",type:"domino",question:"De gebeurtenissen in Den Bosch in 1566 passen bij conflicten in de zestiende eeuw. Ondersteun: (1) bij welk godsdienstig conflict, en (2) aan welk politiek conflict dragen ze bij?",patternExplain:"'Bij welk conflict past dit' + 'aan welk conflict draagt het bij' = twee oorzaak-gevolgketens → Domino. Let op: je moet bij beide UITLEGGEN, niet alleen het conflict noemen!",signals:["passen bij","bijdragen"],answer:null,akb:{A:"(1) Godsdienstig: past bij de reformatie — protestanten vallen katholieke kloosters aan. (2) Politiek: draagt bij aan de Opstand tegen Spanje.",K:"(1) De aanval op kloosters/verdrijving van monniken past bij de overname door protestanten. (2) Het Spaanse gezag treedt hard op → Nederlandse gewesten verzetten zich → stichting Nederlandse staat.",B:"(1) 'Kloosters zouden een wereldse bestemming krijgen' / kloosterlingen werden verdreven. (2) Ambtenaren van de landvoogdes (= Spaans gezag) zijn betrokken."}},
{nr:4,points:2,context:"britse-rijk",type:"domino",question:"Verklaar de verwachting van de Spaanse ambassadeur dat Filips III interesse zou hebben in de kaart van de Engelse kolonie.",patternExplain:"'Verklaar de verwachting' = waarom verwachtte hij interesse → oorzaak (concurrentie) → gevolg (kaart nuttig) → Domino.",signals:["verklaar","verwachting"],answer:null,akb:{A:"Spanje en Engeland waren concurrenten in Amerika. De kaart gaf strategische informatie over de Engelse kolonie.",K:"Met de kaart kon Filips III inschatten welk gevaar de kolonie opleverde / een aanval plannen op de Engelse nederzetting.",B:"John Smith maakte een gedetailleerde kaart; de Spaanse ambassadeur wist een kopie te bemachtigen."}},
{nr:5,points:4,context:"britse-rijk",type:"detective",question:"Twee conclusies over de brief van William Hilton: (1) het doel van de brief maakt hem minder betrouwbaar, en (2) de brief is bruikbaar om aan te tonen dat New Plymouth een vestigingskolonie is. Leg beide uit met bronverwijzing.",patternExplain:"'Minder betrouwbaar' + 'bruikbaar als bron' = je beoordeelt de bron op twee manieren → Detective. Let op: verschillende bronverwijzingen nodig!",signals:["minder betrouwbaar","bruikbaar"],answer:null,akb:{A:"(1) Hilton wil zijn vrouw en vrienden overhalen om te komen → hij beschrijft het leven rooskleuriger dan het is. (2) De brief toont kenmerken van een vestigingskolonie: eigen land, landbouw, gezin laten overkomen.",K:"(1) Zijn doel (mensen werven) maakt hem partijdig → minder betrouwbaar over de werkelijke omstandigheden. (2) Vestigingskolonie = permanent wonen, eigen land bewerken — dat beschrijft hij.",B:"(1) 'Ik verzoek je ervoor te zorgen dat mijn vrouw en kinderen hierheen komen'. (2) 'We zijn allemaal eigen grondbezitters; we hoeven geen huur te betalen' / 'beter graan dan de indiaanse maïs'."}},
{nr:6,points:4,context:"vroegmoderne-tijd",type:"matchmaker",question:"De Wonderkamer past bij kenmerkende aspecten van de vroegmoderne tijd. Toon aan: (1) twee KA's uit de 16e eeuw die het verzamelen mogelijk maakten, en (2) hoe de Wonderkamer bijdroeg aan de wetenschappelijke revolutie.",patternExplain:"'Twee kenmerkende aspecten + bijdrage aan wetenschappelijke revolutie' = je koppelt de bron aan KA's → Matchmaker. Let op: 'de wetenschappelijke belangstelling' als 16e-eeuws KA levert géén punt op bij deel 1!",signals:["kenmerkende aspecten","bijgedragen aan"],answer:null,akb:{A:"(1a) Overzeese expansie maakte het mogelijk om objecten uit andere werelddelen te verzamelen. (1b) Heroriëntatie op de Oudheid leidde tot verzamelen van klassieke objecten. (2) De opzet stimuleerde empirisch onderzoek.",K:"(1a) 'Het begin van de Europese overzeese expansie'. (1b) 'De hernieuwde oriëntatie op het erfgoed van de klassieke Oudheid'. (2) De open kasten maakten het mogelijk de objecten zelf te bestuderen — basis voor de wetenschappelijke revolutie.",B:"(1a) Objecten uit verschillende continenten. (1b) Antieke Griekse vazen. (2) Open kasten + Sebastian Biavetti als 'levend onderdeel' — alles kon bestudeerd worden."}},
{nr:7,points:4,context:"vroegmoderne-tijd",type:"domino",question:"De invoering van militaire hervormingen verliep in Frankrijk sneller dan in de Republiek. Ondersteun: hoe werd Frankrijk bestuurd en waarom bevorderde dat hervormingen? Hoe werden besluiten genomen in de Republiek en waarom belemmerde dat hervormingen?",patternExplain:"'Verklaar het verschil in tempo' = twee staatkundige systemen vergelijken als oorzaak van verschil in tempo → Domino. Let op: je moet per land ZOWEL het bestuur ALS het effect op hervormingen noemen!",signals:["verklaar","bevorderde","belemmerde"],answer:null,akb:{A:"Frankrijk: absoluut koningschap → koning kon hervormingen direct doorvoeren. Republiek: besluiten met instemming van alle gewesten → traag.",K:"Absoluut gezag = snelle besluitvorming. Gewestelijk overleg = compromissen en vertraging.",B:"Frankrijk had een sterk centraal gezag (absolutisme). In de Republiek moesten alle gewesten instemmen met besluiten over het leger."}},
{nr:8,points:3,context:"britse-rijk",type:"detective",question:"Robert Clive wil dat de EIC haar beleid verandert. Ondersteun: (1) welke beleidsverandering stelt hij voor (met bronverwijzing), en (2) welke historische gebeurtenis in 1765 toont dat de EIC het overneemt?",patternExplain:"'Welke beleidsverandering wil hij' = je analyseert de intentie van Clive → Detective. Plus historische kennis nodig over 1765.",signals:["beleidsverandering","voorstelt","overneemt"],answer:null,akb:{A:"Clive stelt voor dat de EIC niet alleen handelt, maar directe politieke en militaire macht gaat uitoefenen in India.",K:"Het verdrag van Allahabad (1765) gaf de EIC bestuurlijke macht en belastingheffing — exact wat Clive voorstelde.",B:"Clive: 'We moeten zelf Nawabs worden' / 'Laten we onze regimenten aanvullen tot 1000 man' / 'het hele Mogolrijk zal in onze handen zijn'."}},
{nr:9,points:3,context:"vroegmoderne-tijd",type:"domino",question:"Het beleid van Maria Theresia: geef aan dat het (1) verlicht, (2) absoluut, en (3) eenheidsbevorderend kan worden genoemd.",patternExplain:"Drie aspecten van hetzelfde beleid uitleggen = drie keer oorzaak-gevolg → Domino. Let op: drie delen!",signals:["verlicht","absoluut","eenheid"],answer:null,akb:{A:"(1) Verlicht: ze wil dat de bevolking beter onderwijs krijgt / kennis verspreidt. (2) Absoluut: ze dwingt dit af met dreiging van arrestatie. (3) Eenheid: iedereen krijgt dezelfde lessen.",K:"(1) Kennis verspreiden past bij verlicht denken. (2) Dwang past bij absoluut vorst. (3) Gezamenlijk onderwijs (incl. rooms-katholiek) versterkt de eenheid.",B:"Leerplicht 6-12 jaar, rooms-katholieke godsdienstlessen, rekenen/lezen/schrijven. Dreiging met arrestatie bij verzet."}},
{nr:10,points:2,context:"vroegmoderne-tijd",type:"detective",question:"Leg uit welk verlicht ideaal James Madison in dit artikel verdedigt.",patternExplain:"'Welk ideaal verdedigt hij' = je analyseert de boodschap/het standpunt van Madison → Detective.",signals:["welk ideaal","verdedigt"],answer:null,akb:{A:"Madison verdedigt de trias politica: de scheiding van wetgevende, uitvoerende en rechterlijke macht.",K:"Als alle macht in dezelfde handen is, ontstaat tirannie — daarom moet de macht gesplitst worden.",B:"Madison: 'Als de wettelijke, uitvoerende en gerechtelijke machten in dezelfde handen zijn... dan kan dat terecht tirannie worden genoemd'."}},
{nr:11,points:4,context:"britse-rijk",type:"detective",question:"Abolitionisten willen Pieter Groens beschrijving gebruiken, maar twijfelen over het eenzijdige beeld. Licht toe: (1) welke boodschap kunnen ze ermee overbrengen (met bronverwijzing), en (2) waarom is het beeld eenzijdig gezien Groens achtergrond?",patternExplain:"'Welke boodschap' + 'eenzijdig door zijn achtergrond' = je analyseert doel én partijdigheid → Detective. Let op: deel 2 gaat over de partijdigheid van de maker!",signals:["boodschap","eenzijdig","betrouwbaar"],answer:null,akb:{A:"(1) Abolitionisten kunnen aantonen dat slavernij wreed is en mensen hun rechten ontneemt. (2) Groen geeft een eenzijdig beeld omdat hij als familielid van een plantage-eigenaar de schuld bij de slaafgemaakten legt, niet bij de eigenaren.",K:"(1) De beschrijving toont de gruwelijke werkelijkheid van slavernij. (2) Als zoon van een Amsterdamse koopman/plantage-eigenaar is hij voorstander van slavernij → hij heeft geen oog voor de positie van slaafgemaakten.",B:"(1) 'Beter is zoonlief bij de geboorte te wurgen dan aan de blanken af te staan' / '600 zweepslagen'. (2) Hij beschrijft slaafgemaakten als mensen die 'kwaad in de zin hebben' en die weglopers 'opstoken'."}},
{nr:12,points:2,context:"britse-rijk",type:"domino",question:"Het Britse bestuur verbood sati maar heel weinig andere religieuze gebruiken. Geef een verklaring: (1) bij welke doelstelling paste het verbod, en (2) vanuit welk politiek motief verboden ze weinig?",patternExplain:"'Geef een verklaring' met twee kanten = twee oorzaak-gevolgketens → Domino.",signals:["verklaring","welke doelstelling","welk motief"],answer:null,akb:{A:"(1) Het verbod paste bij de doelstelling om de (superieure) Britse cultuur/wetgeving op te leggen. (2) Ze verboden weinig om opstand in de kolonie te voorkomen.",K:"(1) Sati was volgens de Britten barbaars en in strijd met hun normen. (2) Te veel verbieden zou tot verzet leiden → risico op opstand → macht verliezen.",B:"Het verbod op sati (1829) was een uitzondering: het Britse bestuur was normaal terughoudend met het verbieden van religieuze gebruiken."}},
{nr:13,points:2,context:"britse-rijk",type:"domino",question:"Samuel Coronel publiceerde statistieken over groeiachterstand bij kinderen van fabrieksarbeiders. Geef aan: (1) welke verandering wilde hij bereiken, en (2) bij welke discussie sloot dit aan?",patternExplain:"'Welke verandering wilde hij bereiken' + 'bij welke discussie' = doel + koppeling → Domino.",signals:["welke verandering","welke discussie"],answer:null,akb:{A:"(1) Coronel wilde dat het gemeentebestuur maatregelen nam om de leefomstandigheden van arbeiders te verbeteren.",K:"(2) Dit sloot aan bij de 'discussies over de sociale kwestie'.",B:"Coronel publiceerde statistieken die aantoonden dat fabrieksarbeiderskinderen een groeiachterstand hadden t.o.v. andere kinderen."}},
{nr:14,points:4,context:"nederland",type:"detective",question:"Stienstra levert een bijdrage aan de emancipatie van Friese arbeiders. Geef aan: (1) welk socialistisch standpunt (met bronverwijzing), (2) hoe draagt zo'n toespraak bij aan emancipatie, en (3) hoe bevordert democratisering de emancipatie (zonder bron)?",patternExplain:"Drie deelvragen: (1) mening analyseren + bron = Detective, (2) gevolg uitleggen, (3) historische kennis → Domino/Detective mix. Let op: drie delen!",signals:["welk standpunt","bijdraagt aan","bevordert"],answer:null,akb:{A:"(1) Stienstra gaat uit van het socialistische standpunt dat arbeiders worden uitgebuit door de machtigen. (2) De toespraak maakt arbeiders bewust dat ze zelf moeten strijden. (3) Door meer stemrecht kunnen arbeiders stemmen op partijen die opkomen voor hun rechten.",K:"(1) Arbeiders werken keihard maar 'lijden gebrek', terwijl machthebbers in 'paleizen' wonen. (2) Bewustwording → organisatie → actie. (3) Meer kiesrecht → politieke invloed → betere wetgeving.",B:"(1) 'De paleizen van de machtigen... die jullie rechten als mens onthouden' / 'wonen in krotten die voor varkens nog te slecht zijn'. (1) 'Proletariërs aller landen verenigt u'."}},
{nr:15,points:2,context:"duitsland",type:"domino",question:"Leg uit waardoor uitvindingen als de Radio Music Box bijdroegen aan het ontstaan van massaorganisaties in de eerste helft van de 20e eeuw.",patternExplain:"'Waardoor droeg dit bij aan' = oorzaak (radio) → gevolg (massaorganisaties) → Domino.",signals:["waardoor","bijdroegen"],answer:null,akb:{A:"Door de radio kon propaganda direct bij burgers thuis worden verspreid, waardoor grote groepen mensen tegelijk dezelfde boodschap kregen.",K:"Massale verspreiding van één ideologie → mensen worden op dezelfde manier beïnvloed → massaorganisaties konden ontstaan.",B:"De Radio Music Box (1916) maakte het mogelijk dat radio-uitzendingen in elk huishouden konden worden ontvangen."}},
{nr:16,points:4,context:"duitsland",type:"detective",question:"Strube geeft een verwachting weer over (1) het verloop van de verkiezingen en (2) de toekomst van de democratie in Duitsland. Leg beide uit met telkens een andere bronverwijzing.",patternExplain:"'Welke verwachting geeft Strube weer' = je analyseert de boodschap van de tekenaar → Detective. Let op: twee delen met VERSCHILLENDE bronverwijzingen!",signals:["verwachting","weergeeft"],answer:null,akb:{A:"(1) Strube verwacht dat de verkiezingen niet eerlijk zullen verlopen — de uitslag wordt door de nazi's afgedwongen. (2) Strube verwacht dat de democratie zal verdwijnen.",K:"(1) Kiezers worden geïntimideerd bij het stemmen. (2) Wie niet meewerkt wordt bedreigd met geweld/de dood.",B:"(1) Mannen in uniform bij de ingang / een NS'er kijkt over de schouder van de stemmer mee. (2) Hitler houdt het touw van een guillotine vast / 'Wie niet voor ons is, is tegen ons'."}},
{nr:17,points:3,context:"duitsland",type:"detective",question:"De publicatie van de foto met bijschrift past bij de NS-politiek. Ondersteun: (1) het past bij het in praktijk brengen van het NS, en (2) het moet de acceptatie van de Duitse bezetting van Nederland vergemakkelijken.",patternExplain:"'Past bij NS-politiek' = je analyseert hoe de publicatie NS-doelen dient → Detective. Let op: bij deel 2 moet je ZOWEL de boodschap ALS het effect op acceptatie noemen!",signals:["past bij","nationaalsocialistische politiek"],answer:null,akb:{A:"(1) De bezetter bepaalt wat kranten moeten publiceren → propaganda/censuur = NS in praktijk. (2) De publicatie moet Nederlanders laten geloven dat Engeland en koningin Wilhelmina de vijanden zijn.",K:"(1) Totalitair: de staat controleert de pers. (2) Als Nederlanders de Britten/koningin als vijand zien, accepteren ze het Duitse gezag makkelijker.",B:"(1) Verplicht onderschrift op de voorpagina van kranten. (2) 'Engelse vliegers hebben een aanval ondernomen... met vliegtuigen die door de Nederlandse koningin zijn geschonken'."}},
{nr:18,points:3,context:"duitsland",type:"tijdreiziger",question:"Drie migratiegolven van Duitse migranten (1945-1990). Geef voor elke golf een passende historische verklaring.",patternExplain:"Drie periodes met elk een eigen oorzaak = je beschrijft veranderingen over tijd → Tijdreiziger.",signals:["migratiegolven","verklaring"],answer:null,akb:{A:"(1) Na mei 1945: toename door vlucht voor Russische troepen / verdrijving uit Oost-Europa. (2) Na augustus 1961: afname door bouw Berlijnse Muur. (3) Na juni 1989: toename door openstelling Oost-Europese grenzen.",K:"(1) Heimatvertriebenen trokken westwaarts. (2) De Muur maakte vertrek uit de DDR bijna onmogelijk. (3) Hongarije opende haar grens → Oost-Duitsers konden via Oost-Europa naar het Westen.",B:"Drie scharnierpunten: mei 1945 (einde WO2), augustus 1961 (Muur), juni 1989 (Hongaarse grensopening → val Muur november 1989)."}},
{nr:19,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet de zes gegevens over Nederlandse popartiesten in de juiste chronologische volgorde.",patternExplain:"Zes gegevens ordenen = Tijdlijn-Bouwer.",signals:["chronologische volgorde","van vroeger naar later"],answer:"5, 2, 6, 1, 3, 4",akb:null},
{nr:20,points:2,context:"duitsland",type:"domino",question:"Togliatti protesteert tegen Italiaanse NAVO-toetreding. Leg uit dat toetreding een gevaar oplevert door de buitenlands-politieke verhoudingen, ondersteund met een kenmerkend aspect.",patternExplain:"'Leg uit welk gevaar' + 'ondersteun met KA' = oorzaak-gevolg + koppeling → Domino. Het KA over de Koude Oorlog bewijst je punt.",signals:["gevaar oplevert","kenmerkend aspect"],answer:null,akb:{A:"Door NAVO-toetreding wordt Italië een doelwit voor de Sovjet-Unie in geval van oorlog.",K:"Past bij 'de verdeling van de wereld in twee ideologische blokken, de greep van een wapenwedloop en de dreiging van een atoomoorlog'.",B:"Togliatti: 'Italië wordt een tapijt van atoombommen' / 'het is een verdrag dat voorbereidt op een oorlog'."}},
{nr:21,points:2,context:"duitsland",type:"matchmaker",question:"Geef voor elke uitspraak van een Duitse leider (1945-2002) aan welke leider erbij hoort.",patternExplain:"Per uitspraak de juiste leider koppelen = koppelvraag → Matchmaker.",signals:["hoort"],answer:"a-5, b-2, c-4, d-1",akb:null},
