{nr:11,points:4,context:"britse-rijk",type:"detective",question:"De prent over Vader Theems (1858): kritiek op (1) leefomstandigheden in Londen en (2) de Britse regering. Geef voor beide een argument met een andere bronverwijzing.",patternExplain:"Twee soorten kritiek analyseren = Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["kritiek","argument"],answer:null,akb:{A:"(1) Londen is ongezond om in te wonen: de Theems veroorzaakt dodelijke ziektes. (2) De regering doet te weinig: in plaats van het probleem op te lossen, willen ze verhuizen naar een nieuw parlementsgebouw.",K:"(1) Slechte leefomstandigheden door vervuiling. (2) Nalatigheid van de overheid.",B:"(1) Uit de rivier komen figuren die difterie, cholera en scrofulose voorstellen / dode dieren op de oever. (2) De ondertitel: 'Een ontwerp voor een muurschildering in het nieuwe parlementsgebouw' (= spot)."}},
{nr:12,points:2,context:"britse-rijk",type:"domino",question:"De Britse spoorlijn in het Himalayagebergte. Hoe bevordert deze spoorlijn het moderne imperialisme (met bronverwijzing)?",patternExplain:"'Hoe bevordert dit imperialisme' = oorzaak (spoorlijn) → gevolg (controle/grondstoffen) → Domino.",signals:["bevordert"],answer:null,akb:{A:"Door de spoorlijn wordt een ruig, moeilijk toegankelijk gebied bereikbaar → de Britten kunnen hun politieke invloed vergroten / grondstoffen verkrijgen.",K:"Infrastructuur = instrument van imperialisme: controle over afgelegen gebieden.",B:"De foto toont een trein die door bergachtig, dichtbegroeid terrein rijdt met scherpe bochten en steile hellingen. De lijn verbindt het Himalayagebergte met de kust."}},
{nr:13,points:2,context:"britse-rijk",type:"detective",question:"Lord Curzon zegt dat de Britten het Indiase bestuur gebruiken vanwege 'lokale kennis'. Welke reden noemt hij NIET en verklaar waarom hij die weglaat.",patternExplain:"'Welke reden noemt hij NIET' = je analyseert wat hij bewust weglaat → Detective.",signals:["niet noemt","verklaren"],answer:null,akb:{A:"Curzon noemt NIET dat de Britten te weinig mensen hadden om India zelf te besturen. Hij laat dit weg om te voorkomen dat het Britse gezag als zwak/kwetsbaar wordt gezien.",K:"Als iedereen wist dat de Britten afhankelijk waren van het inheemse bestuur, zou dat de Britse autoriteit ondermijnen.",B:"Curzon: 'goed bestuur alleen mogelijk was met lokale kennis' — hij draait de afhankelijkheid om als bewuste keuze."}},
{nr:14,points:4,context:"duitsland",type:"domino",question:"Voorgedrukte briefkaarten voor Britse soldaten in WO1. Leg uit: (1) welk binnenlands politiek doel met gegeven 1, en (2) welke militaire reden met gegeven 2.",patternExplain:"Twee doelen/redenen uitleggen = twee keer oorzaak-gevolg → Domino.",signals:["welk doel","welke reden"],answer:null,akb:{A:"(1) Het thuisfront geruststellen → steun voor de oorlog hoog houden / mannen aanmoedigen zich aan te melden. (2) Voorkomen dat strategische informatie in vijandelijke handen valt / dat het thuisfront de ellende ontdekt.",K:"(1) Propaganda: alles gaat goed. (2) Militaire veiligheid: geen extra informatie toestaan.",B:"(1) Voorgedrukte zinnen: 'alles gaat goed' / 'ik ben ziek maar voel me al beter'. (2) 'Als er iets anders op deze kaart wordt geschreven, wordt hij vernietigd'."}},
{nr:15,points:3,context:"nederland",type:"detective",question:"Gé Nabrink geeft kritiek op de Indische Tentoonstelling (1932). (1) Tot welke stroming behoort hij (met bronverwijzing), en (2) noem het KA dat past bij het organiseren van de tentoonstelling.",patternExplain:"'Welke stroming' + 'welk KA' = analyse + koppeling → Detective/Matchmaker mix.",signals:["welke stroming","kenmerkend aspect"],answer:null,akb:{A:"(1) Nabrink is communist/socialist — hij spreekt over 'bezittende klasse', 'bourgeoisie' en 'denkende arbeiders'. (2) KA: 'de rol van propaganda en moderne communicatiemiddelen'.",K:"(1) Socialistische/communistische taal: klassen, bourgeoisie, arbeiders. (2) De tentoonstelling was propaganda om het kolonialisme te rechtvaardigen.",B:"(1) 'De Nederlandse bezittende klasse' / 'de terreur van de Nederlandse bourgeoisie' / 'denkende arbeiders laten zich niet om de tuin leiden'. (2) Een grote tentoonstelling met eten, muziek en authentieke gebouwen = propaganda."}},
{nr:16,points:3,context:"duitsland",type:"domino",question:"De maatregel van 1938 over Joodse voornamen past bij het NS. Toon aan: (1) het past bij een totalitair systeem, en (2) hoe draagt het bij aan het buitensluiten van Joden.",patternExplain:"'Past bij totalitair systeem' + 'hoe draagt het bij aan buitensluiting' = twee oorzaak-gevolgketens → Domino.",signals:["past bij","buitensluiten"],answer:null,akb:{A:"(1) De overheid heeft zeggenschap over iets persoonlijks als voornamen = totalitair. (2) Door verplichte namen als Israel/Sarah zijn Joden meteen herkenbaar → makkelijker te weren uit het openbare leven.",K:"(1) Totalitair: de staat controleert alles, ook het privéleven. (2) Herkenbaarheid = eerste stap naar uitsluiting en vervolging.",B:"Luise Solmitz: 'Joden moeten een Joodse voornaam hebben' / 'mannen moeten Israel toevoegen en vrouwen Sarah' / 'op alle officiële correspondentie moet de tweede voornaam worden vermeld'."}},
{nr:17,points:4,context:"duitsland",type:"detective",question:"David Lows prent (1938): kritiek op zowel het Britse als het Duitse buitenlandse beleid. Geef voor beide aan welk beleid, met telkens een andere bronverwijzing.",patternExplain:"'Welk beleid wordt bekritiseerd' = je analyseert de boodschap van de tekenaar → Detective. Let op: twee VERSCHILLENDE bronverwijzingen!",signals:["welk beleid","bekritiseert"],answer:null,akb:{A:"(1) Low bekritiseert de Britse appeasementpolitiek: niets doen terwijl het gevaar groeit. (2) Low bekritiseert de agressieve Duitse expansiepolitiek.",K:"(1) Appeasement: toegeven aan Hitler in de hoop op vrede. (2) Duitse agressie: het annexeren van buurlanden.",B:"(1) De man blijft in zijn ligstoeltje zitten terwijl de krokodil hem opslokt / boek: 'Het dwazenparadijs van de democratie' / 'alles voor een rustig leven'. (2) De krokodil met hakenkruizen op de rug die gewelddadig de man opslokt."}},
{nr:18,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen uit het leven van Madeleine Albright in de juiste chronologische volgorde.",patternExplain:"Zes gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: Conferentie van München (1938), vernietigingskampen (WO2), communistisch regime Tsjecho-Slowakije (1948), détente (jaren '70), val Berlijnse Muur (1989), 11 september (2001).",signals:["chronologische volgorde","van vroeger naar later"],answer:"5, 1, 3, 6, 4, 2",akb:null},
{nr:19,points:3,context:"duitsland",type:"domino",question:"Operatie Osoawiachim (1946) en de terugkeer van wetenschappers naar de DDR (jaren '50). (1) Welke rechtvaardiging voerde de SU aan, en (2) waarom ontving de DDR hen als helden?",patternExplain:"'Welke rechtvaardiging' + 'waarom als helden' = twee oorzaak-gevolgketens → Domino.",signals:["rechtvaardiging","verklaren"],answer:null,akb:{A:"(1) De SU wilde compensatie voor de oorlogsschade → fabrieken en wetenschappers meenemen als herstelbetalingen. (2) De DDR ontving hen als helden omdat ze hadden bijgedragen aan het versterken van het communisme / omdat de SU dit opdroeg.",K:"(1) Oorlogsschade → recht op compensatie. (2) Propaganda: de wetenschappers hadden het socialisme gediend.",B:"(1) Duitse laboratoria en fabrieken werden afgebroken en naar de SU verplaatst. (2) Ze kregen goede banen en mooie huizen in de DDR."}},
{nr:20,points:3,context:"nederland",type:"domino",question:"De Stichting van de Arbeid steunde eerst de geleide loonpolitiek maar eind jaren '50 niet meer. Verklaar: (1) welk gemeenschappelijk doel hadden ze, en (2) waarom nam de steun af?",patternExplain:"'Welk doel' + 'waarom nam de steun af' = twee oorzaak-gevolgketens → Domino.",signals:["welk doel","verklaren"],answer:null,akb:{A:"(1) Ze wilden de wederopbouw/werkgelegenheid stimuleren door lonen laag te houden. (2) Eind jaren '50 groeide de economie → lage lonen waren niet meer nodig / werkgevers konden geen personeel werven.",K:"(1) Na WO2: wederopbouw → lage lonen → concurrerende export. (2) Economische groei → werknemers willen hogere lonen → werkgevers willen hogere lonen bieden om personeel te houden.",B:"De Stichting van de Arbeid organiseerde overleg tussen werkgevers en werknemers."}},
{nr:21,points:4,context:"duitsland",type:"detective",question:"Het artikel over Peter Fechter (1962). Toon aan met bronverwijzing: (1) het optreden van de grensbewakers draagt bij aan de gespannen verhouding, en (2) de publicatie van het artikel draagt bij aan de gespannen verhouding.",patternExplain:"Twee manieren waarop spanningen toenemen = Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["bijdraagt aan","gespannen"],answer:null,akb:{A:"(1) Het doodschieten van Fechter leidt tot opstootjes aan de Muur. (2) Het artikel versterkt het westerse vijandsbeeld van het Oostblok.",K:"(1) Directe reactie: woede en rellen. (2) Publicatie: de hele westerse wereld leest over de brutaliteit → meer haat tegen het communisme.",B:"(1) 'Er werd moordenaars en bandieten geroepen' / communistische agenten gooiden traangasgranaten op de menigte. (2) Het artikel benadrukt dat de bewakers 'communisten' zijn / beschrijft het lichaam als 'een zak aardappels'."}},
{nr:22,points:2,context:"nederland",type:"domino",question:"Uitspraken van Gerrit van Dam (1974) waren voor Dolle Mina reden om door te gaan. Leg uit.",patternExplain:"'Leg uit waarom dit reden was' = oorzaak (Van Dams woorden) → gevolg (acties doorgaan) → Domino.",signals:["reden","doorgaan"],answer:null,akb:{A:"Van Dam vindt dat vrouwen hun gezin boven betaald werk moeten stellen — dit toont dat de confessionele partijen de traditionele rol van vrouwen willen handhaven.",K:"Zolang politici zoals Van Dam vrouwen een traditionele rol toewijzen, is de emancipatie niet af → Dolle Mina gaat door.",B:"Van Dam: vrouwen moeten 'aan het gezin een hogere prioriteit toekennen dan aan het leveren van een rechtstreeks beloonde bijdrage aan het productieproces'."}},
{nr:23,points:2,context:"nederland",type:"detective",question:"De striptekenaar beschrijft een kerstviering bij kunstenaarscollectief Dubio (1980). Leg uit met bronverwijzing dat dit past bij de punkbeweging.",patternExplain:"'Past bij de punkbeweging' = je analyseert de houding in de bron → Detective.",signals:["past bij","punkbeweging"],answer:null,akb:{A:"De punkbeweging verzette zich tegen de consumptiemaatschappij/bestaande orde. De Mercedes-emblemen als kerstversiering zijn een bewuste provocatie tegen kapitalisme.",K:"Punks waren anti-kapitalistisch en anti-burgerlijk. Het slopen van luxe-emblemen + verwerpen van 'burgerlijke kerstballen' past hierbij.",B:"'Natuurlijk zonder burgerlijke kerstballen' / Mercedes-emblemen gesloopt van dure auto's en gebruikt als kerstversiering / 'letterlijk onbetaalbare kerstversiering'."}},
{nr:24,points:3,context:"duitsland",type:"domino",question:"Protest in de BRD (1983) tegen het verzamelen van statistische gegevens (Überwachungsstaat). (1) Verklaar het verzet met een KA uit de 1e helft 20e eeuw, en (2) geef het verband met de digitale revolutie.",patternExplain:"'Verklaar het verzet met KA' + 'verband met digitale revolutie' = twee oorzaak-gevolgketens → Domino.",signals:["verklaren","kenmerkend aspect","verband"],answer:null,akb:{A:"(1) De Duitsers hadden ervaring met totalitaire regimes → angst dat de overheid opnieuw te veel macht zou krijgen. (2) Door de digitale revolutie konden gegevens sneller worden gedeeld/vergeleken → meer macht voor de overheid.",K:"(1) KA: 'het in praktijk brengen van de totalitaire ideologieën communisme en fascisme/nationaalsocialisme'. (2) Computers maken het mogelijk om grote hoeveelheden data te verwerken → controle wordt makkelijker.",B:"In 1983 wilde de BRD-regering statistische gegevens verzamelen. De bevolking vreesde een Überwachungsstaat."}},
{nr:25,points:2,context:"duitsland",type:"detective",question:"Georges Millions prent over de oorlog in Joegoslavië (1991). Welke kritiek op de werkwijze van de EU, met bronverwijzing?",patternExplain:"'Welke kritiek' = je analyseert de boodschap van de tekenaar → Detective.",signals:["welke kritiek"],answer:null,akb:{A:"Million bekritiseert dat de EU niet goed samenwerkt / traag is / alleen praat maar geen actie onderneemt.",K:"De EU faalt: terwijl Joegoslavië in brand staat, ruziën de EU-'brandweermannen' onderling.",B:"'Wie gaat het water betalen?' / 'We moeten misschien gaan kijken' / 'Er is geen probleem!' / de brandweermannen zitten in de auto maar ondernemen geen actie."}},
{nr:26,points:2,context:"duitsland",type:"domino",question:"In 1997 werden de grensbewakers die Peter Fechter doodschoten veroordeeld. Leg uit door welke politieke verandering dit mogelijk werd.",patternExplain:"'Welke politieke verandering' = oorzaak (val DDR/hereniging) → gevolg (veroordeling) → Domino.",signals:["welke verandering","mogelijk werd"],answer:null,akb:{A:"De DDR bestond niet meer / Duitsland was herenigd → het werd mogelijk om DDR-misdadigers te berechten.",K:"Zolang de DDR bestond, waren de grensbewakers beschermd door het regime. Na de hereniging vielen ze onder het Duitse recht.",B:"In 1997 werden twee Oost-Berlijnse grensbewakers veroordeeld voor doodslag op Peter Fechter (1962)."}}
]};

const EXAM_2025_T1 = {id:"2025t1",name:"2025 Tijdvak 1",date:"12 mei 2025",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen over reclame in Nederland in de juiste chronologische volgorde.",patternExplain:"Zes reclame-gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: dertien koloniën (18e eeuw), stoommachines/eerste advertentiebureau (19e eeuw), Beurskrach (1929), NS-weekblad Storm (WO2), Dolle Mina's (jaren '70), TikTokkers (heden).",signals:["chronologische volgorde","van vroeger naar later"],answer:"4, 3, 6, 5, 2, 1",akb:null},
{nr:2,points:3,context:"vroegmoderne-tijd",type:"detective",question:"Het reisverslag van Velho over Vasco da Gama in India. (1) Toon aan dat de reis bijdraagt aan het veranderen van het wereldbeeld (met bronverwijzing), en (2) waarom is de bron betrouwbaar?",patternExplain:"'Veranderend wereldbeeld aantonen' + 'waarom betrouwbaar' = bronanalyse → Detective.",signals:["veranderen","betrouwbaar"],answer:null,akb:{A:"(1) De Portugezen ontdekken dat ze te weinig weten van de rijke Indiase cultuur → hun wereldbeeld verandert. (2) Velho schrijft een privé-reisverslag (geen reden om te liegen) en is ooggetuige.",K:"(1) De geschenken worden uitgelachen → de Portugezen hadden de rijkdom van India onderschat. (2) Een persoonlijk dagboek is betrouwbaarder dan een officieel verslag.",B:"(1) De bedienden lachen om de geschenken: 'de armste koopman uit Mekka gaf meer dan dit'. (2) 'Soldaat Alvaro Velho houdt voor zichzelf een reisverslag bij'."}},
{nr:3,points:4,context:"vroegmoderne-tijd",type:"domino",question:"Bontemantel over schuttersstukken na 1580. Per oorzaak (1: conflict met Spanje, 2: bloei Republiek) aangeven hoe dit leidt tot verandering in het schilderen, met bronverwijzing.",patternExplain:"Twee oorzaken → twee veranderingen = twee keer oorzaak-gevolg → Domino. Let op: twee VERSCHILLENDE bronverwijzingen!",signals:["waardoor","leidt tot"],answer:null,akb:{A:"(1) Door het conflict met Spanje moeten schutters hun stad verdedigen → ze laten zich met wapens afbeelden. (2) Door de bloei hebben burgers geld en interesse voor kunst → ze betalen zelf voor schilderijen door beroemde meesters.",K:"(1) Militaire dreiging → bewapende schutters op schilderijen. (2) Welvaart → burgers worden opdrachtgever van topkunstenaars.",B:"(1) 'Met musketten, hellebaarden en pieken' / 'de meesten die zijn afgebeeld zijn onbekend, behalve enige officieren'. (2) 'De schutters hebben de schilderijen zelf betaald' / 'door de belangrijkste meesters gemaakt'."}},
{nr:4,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"Simon Stevin: (1) bij welke ontwikkeling sloot hij WEL aan (met KA), en (2) bij welke ontwikkeling NIET (met KA)? Let op: je moet na elk KA een uitleg geven!",patternExplain:"Twee KA's koppelen = Matchmaker. Let op: zonder uitleg krijg je géén punt!",signals:["kenmerkend aspect","aansloot","niet aansloot"],answer:null,akb:{A:"(1) Stevin sloot aan bij 'het begin van wetenschappelijke belangstelling' → hij deed zelf experimenten. (2) Stevin sloot NIET aan bij 'de heroriëntatie op de klassieke Oudheid' → hij gaf les in het Nederlands, niet in Latijn/Grieks.",K:"(1) Experimenten = wetenschappelijke methode. (2) De klassieke talen waren de standaard voor wetenschap, maar Stevin koos bewust voor het Nederlands.",B:"(1) Stevin gooide kogels van een toren om te testen of ze even snel landen. (2) Stevin gaf lessen in het Nederlands."}},
{nr:5,points:3,context:"britse-rijk",type:"detective",question:"Het portret van Mataoka/Pocahontas (1616). (1) Toon aan dat de tekst past bij de beginfase van Engelse aanwezigheid, en (2) hoe wil de Virginia Company nieuwe kolonisten werven (met bronverwijzing)?",patternExplain:"'Past bij de beginfase' + 'hoe wil men kolonisten werven' = analyse van het portret → Detective. Let op: bij deel 1 gaat het over de TEKST ONDER het portret, niet het jaartal!",signals:["beginfase","werven"],answer:null,akb:{A:"(1) De Engelsen erkennen Powhatan als 'machtige prins' / 'keizer' → ze zijn nog afhankelijk van de inheemse bevolking. (2) Het portret toont dat de inheemse bevolking beschaafd is / dat het leven lucratief is → dit moet nieuwe kolonisten overhalen.",K:"(1) In de beginfase zijn de Engelsen diplomatisch en erkennen ze inheems gezag. (2) Een gedoopte, in Engelse kledij geklede prinses = bewijs dat kolonisatie succesvol is.",B:"(1) Tekst: 'dochter van de machtige prins Powhatan, keizer van Virginia'. (2) 'Bekeerd en gedoopt in het christelijk geloof' / 'vrouw van de waardige heer John Rolfe' / Mataoka in Engelse kledij."}},
{nr:6,points:3,context:"britse-rijk",type:"domino",question:"Edenton 1774: vrouwen boycotten Britse thee. (1) Welk politiek argument tegen belastingen, (2) waardoor kwamen ze onder druk, en (3) hoe past Barkers uitspraak bij natuurlijke rechten?",patternExplain:"Drie deelvragen = meerdere oorzaak-gevolgketens → Domino. Let op: bij deel 3 moet je een UITLEG geven, niet alleen het recht noemen!",signals:["politiek argument","onder druk","natuurlijke rechten"],answer:null,akb:{A:"(1) 'No taxation without representation': geen belasting zonder vertegenwoordiging. (2) Boycotten treffen de Britse economie / inspireren andere kolonisten. (3) Barker gaat uit van het aangeboren recht om te protesteren — ook voor vrouwen.",K:"(1) De kolonisten hadden geen stem in het Britse parlement. (2) Economische druk = effectief wapen. (3) Natuurlijke rechten gelden voor iedereen, ongeacht geslacht.",B:"(3) Barker: 'Dat betekent alleen maar dat vrouwen er te lang over hebben gedaan om hun stem te laten horen' → vrouwen hebben hetzelfde recht als mannen."}},
{nr:7,points:4,context:"vroegmoderne-tijd",type:"detective",question:"Catharina de Grote als verlicht absoluut vorstin. Toon aan met bronverwijzing: (1) haar beleid past bij verlicht denken, en (2) haar beleid past bij absolutisme.",patternExplain:"'Past bij verlicht denken' + 'past bij absolutisme' = twee analyses → Detective. Let op: twee VERSCHILLENDE bronverwijzingen!",signals:["verlicht","absolutisme"],answer:null,akb:{A:"(1) Verlicht: ze wil het welzijn van haar volk verbeteren door wetenschap (variolatie) in te zetten. (2) Absoluut: ze beveelt zonder inspraak dat elke provinciestad woningen moet bouwen.",K:"(1) Rationeel optimisme: wetenschap kan de samenleving verbeteren. (2) Absolutisme: de vorst beslist alleen.",B:"(1) 'De introductie van variolatie tegen de pokken is één van de belangrijkste taken' / 'het bezorgt groot leed onder vooral de gewone mensen'. (2) 'Geef zo snel mogelijk in elke provinciestad bevel' / ze draagt de graaf op dit landelijk door te voeren."}},
{nr:8,points:2,context:"britse-rijk",type:"matchmaker",question:"Het uitgangspunt 'De Koloniën bestaan voor het Moederland'. Toon aan voor twee KA's uit de 19e eeuw dat dit erbij past. Let op: na elk KA een uitleg geven!",patternExplain:"Twee KA's koppelen = Matchmaker. Let op: zonder uitleg géén punt!",signals:["kenmerkende aspecten","past"],answer:null,akb:{A:"(1) Past bij 'de moderne vorm van imperialisme die verband hield met de industrialisatie': de kolonie levert grondstoffen voor de industrie. (2) Past bij 'de opkomst van nationalisme': de kolonie moet Nederland machtiger maken.",K:"(1) Imperialisme = koloniën uitbuiten voor economisch gewin. (2) Nationalisme = trots op het moederland, kolonie is ondergeschikt.",B:"Het rapport: 'De Koloniën bestaan voor het Moederland, en niet het Moederland voor de Koloniën'."}},
{nr:9,points:3,context:"britse-rijk",type:"detective",question:"Mary Prince (1831): het verhaal werd populair. (1) Hoe bevestigde Strickland het superioriteitsgevoel, (2) waarom werd het als betrouwbaar beschouwd, en (3) welke parlementsdiscussie vergrootte de belangstelling?",patternExplain:"'Superioriteitsgevoel' + 'betrouwbaarheid' + 'parlementsdiscussie' = drie analyses → Detective.",signals:["superioriteitsgevoel","betrouwbaar","discussie"],answer:null,akb:{A:"(1) Door te schrijven dat Mary was 'gered' door Britten → de Britten als beschaafd/superieur. (2) De titel benadrukt dat het een autobiografie is ('door haarzelf verteld') → ooggetuigenverslag. (3) De discussie over het verbod op slavernij (1833).",K:"(1) 'Redding' impliceert dat de Britten de morele superioriteit hebben. (2) Autobiografieën worden als betrouwbaarder gezien. (3) Abolitionistische debatten verhoogden de publieke interesse.",B:"(1) 'Gered door Britse abolitionisten'. (2) 'Het verhaal van Mary Prince, door haarzelf verteld'. (3) Het boek verscheen in 1831, twee jaar voor het verbod."}},
{nr:10,points:2,context:"britse-rijk",type:"domino",question:"Het verslag van de fabrieksinspecteur (1836). (1) Welke maatregel in de Factory Acts controleert hij, en (2) waaruit blijkt dat de Factory Acts worden gehandhaafd (met bronverwijzing)?",patternExplain:"'Welke maatregel' + 'waaruit blijkt handhaving' = koppeling + bewijs → Domino.",signals:["welke maatregel","waaruit blijkt"],answer:null,akb:{A:"(1) De Factory Acts beperken de werktijden voor kinderen. (2) De inspecteur controleert fabrieken en dreigt met bestraffing.",K:"(1) Verkorting van werkuren = kern van de Factory Acts. (2) Handhaving: inspecteur + chirurg controleren de naleving.",B:"(2) 'Ik moest dit zeker bestraffen met alle strengheid die in mijn macht lag' / 'de gecertificeerde chirurg was hierbij aanwezig' / hij controleert het logboek."}},
{nr:11,points:2,context:"britse-rijk",type:"detective",question:"Dezelfde bron (verslag 1836): de inspecteur wil de betrouwbaarheid van zijn waarnemingen benadrukken. Noem een manier met bronverwijzing.",patternExplain:"'Hoe benadrukt hij betrouwbaarheid' = je analyseert zijn methode → Detective.",signals:["betrouwbaarheid","benadrukken"],answer:null,akb:{A:"De inspecteur benadrukt betrouwbaarheid door meerdere bronnen te raadplegen / zijn waarnemingen te laten bevestigen.",K:"Triangulatie: dezelfde vraag aan meerdere jongens + logboek + getuige (chirurg).",B:"'Ik stelde iedere jongen dezelfde vragen, en van iedereen kreeg ik dezelfde antwoorden' / hij bekeek het logboek / 'de gecertificeerde chirurg was hierbij aanwezig'."}},
{nr:12,points:3,context:"britse-rijk",type:"domino",question:"De Britse regering volgt Indiase kranten na de opstand van 1857. (1) Verklaar de belangstelling, en (2) verklaar dat juist dit artikel over Hamilton wordt opgenomen (met bronverwijzing).",patternExplain:"'Verklaar de belangstelling' + 'waarom dit artikel' = twee oorzaak-gevolgketens → Domino.",signals:["verklaar","belangstelling"],answer:null,akb:{A:"(1) Na de opstand van 1857 wil de Britse regering onvrede in de gaten houden om een nieuwe opstand te voorkomen. (2) Dit artikel bekritiseert het Britse bestuur openlijk → teken van groeiende onvrede.",K:"(1) Kranten weerspiegelen de publieke opinie → een vroeg waarschuwingssysteem. (2) Directe kritiek op een minister = alarmerend.",B:"(2) 'We zijn verbaasd om zo'n buitengewone uitspraak' / 'duizenden bedelend om brood' / 'zuchten onder steeds meer zware belastingen' / 'waar baseert Lord George Hamilton zijn idee op'."}},
{nr:13,points:4,context:"britse-rijk",type:"detective",question:"De brieven van Kartini (1899). Het koloniaal bestuur en feministen prijzen beide de inhoud. Geef voor beiden apart aan waarom, met telkens een andere bronverwijzing.",patternExplain:"Twee groepen prijzen dezelfde bron om VERSCHILLENDE redenen = Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["waardoor","prijzen"],answer:null,akb:{A:"(1) Het koloniaal bestuur: Kartini toont dat inlandse bestuurders openstaan voor Europese invloeden / dat het Nederlandse bestuur kansen biedt. (2) Feministen: Kartini klaagt de ongelijkheid aan in de opvoeding van jongens en meisjes.",K:"(1) Kartini's familie omarmt de westerse beschaving → propaganda voor het koloniale beleid. (2) Meisjes worden achtergesteld door de adat → feministisch thema.",B:"(1) 'Zijn huis openstelde voor de Westerse beschaving' / broers naar de HBS / broer studeert in Nederland. (2) 'Wij meisjes, geketend als we nog zijn aan oude gebruiken' / 'de adat verbiedt meisjes ten strengste uit hun huis te komen'."}},
{nr:14,points:2,context:"duitsland",type:"tijdreiziger",question:"Lloyd George over Versailles (1922): verandering en continuïteit in zijn mening. (1) Welke afspraak wilde hij aanpassen, en (2) toon aan dat hij niet van mening veranderde over Duitslands rol.",patternExplain:"'Verandering en continuïteit' = je vergelijkt zijn standpunt door de tijd → Tijdreiziger.",signals:["verandering","continuïteit"],answer:null,akb:{A:"Verandering: Lloyd George wilde de herstelbetalingen aanpassen (te hoog). Continuïteit: hij vond nog steeds dat Duitsland moreel verantwoordelijk was voor de oorlog.",K:"Hij verschoof van 'alles betalen' naar 'betalen naar draagkracht', maar bleef bij de schuldvraag.",B:"Lloyd George: 'Duitsland, hoewel het moreel verantwoordelijk is alle kosten te betalen, alleen kan worden verwacht dat het betaalt in verhouding tot zijn capaciteit'."}},
{nr:15,points:3,context:"duitsland",type:"detective",question:"Niederstetten maart 1933: Joodse mannen worden gearresteerd en mishandeld. (1) Waardoor past dit bij een totalitaire samenleving, en (2) toon aan dat de nazificering nog niet volledig is (met bronverwijzing).",patternExplain:"'Past bij totalitair' + 'nog niet volledig genazificeerd' = twee analyses → Detective.",signals:["totalitaire","niet volledig"],answer:null,akb:{A:"(1) Grondrechten worden geschonden / bepaalde groepen worden vervolgd → totalitair. (2) De niet-Joodse bevolking is verontwaardigd → ze hebben de NS-ideologie nog niet geaccepteerd.",K:"(1) Willekeurige arrestaties en mishandeling = kenmerk van dictatuur. (2) Verontwaardiging = bewijs dat de bevolking het geweld niet steunt.",B:"(2) 'De niet-Joodse bevolking was heel verontwaardigd' / een inwoner zei: 'Hitler zou dit zeker hebben afgekeurd'."}},
{nr:16,points:3,context:"duitsland",type:"detective",question:"Hitlers schets van een triomfboog. (1) Bij welk NS-kenmerk past het ontwerp (met bronverwijzing), en (2) waarom kon het tijdens WO2 niet gebouwd worden?",patternExplain:"'Welk kenmerk' + 'waarom niet gebouwd' = analyse + oorzaak-gevolg → Detective + Domino.",signals:["welk kenmerk","niet mogelijk"],answer:null,akb:{A:"(1) Het ontwerp past bij nationalisme/militarisme/propaganda: de enorme boog met 1,8 miljoen namen eert de gevallen soldaten en toont de grootsheid van Duitsland. (2) Tijdens WO2 waren arbeiders nodig voor het leger / materialen schaars / bombardementen maakten bouwen gevaarlijk.",K:"(1) Een gigantische triomfboog = machtsvertoon en propaganda. (2) Oorlog vergt alle beschikbare middelen.",B:"(1) De boog is enorm (mensen rechtsonder tonen de schaal) / de namen van 1,8 miljoen slachtoffers op de muren. (2) Twee wereldoorlogen = verwoestingen op niet eerder vertoonde schaal."}},
{nr:17,points:2,context:"duitsland",type:"domino",question:"In mei 1945 dwongen geallieerden Duitsers om filmbeelden van concentratiekampen te bekijken. Leg de redenering uit.",patternExplain:"'Leg de redenering uit' = oorzaak (beelden zien) → gevolg (denazificering) → Domino.",signals:["redenering","uitleg"],answer:null,akb:{A:"De geallieerden dachten dat Duitsers door de gruwelijkheden te zien afschuw/schuldgevoel zouden voelen → zich afkeren van de NS-ideologie.",K:"Confrontatie met de realiteit = eerste stap naar denazificering.",B:"Filmbeelden uit Buchenwald en Bergen-Belsen werden vertoond aan inwoners van Burgsteinfurt."}},
{nr:18,points:3,context:"nederland",type:"detective",question:"Blokzijl (CPN) over stakingen in Amsterdam (1950). (1) Toon aan dat zijn beschrijving politiek gekleurd is door communistische ideeën (met bronverwijzing), en (2) verklaar het harde politieoptreden met een KA. Let op: na het KA een uitleg geven!",patternExplain:"'Politiek gekleurd' + 'KA voor het harde optreden' = analyse + koppeling → Detective. Let op: 'sociaal-culturele veranderingsprocessen' levert géén punt op!",signals:["politiek gekleurd","kenmerkend aspect"],answer:null,akb:{A:"(1) Blokzijl beschrijft het politieoptreden vanuit een communistisch perspectief: de politie als onderdrukker van arbeiders. (2) KA: 'de verdeling van de wereld in twee ideologische blokken' → angst voor communisme verklaart het harde optreden.",K:"(1) CPN-taal: 'politieterreur', vergelijking met nazi-politie, bescherming van arbeiders. (2) In 1950 is de Koude Oorlog in volle gang → communistische stakingen worden als bedreiging gezien.",B:"(1) 'Politieterreur' / vergelijking met de 'Grüne Polizei' / 'democratisch recht tot staken'. (2) De stakingen zijn in 1950 → begin Koude Oorlog."}},
{nr:19,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gegevens over Duitse deelname aan de Olympische Spelen in chronologische volgorde.",patternExplain:"Zes gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: verzoeningspolitiek/Amsterdam (1928), Berlijn/Hitlergroet (1936), bezettingszones/Londen (1948), Tokyo eigen ploegen (1964), einde détente/boycot Moskou (1980), vlak voor val Muur/Reagan (1989).",signals:["chronologische volgorde","van vroeger naar later"],answer:"1, 5, 4, 2, 6, 3",akb:null},
{nr:20,points:2,context:"nederland",type:"detective",question:"Sprenger (1956) heeft kritiek op een wet. Noem de wet en ondersteun met bronverwijzing.",patternExplain:"'Welke wet' = je analyseert waar zijn kritiek over gaat → Detective.",signals:["welke wet","kritiek"],answer:null,akb:{A:"Sprenger bekritiseert de wet die een einde maakt aan de wettelijke handelingsonbekwaamheid van gehuwde vrouwen.",K:"Hij vindt dat de man het 'primaatschap' in het huwelijk heeft → een gehuwde vrouw hoort zich te onderwerpen.",B:"'De gehuwde vrouw... niet dezelfde vrijheden geniet als haar ongehuwde zuster' / 'het primaatschap van de man in het huwelijk'."}},
{nr:21,points:3,context:"nederland",type:"domino",question:"Eurovisie-quiz (1958) over de EGKS-landen. (1) Hoe draagt dit bij aan Europese eenwording, en (2) welk ander KA uit de 2e helft 20e eeuw illustreer je hiermee? Let op: na het KA een uitleg geven!",patternExplain:"'Bijdragen aan eenwording' + 'welk KA' = oorzaak-gevolg + koppeling → Domino. Let op: zonder uitleg géén punt!",signals:["bijdragen aan","kenmerkend aspect"],answer:null,akb:{A:"(1) Door een quiz over EGKS-landen leren kijkers andere Europese landen kennen → gevoel van verbinding. (2) KA: 'de toenemende westerse welvaart die aanleiding gaf tot sociaal-culturele veranderingsprocessen' → genoeg mensen hadden een TV / vrije tijd om te kijken.",K:"(1) Gedeelde kennis = gedeelde identiteit → eenwording. (2) TV-bezit = teken van welvaart.",B:"'Kent u West-Europa?' / 'een internationale finale met deelnemers uit alle landen van de Kolen- en Staalgemeenschap'."}},
{nr:22,points:2,context:"nederland",type:"domino",question:"Provo won in 1966 een zetel maar hief zichzelf op. Leg uit vanuit hun doelstelling.",patternExplain:"'Leg uit vanuit de doelstelling' = oorzaak (deelname aan gezag) → gevolg (zelfopheffing) → Domino.",signals:["doelstelling","opheffen"],answer:null,akb:{A:"Provo wilde het gezag provoceren, maar door in de gemeenteraad te zitten werden ze zelf onderdeel van het gezag → ze zouden zichzelf moeten provoceren.",K:"De paradox: je kunt het systeem niet bestrijden als je er deel van uitmaakt.",B:"Provo won in 1966 één zetel in de Amsterdamse gemeenteraad, maar hief een jaar later zichzelf op."}},
{nr:23,points:3,context:"duitsland",type:"domino",question:"De Stasi kocht een West-Duits parlementslid om om Brandt te steunen (1972). (1) Welk politiek belang had de DDR bij Brandt als kanselier, en (2) waardoor werd dit na 1989 bekend?",patternExplain:"'Welk belang' + 'waardoor bekend' = twee oorzaak-gevolgketens → Domino.",signals:["welk belang","waardoor bekend"],answer:null,akb:{A:"(1) Brandt verbeterde de relatie BRD-DDR via de Ostpolitik → de DDR wilde dit behouden. (2) Na de val van het communisme werden de Stasi-archieven openbaar.",K:"(1) Ostpolitik = erkenning van de DDR / verbetering van positie. (2) Hereniging = toegang tot geheime dossiers.",B:"(1) 'De regering van de DDR wilde er zo voor zorgen dat Brandt kanselier bleef'. (2) 'Na 1989 werd bekend dat de Staatssicherheitsdienst het parlementslid had omgekocht'."}},
{nr:24,points:3,context:"duitsland",type:"detective",question:"De prent van Schoenfeld (1988): 'Oost-Europees konvooi'. (1) Noem de kern van perestrojka, en (2) toon aan dat de tekenaar perestrojka ondersteunt (met bronverwijzing).",patternExplain:"'Kern van perestrojka' + 'ondersteunt perestrojka' = analyse van de prent → Detective.",signals:["kern","ondersteunt"],answer:null,akb:{A:"(1) Perestrojka = economische en politieke hervormingen in de Sovjet-Unie. (2) De tekenaar laat zien dat perestrojka vooruitgang brengt (het schip breekt het ijs) terwijl landen die het afwijzen vastzitten.",K:"(1) Herstructurering van het communistische systeem. (2) IJsbreker = vooruitgang, vastgevroren schepen = stilstand.",B:"(2) Het schip 'PERESTROJKA' breekt het ijs en vaart vrij / Polen en Hongarije varen in het kielzog mee / de DDR, Roemenië en CSSR zitten vastgevroren in het ijs."}},
{nr:25,points:2,context:"nederland",type:"domino",question:"Het eerste homohuwelijk (2001). (1) Waarvoor komt de internationale pers, en (2) hoe draagt het media-evenement bij aan het idee dat Nederland een gidsland is?",patternExplain:"'Waarvoor' + 'hoe draagt bij aan gidsland' = oorzaak-gevolg → Domino.",signals:["waarvoor","bijdraagt aan"],answer:null,akb:{A:"(1) De pers komt voor de eerste huwelijkssluiting tussen mensen van hetzelfde geslacht. (2) Door de internationale berichtgeving kan Nederland als voorbeeld dienen voor andere landen.",K:"(1) Nederland was het eerste land ter wereld. (2) Gidsland = een land dat anderen de weg wijst.",B:"'Honderd journalisten, vijftien cameraploegen' uit binnen- en buitenland / 'vier hele blije echtparen' / het evenement had 'tot doel een boodschap te verspreiden'."}}
]};

const EXAM_2025_T2 = {id:"2025t2",name:"2025 Tijdvak 2",date:"19 juni 2025",questions:[
{nr:1,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen over papegaaien in de juiste chronologische volgorde.",patternExplain:"Zes papegaai-gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: Columbus (eind 15e eeuw), graaf Floris I/Spaans godsdienstbeleid (16e eeuw), koningin Victoria (19e eeuw), WO1/Eiffeltoren (1914-1918), voor Duitsers gevlucht naar Engeland (WO2), Molukkers na onafhankelijkheid Indonesië (na 1949).",signals:["chronologische volgorde","van vroeger naar later"],answer:"2, 1, 5, 6, 3, 4",akb:null},
{nr:2,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"De mening van Cincius Romanus over de bibliotheek van Sankt Gallen (1416). Toon aan voor twee KA's van de 16e eeuw. Let op: na elk KA een uitleg geven!",patternExplain:"Twee KA's koppelen = Matchmaker. Let op: zonder uitleg géén punt!",signals:["kenmerkende aspecten","toon aan"],answer:null,akb:{A:"(1) Past bij 'de hernieuwde oriëntatie op het klassieke erfgoed': hij is bedroefd dat Latijnse boeken verwaarloosd worden. (2) Past bij 'het begin van een nieuwe wetenschappelijke belangstelling': hij onderzoekt de bibliotheek en wil de boeken bewaren.",K:"(1) Liefde voor de Latijnse taal = heroriëntatie op de Oudheid. (2) Systematisch onderzoek van een bibliotheek = wetenschappelijke belangstelling.",B:"(1) 'De Latijnse taal had zijn grootse glorie verloren' / 'jullie die de Latijnse taal zo liefhebben'. (2) 'Toen we de toren zorgvuldig bestudeerden' / hij wil dat de boeken gered worden van verwaarlozing."}},
{nr:3,points:2,context:"vroegmoderne-tijd",type:"domino",question:"Schoolmeester Paesschen gebruikte in 1557 een boek van Luther in Groningen. Het stadsbestuur verbande hem. Beredeneer waarom het stadsbestuur onrust verwachtte.",patternExplain:"'Beredeneer waarom' = oorzaak (Luthers boek) → gevolg (onrust) → Domino.",signals:["beredeneer","onrust"],answer:null,akb:{A:"Luther was de aanstichter van de reformatie → het stadsbestuur vreesde dat het gebruik van zijn boek op school zou leiden tot protest van katholieken of bestraffing door het landsbestuur/de katholieke kerk.",K:"De reformatie was een explosief thema → een boek van Luther op een school kon voor religieuze spanningen zorgen.",B:"Het stadsbestuur verbood het boek en verbande Paesschen 'om onrust te voorkomen'."}},
{nr:4,points:2,context:"vroegmoderne-tijd",type:"matchmaker",question:"Twee gebeurtenissen: (1) Filips II sluit Portugese havens (1580), (2) Amsterdamse kooplieden sturen Houtman (1592). Geef per gebeurtenis een verklaring met een VERSCHILLEND KA. Na elk KA een uitleg!",patternExplain:"Per gebeurtenis een ander KA koppelen = Matchmaker. Let op: zonder uitleg géén punt!",signals:["kenmerkend aspect","verklaring"],answer:null,akb:{A:"(1) KA: 'het conflict in de Nederlanden dat resulteerde in de stichting van een Nederlandse staat' → Filips II wil de handel van de opstandige Nederlanden schaden. (2) KA: 'het begin van de Europese overzeese expansie' → de Amsterdammers willen zelf de zeeroute naar India ontdekken.",K:"(1) Economische oorlogsvoering: havens sluiten als straf. (2) Als Portugese havens dicht zijn, moeten ze zelf de weg vinden.",B:"(1) Portugal wordt in 1580 bij Spanje gevoegd → schepen uit de Republiek mogen niet meer in Portugese havens. (2) De gebroeders Houtman moeten de Carreira da Índia onderzoeken."}},
{nr:5,points:2,context:"vroegmoderne-tijd",type:"detective",question:"De brief van Pieter Schaghen (1626) over Nieuw-Nederland. Toon aan dat de kolonisten beide opdrachten uitvoeren: (1) vestigingskolonie, (2) geen conflicten met oorspronkelijke bevolking.",patternExplain:"'Toon aan uit de bron' = bronanalyse → Detective.",signals:["toon aan","blijkt"],answer:null,akb:{A:"(1) De kolonisten hebben gezinnen en verbouwen gewassen → vestigingskolonie. (2) Ze hebben Manhattan gekocht (niet afgepakt) en leven in vrede → geen conflicten.",K:"(1) Kinderen + landbouw = permanent verblijf. (2) Kopen = vreedzame transactie.",B:"(1) 'De vrouwen hebben daar kinderen gebaard' / 'er is koren gezaaid in mei en gemaaid in augustus'. (2) 'Het eiland Manhattan van de wilden gekocht voor 60 gulden' / 'het volk leeft in vrede'."}},
{nr:6,points:2,context:"vroegmoderne-tijd",type:"detective",question:"Pieter Schaghen is tevreden met de kolonie. Verklaar vanuit zijn functie als WIC-bestuurder, met bronverwijzing. Let op: het gaat om HANDEL, niet vestiging!",patternExplain:"'Verklaar vanuit zijn functie' = je analyseert zijn belang → Detective. Let op: als je alleen ingaat op vestigingskolonie → géén punten!",signals:["verklaar","functie"],answer:null,akb:{A:"Als WIC-bestuurder is Schaghen blij dat de kolonie winstgevend lijkt: het schip brengt handelsproducten mee.",K:"De WIC is een handelsorganisatie → winst en handel zijn hun belang, niet het vestigen van gezinnen.",B:"'De lading van het schip is: 7246 bevervellen, 675 ottervellen, 48 nertsvellen' / ook graan wordt meegebracht."}},
{nr:7,points:4,context:"britse-rijk",type:"domino",question:"Medaille voor inheemse soldaten in India (1784). (1) Waarom behoefte aan een leger na 1765 (noem de gebeurtenis), (2) welke boodschap door het uitreiken, en (3) welke boodschap met de afbeelding?",patternExplain:"Drie deelvragen = drie oorzaak-gevolg/analyse → Domino. Let op: bij deel 1 MOET je de gebeurtenis van 1765 noemen!",signals:["waarom","boodschap","afbeelding"],answer:null,akb:{A:"(1) In 1765 sluit de EIC het verdrag van Allahabad → het besturen van India vereist een leger. (2) De Britten waarderen de bijdrage van inheemse soldaten. (3) De Britten laten zien dat ze India hebben onderworpen.",K:"(1) Na Allahabad moet de EIC belasting innen en besturen → militaire bescherming nodig. (2) De medaille als beloning motiveert soldaten. (3) Brittannia met lauwerkrans + Britse vlag op fort = macht en overwinning.",B:"(3) Brittannia houdt een lauwerkrans omhoog / op de achtergrond een Indiaas fort met de Union Jack."}},
{nr:8,points:3,context:"britse-rijk",type:"detective",question:"Wädstrom schrijft over een Afrikaanse koning die slaventransport verbiedt (1787). (1) Hoe steunt dit de abolitionistische beweging (met bronverwijzing), en (2) welk niet-abolitionistisch motief had de koning mogelijk?",patternExplain:"'Hoe steunt dit abolitionisme' + 'welk ander motief' = analyse → Detective.",signals:["abolitionistische","motief"],answer:null,akb:{A:"(1) Wädstrom laat zien dat abolitionisme ook in Afrika successen boekt: een koning verbiedt slaventransport en laat zich niet omkopen. (2) De koning wilde mogelijk zelf de controle over de (slaven)handel in zijn rijk houden.",K:"(1) Propaganda: kijk, zelfs een Afrikaanse koning stopt de slavenhandel! (2) Machts- of economisch motief: de route blokkeren voor buitenlandse handelaren.",B:"(1) 'Een wet die hem tot eer strekte' / 'alle rijkdommen van de Compagnie hem niet van gedachte zouden doen veranderen'. (2) 'De route van de handelaren was door deze wet geblokkeerd' → de koning bepaalt wie er door zijn rijk mag handelen."}},
{nr:9,points:4,context:"vroegmoderne-tijd",type:"detective",question:"De oproep van Daendels (1794). Toon aan dat het past bij: (1) 'verlicht denken toegepast op sociale verhoudingen', en (2) 'democratische revoluties'. Telkens met een andere bronverwijzing.",patternExplain:"Twee KA's met bewijs uit de bron = Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["past bij","kenmerkend aspect"],answer:null,akb:{A:"(1) Daendels wijst de standensamenleving af: kies kapiteins niet op basis van rijkdom maar op vechtkunst. (2) Daendels roept op tot een democratische omwenteling: Oranje en zijn 'vergulde knechten' moeten het land uit.",K:"(1) Verlicht: gelijkheid, geen standenprivileges. (2) Democratisch: het volk neemt de macht over van de aristocratie.",B:"(1) 'Kies niet de rijkste, die mooi gekleed zijn of het best uit hun woorden komen, maar kies diegenen die het beste kunnen vechten'. (2) 'Totdat Oranje met zijn vergulde knechten het land uit is'."}},
{nr:10,points:3,context:"britse-rijk",type:"domino",question:"Stoommachine voor suikerriet op de wereldtentoonstelling 1851. (1) Verklaar de interesse vanuit een Brits besluit uit 1833, en (2) welke boodschap moest de tentoonstelling overbrengen?",patternExplain:"'Verklaar de interesse' + 'welke boodschap' = twee oorzaak-gevolgketens → Domino.",signals:["verklaar","boodschap"],answer:null,akb:{A:"(1) Door de afschaffing van slavernij (1833) was er behoefte aan machines die het werk konden overnemen. (2) De Britse machine toonde dat Groot-Brittannië de werkplaats van de wereld was.",K:"(1) Geen slaafgemaakten meer → machines moeten het werk doen op suikerplantages. (2) Nationale trots: Britse technologische superioriteit.",B:"(1) Stoommachine waarmee suikerriet geperst kon worden. (2) Het was een Brits bedrijf (Robinson and Russel) op een Britse wereldtentoonstelling."}},
{nr:11,points:3,context:"britse-rijk",type:"domino",question:"In 1857 laat de Britse overheid speciale rivierenschepen bouwen voor India. (1) Verklaar waarom juist in 1857, en (2) bij welk KA past het ontwerp? Na het KA een uitleg geven!",patternExplain:"'Waarom juist in 1857' + 'welk KA' = oorzaak-gevolg + koppeling → Domino. Let op: zonder uitleg géén punt bij het KA!",signals:["verklaar","kenmerkend aspect"],answer:null,akb:{A:"(1) In 1857 vindt er een opstand plaats in India → de Britten hebben schepen nodig om snel soldaten te vervoeren. (2) KA: 'de moderne vorm van imperialisme die verband hield met de industrialisatie' → met deze schepen kunnen de Britten hun grip op de kolonie beschermen.",K:"(1) De Sepoy-opstand maakte duidelijk dat het Britse leger snel moest kunnen reageren. (2) Stoomschepen = industriële technologie in dienst van imperialisme.",B:"Bron: een groot stoomschip met platte bodem, twee schoorstenen, meerdere dekken, geschikt voor riviervaart."}},
{nr:12,points:3,context:"nederland",type:"detective",question:"Dominee Hoedemaker over fabriekskinderen (1875). (1) Toon aan dat hij bijdraagt aan 'de sociale kwestie' (met bronverwijzing), en (2) noem zijn politiek-maatschappelijke stroming.",patternExplain:"'Toon aan' + 'noem de stroming' = analyse + koppeling → Detective.",signals:["sociale kwestie","stroming"],answer:null,akb:{A:"(1) Hoedemaker laat zien dat kinderarbeid slecht is voor kinderen → bijdrage aan de sociale kwestie. (2) Zijn stroming is het confessionalisme (hij is dominee en geeft godsdienstlessen).",K:"(1) De sociale kwestie gaat over de slechte omstandigheden van arbeiders. (2) Confessionalisme: politiek op basis van geloof.",B:"(1) 'Bleke, ingevallen, verouderde gelaatstrekken van de jongens en meisjes' / 'het getrappel van kleine voetjes' in de vroege ochtend / kinderen 'slapende uit bed getild'. (2) Dominee + godsdienstlessen = confessioneel."}},
{nr:13,points:2,context:"britse-rijk",type:"detective",question:"Een Brits lied (1895) over koloniale politiek in Afrika. Welke kritiek geeft het lied weer op het idee dat de Britten de wereld moesten beschaven (met bronverwijzing)?",patternExplain:"'Welke kritiek' = je analyseert de boodschap → Detective.",signals:["welke kritiek"],answer:null,akb:{A:"De kritiek is dat de Britten doen alsof ze geloof/beschaving brengen, maar in feite met geweld Afrika onderwerpen voor handel en macht.",K:"De tegenstelling: kerkboek in de zak, maar geweer in de hand = hypocrisie.",B:"'Kerkboek in je zakken, 't geweer klaar in je hand' / 'verbreid het vreedzaam evangelie — met een Maximgeweer'."}},
{nr:14,points:2,context:"duitsland",type:"domino",question:"De Vrijkorpsen (Freikorps) na WO1. Noem twee oorzaken voor de zwakke positie van de Weimarregering uit deze geschiedenis.",patternExplain:"'Twee oorzaken' = twee keer oorzaak-gevolg → Domino.",signals:["oorzaken","zwakke positie"],answer:null,akb:{A:"Twee van: (1) Gewapende groepen kwamen in opstand tegen de regering. (2) De legerleiding weigerde de opstand neer te slaan → de regering kon niet op het leger rekenen. (3) De regering moest paramilitaire organisaties gebruiken voor ordehandhaving. (4) 350.000 ex-soldaten vormden paramilitaire eenheden waarop de regering weinig grip had.",K:"De Weimarrepubliek was kwetsbaar: bedreigd van rechts (Vrijkorpsen) en niet gesteund door het eigen leger.",B:"'De Duitse legerleiding weigerde de opstand neer te slaan' / '350.000 Duitse soldaten sloten zich aan bij Freikorps' / de regering zette ze eerst in maar kon ze niet onder controle houden."}},
{nr:15,points:3,context:"duitsland",type:"detective",question:"De Freiburger Zeitung over verkiezingsdag 1936. (1) Waarom kun je twijfelen aan betrouwbaarheid van Duitse kranten in die tijd, maar (2) toon aan dat de beschrijving wel een waarheidsgetrouw beeld geeft van verkiezingen in een totalitaire staat (met bronverwijzing).",patternExplain:"'Twijfelen aan betrouwbaarheid' + 'toch waarheidsgetrouw' = twee analyses → Detective.",signals:["betrouwbaarheid","waarheidsgetrouw"],answer:null,akb:{A:"(1) Kranten werden gecensureerd / geschreven in opdracht van het NS-regime. (2) Toch klopt het beeld: alles wordt gecontroleerd, mensen worden aangespoord op één partij te stemmen.",K:"(1) Persvrijheid bestond niet → inhoud is propaganda. (2) Maar propaganda kan onbedoeld het totalitaire karakter blootleggen.",B:"(2) 'De nazigelederen zijn overal aanwezig en doen een beroep op plicht en geweten' / 'marsmuziek door met vlaggen versierde straten' / woorden van Hitler hangen in stembureaus / 'Berlijners werden vroeg uit bed getrommeld'."}},
{nr:16,points:2,context:"door-de-tijd-heen",type:"tijdlijn",question:"Zet deze gebeurtenissen uit het leven van Konrad Adenauer in chronologische volgorde.",patternExplain:"Zes gebeurtenissen ordenen = Tijdlijn-Bouwer. Ankerpunten: WO1/worst (1914-1918), verzoeningspolitiek/Rijnland (jaren '20), beurskrach/bijbanen (1929-1930), hakenkruisvlaggen/Hitler bezoek (1933), aanslag op Hitler (1944), Britse bezettingszone/puin (1945).",signals:["chronologische volgorde","van vroeger naar later"],answer:"6, 2, 5, 1, 4, 3",akb:null},
{nr:17,points:2,context:"nederland",type:"domino",question:"Rie Stroek-Wagenmakers over de bank in de jaren '50: ze had toestemming van haar man nodig. Dit vindt na 1956 niet meer plaats. Welke wet en wat wilde die veranderen (met bronverwijzing)?",patternExplain:"'Welke wet' + 'wat verandert er' = oorzaak (wet) → gevolg (gelijke rechten) → Domino.",signals:["welke wet","veranderen"],answer:null,akb:{A:"De wet die een einde maakte aan de wettelijke handelingsonbekwaamheid van gehuwde vrouwen → vrouwen hoefden geen toestemming meer te vragen voor financiële zaken.",K:"Vóór 1956: gehuwde vrouwen waren juridisch handelingsonbekwaam. Na 1956: zelfstandig financieel handelen.",B:"'Waar is de toestemming van uw man?' / Rie moest zelf een machtiging schrijven om geld op te nemen."}},
{nr:18,points:4,context:"duitsland",type:"detective",question:"Christel Dux over Oost-Berlijn (1957). Toon aan: (1) een motief voor de bouw van de Berlijnse Muur (met bronverwijzing), en (2) verklaar dat er altijd twee grenswachten tegelijk werken (met bronverwijzing). Let op: NIET ingaan op vluchten!",patternExplain:"Twee conclusies met bewijs uit de bron = Detective. Let op: bij deel 1 gaat het om het voorkomen van contact met westerse ideeën, NIET om vluchten!",signals:["motief","verklaren"],answer:null,akb:{A:"(1) De Muur moet voorkomen dat DDR-burgers in aanraking komen met westerse ideeën/media. (2) Twee grenswachten zodat ze elkaar controleren → geen overtredingen door de vingers zien.",K:"(1) Westerse tijdschriften = ideologisch gevaar. (2) Onderlinge controle = strengere handhaving.",B:"(1) De vader smokkelt West-Duitse Stern-tijdschriften / de familie bezoekt regelmatig West-Berlijn. (2) De ene grenswachter die alleen werkt laat de familie gaan ondanks het vinden van de tijdschriften → als er twee waren geweest, had dat niet gekund."}},
{nr:19,points:2,context:"nederland",type:"domino",question:"De Volkskrant schrapte in 1965 de ondertitel 'Katholiek dagblad voor Nederland'. Bij welke maatschappelijke verandering past dit?",patternExplain:"'Bij welke verandering past dit' = oorzaak (ontzuiling) → gevolg (ondertitel weg) → Domino.",signals:["welke verandering","past"],answer:null,akb:{A:"Dit past bij de ontzuiling/secularisatie: de Volkskrant wilde ook niet-katholieke lezers bereiken omdat de zuilen aan het verdwijnen waren.",K:"Ontzuiling = het loslaten van de band tussen maatschappelijke organisaties en religieuze/politieke zuilen.",B:"De ondertitel 'Katholiek dagblad voor Nederland' werd in 1965 geschrapt."}},
{nr:20,points:4,context:"duitsland",type:"detective",question:"Open brief van de SED (1967) aan de BRD-bevolking. (1) Welk beleid van Stalin droeg bij aan de deling (zonder bron), (2) toon aan dat de SED een communistische visie geeft (met bronverwijzing), en (3) leg het verband uit met de Ostpolitik van Brandt (met bronverwijzing).",patternExplain:"Drie deelvragen = complexe analyse → Detective. Let op: drie VERSCHILLENDE elementen!",signals:["eenzijdig","communistische visie","Ostpolitik"],answer:null,akb:{A:"(1) Stalin installeerde een communistisch regime in Oost-Duitsland. (2) De SED beweert dat de deling veroorzaakt is door 'het imperialisme' en dat hereniging alleen mogelijk is als het Westen ook socialistisch wordt. (3) Brandt wilde met de Ostpolitik de relatie verbeteren zodat de SED niet langer oproept tot strijd in de BRD.",K:"(1) Stalin → communistisch Oost-Duitsland → deling. (2) De SED geeft het Westen de schuld. (3) Brandt zocht toenadering om de spanningen te verminderen.",B:"(2) 'De imperialisten hebben Duitsland in tweeën gedeeld' / 'het imperialisme verslaan' / 'het socialisme vestigen'. (3) 'De West-Duitse arbeiders moeten hun macht doen gelden' → de SED roept op tot omverwerping → Brandt wil dit kalmeren via Ostpolitik."}},
{nr:21,points:4,context:"nederland",type:"detective",question:"Advertentie van uitzendbureau Studia (1970). (1) Welke kritiek zouden feministen van de tweede golf hebben (met bronverwijzing), en (2) hoe verklaart economische groei het succes van Studia (met bronverwijzing)?",patternExplain:"Twee beweringen ondersteunen = Detective. Let op: VERSCHILLENDE bronverwijzingen!",signals:["kritiek","feministen","economische groei"],answer:null,akb:{A:"(1) Feministen: Studia bevestigt de traditionele rolverhouding — vrouwen als moeder, tijdelijk werkend, aanvullend budget. (2) Door economische groei is er een tekort aan arbeidskrachten → Studia probeert moeders in te zetten.",K:"(1) Tweede-golffeminisme wil gelijke positie op de arbeidsmarkt. (2) Krapte op de arbeidsmarkt = kansen voor uitzendbureaus.",B:"(1) 'MOEDER' als aanhef / 'maar voor een paar weken' / 'uw huishoud- of vakantiebudget aanvullen'. (2) Studia biedt crèche + uitzendwerk → probeert moeders te laten deelnemen aan het arbeidsproces."}},
{nr:22,points:2,context:"nederland",type:"domino",question:"CDA-rapport (1983) over burgers die te veel van de overheid verwachten. Welke beleidsmaatregel van Lubbers werd hiermee ondersteund (met verwijzing naar het rapport)?",patternExplain:"'Welke beleidsmaatregel' = oorzaak (rapport) → gevolg (bezuinigingen) → Domino.",signals:["welke beleidsmaatregel"],answer:null,akb:{A:"Het rapport ondersteunde bezuinigingen op uitkeringen/het beperken van de verzorgingsstaat.",K:"Het CDA vond dat burgers te afhankelijk waren geworden van de overheid → eigen verantwoordelijkheid nemen.",B:"'In plaats van voor elkaar te zorgen, gaan burgers er steeds meer vanuit dat de overheid die verantwoordelijkheid overneemt'."}},
{nr:23,points:2,context:"nederland",type:"domino",question:"In 1984 besloot de regering dat kinderen van migranten les kregen in hun eigen taal. Bij welk migrantenbeleid paste dit?",patternExplain:"'Bij welk beleid past dit' = koppeling → Domino.",signals:["welk beleid","paste"],answer:null,akb:{A:"Dit paste bij het multiculturalisme: mensen met een migratieachtergrond konden binnen het Nederlandse onderwijs hun eigen cultuur behouden.",K:"Multiculturalisme = de overheid faciliteert het behoud van culturele identiteit.",B:"'Leerlingen van niet-Nederlandse afkomst' kregen les in 'hun eigen taal, zoals het Turks, Marokkaans, Italiaans, Grieks en Moluks'."}},
{nr:24,points:2,context:"duitsland",type:"detective",question:"Prent van Stuttmann (1995): slang (West) slikt egel (Oost) in. Welke mening over de integratie, met bronverwijzing?",patternExplain:"'Welke mening' = je analyseert de boodschap → Detective.",signals:["welke mening"],answer:null,akb:{A:"De tekenaar toont dat de integratie van de DDR problemen veroorzaakt voor de BRD — de stekels van de egel prikken van binnenuit.",K:"Het Westen dacht de DDR makkelijk te kunnen 'opslokken', maar krijgt nu last van de gevolgen.",B:"In het derde paneel ligt de slang (West) met pijn op de grond — de stekels van de egel (Oost) prikken van binnenuit / ondertitel: 'Op de dag van de Duitse eenheid'."}},
{nr:25,points:2,context:"nederland",type:"domino",question:"De diamant van Banjarmasin (1859) werd tentoongesteld in het Rijksmuseum. (1) Verklaar met een KA uit de 19e eeuw, en (2) welke politieke boodschap? Na het KA een uitleg!",patternExplain:"'Verklaar met KA' + 'welke boodschap' = koppeling + oorzaak-gevolg → Domino. Let op: zonder uitleg géén punt!",signals:["kenmerkend aspect","boodschap"],answer:null,akb:{A:"(1) KA: 'de moderne vorm van imperialisme' of 'de opkomst van nationalisme' → trots op de koloniale macht. (2) De boodschap: Nederland was succesvol in de onderwerping van Banjarmasin.",K:"(1) Imperialisme/nationalisme = trots tonen op veroveringen. (2) De diamant als 'geschiedkundig gedenkteken van de onderwerping'.",B:"De diamant werd tentoongesteld als 'een geschiedkundig gedenkteken van de onderwerping van Banjarmasin'."}},
{nr:26,points:2,context:"nederland",type:"domino",question:"In 2017 plaatste het Rijksmuseum bij de diamant de tekst: 'Deze diamant is oorlogsbuit.' Verklaar met een KA uit de 20e eeuw, en wat wilde het museum bereiken? Na het KA een uitleg!",patternExplain:"'Verklaar met KA' + 'wat wilde het museum' = koppeling + oorzaak-gevolg → Domino. Let op: zonder uitleg géén punt!",signals:["kenmerkend aspect","bereiken"],answer:null,akb:{A:"(1) KA: 'de ontwikkeling van multiculturele en pluriforme samenlevingen' of 'de dekolonisatie' → groeiende kritiek op het koloniale verleden. (2) Het museum wilde het publiek bewust maken van de koloniale oorsprong van de diamant.",K:"(1) Na dekolonisatie en in een multiculturele samenleving wordt het koloniale verleden kritisch bekeken. (2) 'Oorlogsbuit' is een bewuste keuze om eerlijk te zijn over de herkomst.",B:"De tekst: 'Deze diamant is oorlogsbuit. Ooit was hij eigendom van Panembahan Adam, de sultan van Banjarmasin'."}}
]};

const CONTEXT_LABELS = {
  "door-de-tijd-heen": { label: "Door de tijd heen", emoji: "🕐" },
  "vroegmoderne-tijd": { label: "Vroegmoderne tijd", emoji: "📜" },
  "britse-rijk": { label: "Britse Rijk", emoji: "🇬🇧" },

};

const ExamModule = () => {
  const [selectedExam, setSelectedExam] = useState(null);
  const [expandedQ, setExpandedQ] = useState(null);
  const [filter, setFilter] = useState("alle");

  const patternMeta = {

    matchmaker: { emoji: "🧩", name: "Matchmaker", color: "#7a8abf" },

    tijdreiziger: { emoji: "⏳", name: "Tijdreiziger", color: "#5aaa7a" },
    wetenschapper: { emoji: "🔬", name: "Wetenschapper", color: "#6ba8c4" },
  };

  if (!selectedExam) {
    return (
      <div>
        <div style={{ fontSize: 14, color: MC.text, fontFamily: mcFont, lineHeight: 1.7, marginBottom: 16, textAlign: "center" }}>
          Bekijk alle examenvragen met patroonherkenning en uitgewerkte AKB-antwoorden.
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {ALL_EXAMS.map(exam => (
            <button key={exam.id} onClick={() => setSelectedExam(exam)} style={{
              padding: 16, border: `2px solid ${MC.stoneDark}`, background: MC.bedrockLight,
              cursor: "pointer", textAlign: "left", fontFamily: mcFont,
            }}>
              <div style={{ fontSize: 16, fontWeight: 900, color: MC.text, marginBottom: 4 }}>
                📝 {exam.name}
              </div>
              <div style={{ fontSize: 12, color: MC.textDim }}>
                {exam.date} — {exam.questions.length} vragen
              </div>
            </button>
          ))}
          <div style={{ padding: 12, background: MC.bedrock, border: `2px solid ${MC.stoneDark}`, textAlign: "center" }}>
            <div style={{ fontSize: 13, color: MC.textDark, fontFamily: mcFont }}>
              📊 {ALL_EXAMS.length} examens — {ALL_EXAMS.reduce((sum, e) => sum + e.questions.length, 0)} vragen
            </div>
          </div>
        </div>
      </div>
    );
  }

  const exam = selectedExam;
  const contexts = [...new Set(exam.questions.map(q => q.context))];
  const filtered = filter === "alle" ? exam.questions : exam.questions.filter(q => q.context === filter);

  // Highlight signal words in question text
  const highlightSignals = (text, signals, color) => {
    if (!signals || signals.length === 0) return text;
    let result = text;
    const parts = [];
    let lastIdx = 0;
    const lower = result.toLowerCase();
    
    const positions = [];
    signals.forEach(sig => {
      const sigLow = sig.toLowerCase();
      let idx = lower.indexOf(sigLow);
      while (idx !== -1) {
        positions.push({ start: idx, end: idx + sig.length, sig });
        idx = lower.indexOf(sigLow, idx + 1);
      }
    });
    positions.sort((a, b) => a.start - b.start);
    
    // Remove overlaps
    const cleaned = [];
    let lastEnd = 0;
    for (const p of positions) {
      if (p.start >= lastEnd) {
        cleaned.push(p);
        lastEnd = p.end;
      }
    }

    if (cleaned.length === 0) return text;
    
    const elements = [];
    let cursor = 0;
    cleaned.forEach((p, i) => {
      if (p.start > cursor) elements.push(result.substring(cursor, p.start));
      elements.push({ marked: result.substring(p.start, p.end), color });
      cursor = p.end;
    });
    if (cursor < result.length) elements.push(result.substring(cursor));
    
    return elements;
  };

  return (
    <div>
      <button onClick={() => { setSelectedExam(null); setFilter("alle"); setExpandedQ(null); }} style={{
        background: "none", border: "none", color: MC.textDim, fontSize: 13,

      <div style={{ fontSize: 18, fontWeight: 900, color: MC.text, fontFamily: mcFont, marginBottom: 4 }}>

      </div>
      <div style={{ fontSize: 12, color: MC.textDim, fontFamily: mcFont, marginBottom: 16 }}>

      {/* Context filter */}
      <div style={{ display: "flex", gap: 4, marginBottom: 16, flexWrap: "wrap" }}>
        <button onClick={() => setFilter("alle")} style={{
          padding: "6px 12px", border: `2px solid ${filter === "alle" ? MC.gold : MC.stoneDark}`,
          background: filter === "alle" ? MC.bedrockLight : MC.bedrock,
          color: filter === "alle" ? MC.gold : MC.textDim,
          fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: mcFont,
        }}>Alle</button>
        {contexts.map(ctx => {
          const c = CONTEXT_LABELS[ctx] || { label: ctx, emoji: "" };
          return (
            <button key={ctx} onClick={() => setFilter(ctx)} style={{
              padding: "6px 10px", border: `2px solid ${filter === ctx ? MC.gold : MC.stoneDark}`,
              background: filter === ctx ? MC.bedrockLight : MC.bedrock,
              color: filter === ctx ? MC.gold : MC.textDim,
              fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: mcFont,
            }}>{c.emoji} {c.label}</button>
          );
        })}
      </div>

      {/* Questions */}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {filtered.map(q => {
          const isOpen = expandedQ === q.nr;
          const pm = patternMeta[q.type] || { emoji: "❓", name: q.type, color: MC.textDim };
          const ctxInfo = CONTEXT_LABELS[q.context] || { label: q.context, emoji: "" };

          return (
            <div key={q.nr} style={{
              border: `2px solid ${isOpen ? pm.color : MC.stoneDark}`,
              background: MC.bedrockLight,
            }}>
              {/* Header */}
              <div onClick={() => setExpandedQ(isOpen ? null : q.nr)} style={{
                padding: "12px 14px", cursor: "pointer",
                display: "flex", alignItems: "center", gap: 10,
              }}>
                <div style={{
                  minWidth: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center",
                  background: pm.color + "33", border: `2px solid ${pm.color}`,
                  fontSize: 16,
                }}>{pm.emoji}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: MC.text, fontFamily: mcFont }}>
                    Vraag {q.nr} <span style={{ fontSize: 11, color: MC.textDim, fontWeight: 400 }}>({q.points}p)</span>
                  </div>
                  <div style={{ fontSize: 11, color: MC.textDim, fontFamily: mcFont }}>
                    {ctxInfo.emoji} {ctxInfo.label} — {pm.name}
                  </div>
                </div>
                <div style={{ fontSize: 12, color: MC.textDim }}>{isOpen ? "▲" : "▼"}</div>
              </div>

              {/* Expanded */}
              {isOpen && (
                <div style={{ padding: "0 14px 14px 14px" }}>
                  {/* Question with highlighted signals */}
                  <div style={{
                    padding: 12, background: MC.bedrock, border: `2px solid ${MC.stoneDark}`, marginBottom: 10,
                  }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: MC.textDark, fontFamily: mcFont, marginBottom: 6, letterSpacing: 1 }}>
                      DE VRAAG:
                    </div>
                    <div style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
                      {(() => {
                        const parts = highlightSignals(q.question, q.signals, pm.color);
                        if (typeof parts === "string") return parts;
                        return parts.map((p, i) =>
                          typeof p === "string" ? <span key={i}>{p}</span> :
                          <span key={i} style={{
                            background: p.color + "33", color: p.color, fontWeight: 700,
                            padding: "1px 4px", borderBottom: `2px solid ${p.color}`,
                          }}>{p.marked}</span>
                        );
                      })()}
                    </div>
                  </div>

                  {/* Pattern explanation */}
                  <div style={{
                    padding: 12, background: pm.color + "11", border: `2px solid ${pm.color}44`, marginBottom: 10,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      <span style={{ fontSize: 18 }}>{pm.emoji}</span>
                      <span style={{ fontSize: 14, fontWeight: 900, color: pm.color, fontFamily: mcFont }}>
                        {pm.name}
                      </span>
                    </div>
                    <div style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>
                      {q.patternExplain}
                    </div>
                  </div>

                  {/* AKB or direct answer */}
                  {q.akb ? (
                    <div style={{ padding: 12, background: MC.bedrock, border: `2px solid ${MC.stoneDark}` }}>
                      <div style={{ fontSize: 12, fontWeight: 900, color: MC.gold, fontFamily: mcFont, marginBottom: 10, letterSpacing: 1 }}>
                        MODELANTWOORD (AKB):
                      </div>
                      {[
                        { letter: "A", color: "#5aaa7a", text: q.akb.A },
                        { letter: "K", color: "#6ba8c4", text: q.akb.K },
                        { letter: "B", color: "#c4a060", text: q.akb.B },
                      ].map((s, i) => (
                        <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", marginBottom: 6 }}>
                          <div style={{
                            minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center",
                            background: s.color, color: MC.bedrock, fontSize: 13, fontWeight: 900, fontFamily: mcFont,
                          }}>{s.letter}</div>
                          <div style={{ fontSize: 13, color: MC.text, fontFamily: mcFont, lineHeight: 1.7 }}>{s.text}</div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ padding: 12, background: MC.bedrock, border: `2px solid ${MC.stoneDark}` }}>
                      <div style={{ fontSize: 12, fontWeight: 900, color: MC.gold, fontFamily: mcFont, marginBottom: 6, letterSpacing: 1 }}>
                        ANTWOORD:
                      </div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: MC.text, fontFamily: mcFont }}>
                        {q.answer}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

const MODULES = [
  { id: "timeline", emoji: "🕐", name: "Tijdlijn-Bouwer", desc: "Oefen met chronologische volgorde", maxXP: 110, color: "#6ba8c4" },
  { id: "pattern", emoji: "🔍", name: "Patroonherkenner", desc: "Herken de 6 vraagtypen", maxXP: 150, color: "#5aaa7a" },
  { id: "akb", emoji: "🏗️", name: "AKB-Bouwer", desc: "Bouw antwoorden stap voor stap", maxXP: 300, color: "#7a8abf" },
  { id: "examen", emoji: "📝", name: "Examenvragen", desc: "Alle vragen met patroon & AKB-uitwerking", maxXP: 0, color: "#b07a8a" },
  { id: "ka", emoji: "📋", name: "KA-Bijlage", desc: "Alle kenmerkende aspecten (naslagwerk)", maxXP: 0, color: MC.gold },
];

function App() {
  const [activeModule, setActiveModule] = useState(null);
  const [xp, setXp] = useState({ timeline: 0, pattern: 0, akb: 0 });
  const [showFlash, setShowFlash] = useState(false);

  const addXP = (module) => (amount) => {
    setXp((prev) => ({ ...prev, [module]: prev[module] + amount }));
    setShowFlash(true);
    setTimeout(() => setShowFlash(false), 600);
  };

  const totalXP = xp.timeline + xp.pattern + xp.akb;

  if (activeModule) {
    return (
      <div style={{
        minHeight: "100vh",
        background: `linear-gradient(180deg, ${MC.black} 0%, ${MC.bedrock} 100%)`,
        color: MC.text,
        fontFamily: mcFont,
        padding: "20px 16px",
        maxWidth: 640,
        margin: "0 auto",
      }}>
        {showFlash && (
          <div style={{
            position: "fixed", top: 20, right: 20, padding: "8px 16px",
            background: MC.grass, color: MC.white, border: `2px solid ${MC.grassDark}`,
            fontSize: 14, fontWeight: 900, zIndex: 999, fontFamily: mcFont,
            textShadow: `1px 1px 0 ${MC.grassDark}`,
          }}>
            +XP ⭐
          </div>
        )}

        <button onClick={() => setActiveModule(null)} style={{
          background: "none", border: "none", color: MC.textDim,
          fontSize: 14, cursor: "pointer", marginBottom: 16,
          fontFamily: mcFont, padding: 0, fontWeight: 700,
        }}>
          ← Terug naar menu
        </button>

        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 22, fontWeight: 900, marginBottom: 4, color: MC.text }}>
            {MODULES.find((m) => m.id === activeModule)?.emoji}{" "}
            {MODULES.find((m) => m.id === activeModule)?.name}
          </div>
          {activeModule !== "ka" && activeModule !== "examen" && (
            <XPBar
              xp={xp[activeModule] || 0}
              maxXp={MODULES.find((m) => m.id === activeModule)?.maxXP || 100}
              label="Voortgang"
            />
          )}
        </div>

        {activeModule === "timeline" && <TimelineModule onXP={addXP("timeline")} />}
        {activeModule === "pattern" && <PatternModule onXP={addXP("pattern")} />}
        {activeModule === "akb" && <AKBModule onXP={addXP("akb")} />}
        {activeModule === "examen" && <ExamModule />}
        {activeModule === "ka" && <KAModule />}
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh",
      background: `linear-gradient(180deg, ${MC.black} 0%, ${MC.bedrock} 100%)`,
      color: MC.text,
      fontFamily: mcFont,
      padding: "32px 16px",
      maxWidth: 640,
      margin: "0 auto",
    }}>
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: 36 }}>
        <div style={{ fontSize: 48, marginBottom: 8, lineHeight: 1 }}>⛏️</div>
        <h1 style={{
          fontSize: 24, fontWeight: 900, margin: 0,
          color: MC.gold,
          fontFamily: mcFont,
          letterSpacing: 2,
          textShadow: `3px 3px 0 ${MC.goldDark}, -1px -1px 0 ${MC.black}`,
          textTransform: "uppercase",
        }}>
          Geschiedenis
        </h1>
        <h2 style={{
          fontSize: 20, fontWeight: 900, margin: "4px 0 0 0",
          color: MC.white,
          fontFamily: mcFont,
          letterSpacing: 3,
          textShadow: `2px 2px 0 ${MC.stoneDark}`,
          textTransform: "uppercase",
        }}>
          Examentraining
        </h2>
        <div style={{ fontSize: 12, color: MC.textDim, marginTop: 8, letterSpacing: 1 }}>
          HAVO Centraal Examen — Oefenen met echte examens
        </div>
      </div>

      {/* Tips voor rust in je hoofd */}
      <div style={{
        background: MC.bedrockLight,
        border: `3px solid ${MC.goldDark}`,
        padding: 16, marginBottom: 24,
        boxShadow: mcBoxShadowDark,
      }}>
        <div style={{
          fontSize: 15, fontWeight: 900, color: MC.gold, fontFamily: mcFont,
          textAlign: "center", marginBottom: 12, letterSpacing: 1,
        }}>
          🧠 Tips voor rust in je hoofd!
        </div>

        {[
          { emoji: "📕", title: "Het 'Verboden Boekje'",
            text: "Leg het bronnenboekje dicht en links van je neer. Open het pas als de vraag zegt \"Gebruik bron X\". Zoek als een laserstraal naar het antwoord, klap het dicht." },
          { emoji: "📋", title: "De KA-Bijlage is heilig",
            text: "De lijst met Kenmerkende Aspecten zit achterin je bronnenboekje. Schrijf ze letterlijk over — ga nooit zelf een zin verzinnen." },
          { emoji: "🖍️", title: "Filter met drie kleuren",
            text: "Geel = namen & jaartallen. Roze = signaalwoorden (omdat, waardoor, gevolg). Groen = het bewijs dat je letterlijk in je antwoord gebruikt." },
        ].map((tip, i) => (
          <div key={i} style={{
            padding: 10, marginBottom: i < 2 ? 6 : 0,
            background: MC.bedrock, border: `2px solid ${MC.stoneDark}`,
          }}>
            <div style={{ fontSize: 13, fontWeight: 900, color: MC.text, fontFamily: mcFont, marginBottom: 3 }}>
              {tip.emoji} {tip.title}
            </div>
            <div style={{ fontSize: 12, color: MC.textDim, fontFamily: mcFont, lineHeight: 1.6 }}>
              {tip.text}
            </div>
          </div>
        ))}
      </div>

      {/* Modules */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {MODULES.map((mod) => (
          <button
            key={mod.id}
            onClick={() => setActiveModule(mod.id)}
            style={{
              background: MC.bedrock,
              border: `3px solid ${MC.stoneDark}`,
              padding: 18,
              cursor: "pointer",
              textAlign: "left",
              transition: "all 0.1s",
              fontFamily: mcFont,
              boxShadow: mcBoxShadowDark,
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.border = `3px solid ${MC.gold}`;
              e.currentTarget.style.background = MC.bedrockLight;
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.border = `3px solid ${MC.stoneDark}`;
              e.currentTarget.style.background = MC.bedrock;
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{
                width: 52, height: 52,
                border: `3px solid ${MC.stoneDark}`,
                background: MC.bedrockLight,
                display: "flex",
                alignItems: "center", justifyContent: "center",
                fontSize: 28, flexShrink: 0,
                boxShadow: mcBoxShadowDark,
              }}>
                {mod.emoji}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 16, fontWeight: 900, color: MC.white, marginBottom: 3, textShadow: `1px 1px 0 ${MC.black}` }}>
                  {mod.name}
                </div>
                <div style={{ fontSize: 12, color: MC.textDim }}>{mod.desc}</div>
                {mod.maxXP > 0 && (
                  <div style={{ marginTop: 8 }}>
                    <XPBar xp={xp[mod.id] || 0} maxXp={mod.maxXP} label="" />
                  </div>
                )}
              </div>
              <div style={{ color: MC.gold, fontSize: 22, fontWeight: 900 }}>▶</div>
            </div>
          </button>
        ))}
      </div>

      {/* Footer tip */}
      <div style={{
        marginTop: 32, padding: 16,
        background: MC.bedrockLight, border: `2px solid ${MC.goldDark}`,
        textAlign: "center",
      }}>
        <div style={{ fontSize: 12, color: MC.textDim, lineHeight: 1.6 }}>
          💡 <strong style={{ color: MC.gold }}>TIP:</strong> Begin met de Tijdlijn-Bouwer, daarna de Patroonherkenner, en als laatste de AKB-Bouwer.
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
